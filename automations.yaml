# ---------------------------------------------------------------------------
# Kintamieji (pakoreguok pagal poreikį):
#   SLENKSTIS:      22 kWh  = baterija 14 kWh + ~8 kWh dienos sąnaudos
#   NAMŲ SĄNAUDOS:  0.7 kW  = vidutinis naktinis sunaudojimas
#   IŠKROVIMO SROVĖ:150 A   = baterijos iškrovimo greitis (NE eksporto riba —
#                             atidavimą į tinklą inverteris riboja atskiru parametru)
#   GAMYBOS PRADŽIA:08:00   = laikas, iki kurio baterija turi pasiekti 12%
# ---------------------------------------------------------------------------

- id: solis_morning_mode
  alias: "Solis - Ryto režimas pagal prognozę"
  description: >
    06:00: nustato inverterio režimą pagal šiandienos Solcast prognozę.
    Taip pat išjungia naktinį TOU iškrovimo slotą.
  trigger:
    - platform: time
      at: "06:00:00"
  condition:
    # Rankinio valdymo režimu nesikišti — vartotojas pats valdo iškrovimą
    - condition: state
      entity_id: input_boolean.manual_tou_override
      state: "off"
  action:
    - variables:
        forecast_raw: "{{ states('sensor.solcast_pv_forecast_forecast_today') | float(0) }}"
        # Adaptyvi korekcija — AppDaemon mokosi iš faktas/prognozė santykio
        factor: "{{ states('sensor.solcast_correction_factor') | float(1) }}"
        forecast_today: "{{ (forecast_raw * factor) | round(1) }}"
        soc_now: "{{ states('sensor.solis_s6_eh3p_battery_soc') | float(0) | round(0) }}"
        consumption_today: "{{ states('sensor.consumption_remaining_today') | float(0) | round(1) }}"
        # DINAMINIS slenkstis (2026-07-18, vartotojo logika): Self-Use teisėtas
        # tik jei visa dienos saulė tilptų į LAISVĄ baterijos vietą + namų
        # šviesaus meto vartojimą (~50 % paros) be eksporto. Tuščiam kaupikliui
        # tai ~14.4 + ~7.5 ≈ 22 kWh (sutampa su senu statiniu slenksčiu),
        # pusiau pilnam — ~15 kWh. Viršijus → Feed-in Priority: eksportas nuo
        # pirmų vatų, baterija pildosi tik iš >1 kW pertekliaus.
        threshold: "{{ ((100 - soc_now) * 0.16 + consumption_today * 0.5) | round(1) }}"
        target_soc: "{{ [states('sensor.target_soc_effective') | float(100) | round(0) | int, 5] | max }}"
        # Naktinė iškrova dar nebaigta: slotas ON ir SOC virš tikslo. Tokiu
        # atveju 06:00 nesikiša — morning_room_check (05:30/06:15/06:45) dar
        # žemina target, langas iki 07:30, recalc atnaujina cut-off iki 07:00.
        # (Iki 2026-07-17 slotas būdavo išjungiamas besąlygiškai ir vietos
        # darymas nutrūkdavo 06:00, nors ryto patikros jo dar tikėjosi.)
        night_discharge_active: >-
          {{ is_state('switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1', 'on')
             and soc_now > target_soc + 1 }}
    # Nustatyti dienos režimą
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.storm_mode
              state: "on"
          sequence:
            # Iškrovimo slotą išjungia pats script.solis_storm_reserve_apply
            - service: script.solis_storm_reserve_apply
            - service: notify.persistent_notification
              data:
                title: "Solis - Audros / ESO rezervo režimas ⚡🌩️"
                message: >
                  Audros/ESO rezervo režimas — visa saulė kraunama į bateriją,
                  namus maitina tinklas, baterija namams neiškraunama, eksportas
                  sustabdytas. Prognozė: {{ forecast_today }} kWh.
                  Baterija: {{ soc_now }}%.
        - conditions:
            - condition: template
              value_template: "{{ night_discharge_active }}"
          sequence:
            - service: notify.persistent_notification
              data:
                title: "Solis - Naktinė iškrova tęsiasi 🔋→⚡"
                message: >
                  06:00 režimas nekeičiamas: baterija {{ soc_now }}% dar virš
                  tikslo {{ target_soc }}% — TOU iškrova toliau daro vietą
                  šiandienos saulei (langas iki 07:30, cut-off atnaujinamas
                  iki 07:00). Prognozė: {{ forecast_today }} kWh.
        - conditions:
            - condition: template
              value_template: "{{ forecast_today > threshold }}"
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
            - service: select.select_option
              target:
                entity_id: select.solis_s6_eh3p_work_mode
              data:
                option: "Feed-in Priority"
            - service: notify.persistent_notification
              data:
                title: "Solis - Saulėta diena ☀️"
                message: >
                  Labas rytas! Prognozė: {{ forecast_today }} kWh
                  (Solcast {{ forecast_raw | round(1) }} × korekcija {{ factor | round(2) }},
                  riba: {{ threshold }} kWh).
                  Namams šiandien reikės ~{{ consumption_today }} kWh.
                  Baterija: {{ soc_now }}%.
                  Režimas: Feed-In Priority — perteklius parduodamas į tinklą.
      default:
        - service: switch.turn_off
          target:
            entity_id: switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
        - service: select.select_option
          target:
            entity_id: select.solis_s6_eh3p_work_mode
          data:
            option: "Self-Use"
        - service: notify.persistent_notification
          data:
            title: "Solis - Debesuota diena ☁️"
            message: >
              Labas rytas! Prognozė: {{ forecast_today }} kWh
              (Solcast {{ forecast_raw | round(1) }} × korekcija {{ factor | round(2) }},
              riba: {{ threshold }} kWh).
              Namams šiandien reikės ~{{ consumption_today }} kWh.
              Baterija: {{ soc_now }}%.
              Režimas: Self-Use — pirmiausia kraunama baterija, perteklius namams.
  mode: single

- id: solis_evening_discharge
  alias: "Solis - Vakaro iškrovimas pagal rytojaus prognozę"
  description: >
    20:00: REALIZAVIMO kriterijus (2026-07-14) — baterijoje turi likti tiek
    vietos, kad visa rytojaus saulė, netelpanti į namų apkrovą ir 1 kW ESO
    eksportą, tilptų be nukirpimo. Tikslinį SOC skaičiuoja AppDaemon
    (energy_manager.battery_room_needed: Solcast 30 min periodai × korekcija ×
    PLAN_MARGIN 1.15; ryte 05:30/06:15/06:45 dar pažeminamas pagal intradienos
    santykį). 1% SOC = 0.16 kWh (naudinga 10–100% = 14.4 kWh — BMS fizinis
    dugnas 10%, žemiau iškrauti neįmanoma). Jei esamas SOC viršija tikslą —
    aktyvuoja TOU naktinį iškrovimą (21:00–07:30, srovė 150A) su cut-off ties
    tiksliniu SOC. Kitaip — Self-Use, baterija namams.
  trigger:
    - platform: time
      at: "20:00:00"
  condition:
    # Rankinio valdymo režimu nesikišti — vartotojas pats valdo iškrovimą
    - condition: state
      entity_id: input_boolean.manual_tou_override
      state: "off"
    # Cut-off bypass režimu nesikišti — vartotojas pats valdo iškrovimo slotą
    # (cut-off SOC, srovė, jungiklis); automatika jų neperrašo / neišjungia.
    - condition: state
      entity_id: input_boolean.manual_soc_override
      state: "off"
  action:
    - variables:
        # Koreguota rytojaus prognozė — ta pati, pagal kurią AppDaemon
        # skaičiuoja tikslinį SOC (žalia Solcast × korekcijos koeficientas).
        forecast_tomorrow: >-
          {{ (states('sensor.solcast_pv_forecast_forecast_tomorrow') | float(0)
              * states('sensor.solcast_correction_factor') | float(1)) | round(1) }}
        current_soc: "{{ states('sensor.solis_s6_eh3p_battery_soc') | float(0) }}"
        # Tikslinis SOC — iš AppDaemon (energy_manager.py). Clamp ≥5% — tik
        # apsauga nuo klaidingų reikšmių (pvz. sensorius po restarto dar
        # nepaskelbtas); 5% = inverterio overdischarge riba, bet faktinis BMS
        # dugnas 10% (žemiau iškrauti neįmanoma); force-charge ties 4%.
        target_soc: "{{ [states('sensor.target_soc_effective') | float(100) | round(0) | int, 5] | max }}"
        discharge_needed: "{{ states('sensor.energy_manager_discharge_needed') | float(0) }}"
        # 7 punktas (2026-07-18): iškrovimo PABAIGA taikoma į gamybos pradžią,
        # kad baterija kuo trumpiau stovėtų ties minimumu. Sparta ~1 kWh/val
        # (sloto eksportas ~1 kW) + 0.5 val atsarga; itin saulėtai dienai
        # (>22 kWh) baigiama ~1 val anksčiau (vietos reikia prieš ankstyvą
        # piką). Startas ne ankstesnis nei 21:00; jei energijos daug —
        # natūraliai gaunasi 21:00 (pilnas langas). Laukimo metu inverterį
        # išjungia night_shutdown, pažadina power_on ties sloto startu.
        discharge_start: >-
          {% set m = as_datetime(states('sensor.inverter_morning_on_time')) %}
          {% set morning = m.astimezone() if m is not none
             else (now() + timedelta(days=1)).replace(hour=6, minute=0, second=0, microsecond=0) %}
          {% if morning < now() %}
            {% set morning = (now() + timedelta(days=1)).replace(hour=6, minute=0, second=0, microsecond=0) %}
          {% endif %}
          {% set hours = ((current_soc - target_soc) * 0.16 / 1.0) + 0.5
             + (1.0 if forecast_tomorrow > 22 else 0.0) %}
          {% set start = morning - timedelta(hours=hours) %}
          {% set earliest = now().replace(hour=21, minute=0, second=0, microsecond=0) %}
          {{ (start if start > earliest else earliest).strftime('%H:%M:00') }}
    - choose:
        # 1) Audros/ESO režimas — joks aktyvus iškrovimas, tik namų reikmėms
        - conditions:
            - condition: state
              entity_id: input_boolean.storm_mode
              state: "on"
          sequence:
            - service: script.solis_storm_reserve_apply
            - service: notify.persistent_notification
              data:
                title: "Solis - Audros / ESO rezervo režimas: baterija saugoma ⚡🔋"
                message: >
                  Audros/ESO rezervo režimas — eksportas sustabdytas, baterija
                  namams neiškraunama (laikoma kaip rezervas), namus maitina tinklas.
        # 2) SOC viršija apskaičiuotą tikslą — iškrauti perteklių į tinklą
        - conditions:
            - condition: template
              value_template: "{{ current_soc > target_soc }}"
          sequence:
            # Cut-off SOC = apskaičiuotas tikslas (NE overdischarge parametras!)
            - service: number.set_value
              target:
                entity_id: number.solis_s6_eh3p_grid_time_of_use_discharge_cut_off_soc_slot_1
              data:
                value: "{{ target_soc }}"
            - service: number.set_value
              target:
                entity_id: number.solis_s6_eh3p_grid_time_of_use_discharge_battery_current_slot_1
              data:
                value: 150
            - service: time.set_value
              target:
                entity_id: time.solis_s6_eh3p_grid_time_of_use_discharge_start_slot_1
              data:
                time: "{{ discharge_start }}"
            - service: time.set_value
              target:
                entity_id: time.solis_s6_eh3p_grid_time_of_use_discharge_end_slot_1
              data:
                time: "07:30:00"
            - service: switch.turn_on
              target:
                entity_id: switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
            - service: select.select_option
              target:
                entity_id: select.solis_s6_eh3p_work_mode
              data:
                option: "Feed-in + TOU"
            - service: notify.persistent_notification
              data:
                title: "Solis - Naktinis iškrovimas 🔋→⚡"
                message: >
                  Rytojaus prognozė: {{ forecast_tomorrow | round(1) }} kWh →
                  vietos baterijoje reikia ~{{ forecast_tomorrow | round(1) }} kWh.
                  Tuštinam ~{{ discharge_needed }} kWh: SOC {{ current_soc }}% → {{ target_soc }}%.
                  TOU {{ discharge_start[:5] }}–07:30 (pabaiga taikoma į gamybos
                  pradžią), srovė 150A, sustoja ties {{ target_soc }}%.
      default:
        # 3) SOC jau ≤ tikslo — tuštinti nereikia, baterija lieka namams
        - service: switch.turn_off
          target:
            entity_id: switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
        - service: select.select_option
          target:
            entity_id: select.solis_s6_eh3p_work_mode
          data:
            option: "Self-Use"
        - service: notify.persistent_notification
          data:
            title: "Solis - Iškrovimas nereikalingas 🔋"
            message: >
              Rytojaus prognozė: {{ forecast_tomorrow | round(1) }} kWh.
              Tikslinis SOC {{ target_soc }}% ≥ esamo {{ current_soc }}%.
              Baterija paliekama namams, naktinis eksportas išjungtas.
  mode: single

- id: solis_snapshot_daily_forecast
  alias: "Solis - Įsiminti dienos prognozę (vakar prognozė)"
  description: >
    23:55: nusaugo šiandienos Solcast forecast_today reikšmę į
    input_number.solcast_forecast_yesterday. Kitą dieną ši reikšmė rodoma
    kaip „vakar prognozuota" ir lyginama su faktine vakar gamyba.
  trigger:
    - platform: time
      at: "23:55:00"
  condition:
    - condition: template
      value_template: >
        {{ states('sensor.solcast_pv_forecast_forecast_today')
           not in ['unavailable', 'unknown', 'none', ''] }}
  action:
    - service: input_number.set_value
      target:
        entity_id: input_number.solcast_forecast_yesterday
      data:
        value: "{{ states('sensor.solcast_pv_forecast_forecast_today') | float(0) | round(1) }}"
  mode: single

- id: solis_tou_recalc_5min
  alias: "Solis - TOU: tikslinio SOC perskaičiavimas kas 5 min + išjungimas"
  description: >
    Kas 5 min vakare/naktį (20:05–07:00) perskaičiuoja tikslinį rytinį SOC pagal
    naujausią Solcast rytojaus prognozę ir atnaujina TOU iškrovimo cut-off SOC.
    Kai baterija pasiekia tikslinį SOC — išjungia TOU iškrovimo slotą ir
    persijungia į Self-Use, kad baterija toliau tiektų namams.
    Pakeičia ankstesnį įvykiu paremtą solis_night_tou_soc_reached.
  trigger:
    - platform: time_pattern
      minutes: "/5"
  condition:
    # 20:05–07:00 (langas per vidurnaktį). Pradžia 20:05, kad nesilenktyniautų
    # su solis_evening_discharge (20:00), o pabaiga 07:00 — kad nesikirstų su
    # solis_daytime_feedin_tou (07:00–19:30), kuris naudoja kitą cut-off (floor).
    # 2026-07-01 persidengiant 07:00–08:00 recalc užmušdavo dienos TOU slotą.
    - condition: time
      after: "20:05:00"
      before: "07:00:00"
    # Audros/ESO rezervo režimu nesikišti — galioja forsuoto krovimo slotas
    - condition: state
      entity_id: input_boolean.storm_mode
      state: "off"
    # Rankinio valdymo režimu nesikišti — vartotojas pats valdo iškrovimą
    - condition: state
      entity_id: input_boolean.manual_tou_override
      state: "off"
    # Cut-off bypass režimu nesikišti — vartotojas pats valdo iškrovimo slotą
    # (cut-off SOC, srovė, jungiklis); automatika jų neperrašo / neišjungia.
    - condition: state
      entity_id: input_boolean.manual_soc_override
      state: "off"
  action:
    # 1) Tikslinį SOC publikuoja AppDaemon (energy_manager.py) kas 5–30 min —
    #    update_entity nebereikalingas (tai nebe template sensorius).
    #    Clamp ≥5% — apsauga nuo klaidingų reikšmių (faktinis BMS dugnas 10%);
    #    jei sensorius nepasiekiamas — 100% (= neiškrauti nieko).
    - variables:
        target_soc: "{{ [states('sensor.target_soc_effective') | float(100) | round(0) | int, 5] | max }}"
        current_soc: "{{ states('sensor.solis_s6_eh3p_battery_soc') | float(100) }}"
        tou_on: "{{ is_state('switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1', 'on') }}"
    # Jei iškrovimo slotas išjungtas — nieko nedaryti (nerašinėti į Modbus
    # registrus kas 5 min be reikalo).
    - condition: template
      value_template: "{{ tou_on }}"
    # 2) Atnaujinti TOU cut-off SOC nauja tiksline reikšme
    - service: number.set_value
      target:
        entity_id: number.solis_s6_eh3p_grid_time_of_use_discharge_cut_off_soc_slot_1
      data:
        value: "{{ target_soc }}"
    # 3) Pasiekus tikslinį SOC — išjungti iškrovimo slotą
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ tou_on and current_soc <= target_soc }}"
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
            - service: number.set_value
              target:
                entity_id: number.solis_s6_eh3p_grid_time_of_use_discharge_battery_current_slot_1
              data:
                value: 0
            # Po iškrovos: DINAMINIS slenkstis kaip ryto režime (2026-07-18) —
            # jei ateinančios dienos saulė netilptų į laisvą baterijos vietą +
            # namų šviesaus meto vartojimą, likti Feed-in Priority (eksportas
            # nuo pirmų vatų). Kitaip — Self-Use namams. Po vidurnakčio
            # (00:00–07:00) ateinanti diena = forecast_TODAY; forecast_tomorrow
            # tuo metu jau rodo porytdienį.
            - variables:
                coming_day_kwh: >-
                  {{ ((states('sensor.solcast_pv_forecast_forecast_today')
                       if now().hour < 12
                       else states('sensor.solcast_pv_forecast_forecast_tomorrow')) | float(0)
                      * states('sensor.solcast_correction_factor') | float(1)) | round(1) }}
                dyn_threshold: >-
                  {{ ((100 - current_soc) * 0.16
                      + states('sensor.consumption_forecast_tomorrow') | float(14) * 0.5) | round(1) }}
                next_mode: "{{ 'Feed-in Priority' if coming_day_kwh > dyn_threshold else 'Self-Use' }}"
            - service: select.select_option
              target:
                entity_id: select.solis_s6_eh3p_work_mode
              data:
                option: "{{ next_mode }}"
            - service: notify.persistent_notification
              data:
                title: "Solis - TOU išjungtas: SOC tikslas pasiektas 🔋"
                message: >
                  Baterija: {{ current_soc }}%. Tikslinis SOC: {{ target_soc }}%.
                  Ateinančios dienos prognozė: {{ coming_day_kwh }} kWh →
                  TOU slotas išjungtas, režimas: {{ next_mode }}{{ ' (rytinis eksportas)' if next_mode == 'Feed-in Priority' else ' — baterija tiekia namams' }}.
  mode: single

- id: solis_daytime_battery_protect
  alias: "Solis - Baterija < 11%: stabdyti eksportą"
  description: >
    Dienos metu: jei baterija nukrinta iki 11% → keisti į Self-Use.
    Taip stabdomas eksportas iš baterijos. Debesėlio epizodai čia
    NESUREAGUOJA — triggeris tik į faktinį SOC, ne į saulės kritimą.
    11% — 1% virš BMS fizinio dugno 10% (rodmuo 10 ≈ tikras 0, žemiau
    neįmanoma; ankstesnis slenkstis 6% buvo nepasiekiamas = apsauga mirusi).
  trigger:
    - platform: numeric_state
      entity_id: sensor.solis_s6_eh3p_battery_soc
      below: 11
  condition:
    - condition: time
      after: "07:00:00"
      before: "20:00:00"
    # Rankinio valdymo režimu nesikišti — vartotojas pats valdo iškrovimą
    - condition: state
      entity_id: input_boolean.manual_tou_override
      state: "off"
    - condition: template
      value_template: >
        {{ states('select.solis_s6_eh3p_work_mode')
           in ['Feed-in Priority', 'Feed-in + TOU'] }}
  action:
    - service: select.select_option
      target:
        entity_id: select.solis_s6_eh3p_work_mode
      data:
        option: "Self-Use"
    - service: notify.persistent_notification
      data:
        title: "Solis - Baterija išsikrovė 🔴"
        message: >
          Baterija: {{ states('sensor.solis_s6_eh3p_battery_soc') }}%.
          Persijungta į Self-Use — eksportas iš baterijos sustabdytas.
          Saulė užkraus bateriją ir eksportas atsinaujins automatiškai.
  mode: single

- id: solis_daytime_export_resume
  alias: "Solis - Baterija > 15%: atnaujinti eksportą"
  description: >
    Grįžti į Feed-In Priority, kad perteklius būtų parduodamas. Riba 15%
    (7 punktas, 2026-07-18): nuo dugno (BMS 10%) saulė pirma pakelia ~5 pp
    buferį, tada eksportas atnaujinamas — nebelaukiama 30% (iki tol normalią
    dieną baterija be reikalo ilgai stovėdavo žemai, o eksportas vėluodavo).
    Persiskaičiuoja kas 15 min, todėl neužstringa Self-Use po midday dipo.
  trigger:
    - platform: numeric_state
      entity_id: sensor.solis_s6_eh3p_battery_soc
      above: 15
    - platform: time_pattern
      minutes: "/15"
  condition:
    - condition: time
      after: "07:00:00"
      before: "20:00:00"
    # time_pattern trigeris suveikia nepriklausomai nuo SOC — patikrinam ribą.
    - condition: template
      value_template: >
        {{ states('sensor.solis_s6_eh3p_battery_soc') | float(0) > 15 }}
    # Audros/ESO režimas — neatnaujinti eksporto, baterija lieka tik namams
    - condition: state
      entity_id: input_boolean.storm_mode
      state: "off"
    # Rankinio valdymo režimu nesikišti — vartotojas pats valdo iškrovimą
    - condition: state
      entity_id: input_boolean.manual_tou_override
      state: "off"
    # Modbus select po „Self-Use" nustatymo rodo „Self-Use + TOU" (TOU bitas —
    # atvaizdavimo artefaktas), todėl vien state: "Self-Use" niekada nesutapdavo
    # ir perjungimas į Feed-in Priority neveikė (2026-07-14 pastebėta: eksportas
    # prasidėtų tik baterijai prisipildžius → vėlyvas saulės nukirpimas).
    - condition: template
      value_template: >
        {{ states('select.solis_s6_eh3p_work_mode')
           in ['Self-Use', 'Self-Use + TOU'] }}
    # Perjungti tik kai PV jau dengia namus: deficito valandomis Feed-in
    # Priority tik perkeltų namus ant tinklo (baterija stovėtų), eksportuoti
    # vis tiek nebūtų ko (2026-07-14, vartotojo pastaba dėl vartojimo iš
    # baterijos).
    - condition: template
      value_template: >
        {{ states('sensor.solis_s6_eh3p_total_pv_power') | float(0)
           > states('sensor.solis_s6_eh3p_household_load_power') | float(999999) }}
    - condition: numeric_state
      entity_id: sensor.solcast_pv_forecast_forecast_remaining_today
      above: 2
  action:
    - service: select.select_option
      target:
        entity_id: select.solis_s6_eh3p_work_mode
      data:
        option: "Feed-in Priority"
    - service: notify.persistent_notification
      data:
        title: "Solis - Eksportas atnaujintas ✅"
        message: >
          Baterija: {{ states('sensor.solis_s6_eh3p_battery_soc') }}%.
          Likusios dienos prognozė: {{ states('sensor.solcast_pv_forecast_forecast_remaining_today') | round(1) }} kWh.
          Grįžtama į Feed-In Priority.
  mode: single

- id: solis_daytime_feedin_tou
  alias: "Solis - Dienos tolygus eksportas (Feed-in + TOU, pagal perteklių)"
  description: >
    Saulėtą dieną, kai REALIZAVIMO kriterijus rodo, kad likusi saulė netilps
    į laisvą baterijos vietą + namus + 1 kW eksportą
    (sensor.energy_manager_room_shortfall > 1 kWh; AppDaemon, su marža ir
    intradienos santykiu) ir baterija pasiekė ribą+1%
    (SOC ≥ daytime_export_floor + 1%), įjungia Feed-in + TOU: baterija
    laikoma ~ties riba (TOU cut-off = floor, srovė 150A, langas 07:00–19:30),
    perteklius tolygiai į tinklą. HISTEREZĖ (2026-07-08): trūkumui iškritus
    <0.2 kWh — grąžinamas Self-Use ir slotas išjungiamas, baterija kaupia.
    2026-07-14 perjungta nuo energy_manager_surplus (be vartojimo/eksporto
    narių — armuodavo eksportą, kai vietos ir taip užtenka) prie
    room_shortfall. Langas iki 19:30, kad nesikirstų su naktiniu
    solis_tou_recalc_5min (20:05–07:00) ir solis_evening_discharge (20:00).
  trigger:
    - platform: time_pattern
      minutes: "/15"
  condition:
    - condition: time
      after: "07:00:00"
      before: "19:30:00"
    # Audros/ESO režimu nesikišti
    - condition: state
      entity_id: input_boolean.storm_mode
      state: "off"
    # Rankinio valdymo režimu nesikišti
    - condition: state
      entity_id: input_boolean.manual_tou_override
      state: "off"
    - condition: state
      entity_id: input_boolean.manual_soc_override
      state: "off"
  variables:
    # Floor ≥ 12: BMS fizinis dugnas 10 % — 2026-07-14 inverteris ATMETĖ
    # cut-off 6 įrašą (liko senas 57, baterija užšalo aktyviame slote).
    floor: "{{ [states('input_number.daytime_export_floor') | float(12) | round(0) | int, 12] | max }}"
    surplus: "{{ states('sensor.energy_manager_room_shortfall') | float(0) }}"
    soc: "{{ states('sensor.solis_s6_eh3p_battery_soc') | float(0) }}"
    # Reali sloto būsena (jungiklis + langas + režimas), ne vien režimo
    # etiketė: 2026-07-01 užstrigo „Feed-in + TOU su išjungtu slotu" ir vien
    # mode-sąlyga blokavo atsistatymą visą dieną. Taip pat pergaudo naktinį
    # slotą (start 21:00), likusį ON po nebaigtos nakties iškrovos.
    daytime_slot_active: >-
      {{ is_state('switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1', 'on')
         and states('time.solis_s6_eh3p_grid_time_of_use_discharge_start_slot_1') == '07:00:00'
         and is_state('select.solis_s6_eh3p_work_mode', 'Feed-in + TOU') }}
    # Dabartinis sloto cut-off: ≥80 = „viršūnės skutimo" variantas (7 punktas),
    # <80 = pertekliaus (floor) variantas — šakos pagal tai atskiriamos.
    cutoff_now: "{{ states('number.solis_s6_eh3p_grid_time_of_use_discharge_cut_off_soc_slot_1') | float(0) }}"
    # SVEIKATOS ZONA (2026-07-18): nuosaikią dieną viršūnė skutama ties 80 %
    # (kaupiklis 20–80 % ruože), aukštos gamybos dieną (koreguota prognozė
    # > 28 kWh) — ties 90 % (realizavimui pilnas diapazonas iki 100).
    shave_cutoff: >-
      {{ 90 if (states('sensor.solcast_pv_forecast_forecast_today') | float(0)
                * states('sensor.solcast_correction_factor') | float(1)) > 28
         else 80 }}
  action:
    - choose:
        # 1) Yra perteklius ir yra ką atiduoti — įjungti dienos eksportą,
        #    jei dar nesukonfigūruotas (neperrašinėti kas 15 min). Gali
        #    perimti ir viršūnės skutimo slotą (cutoff_now >= 90) — gilesnis
        #    floor cut-off svarbesnis. Re-arm slenkstis floor+5 (7 punktas):
        #    nuo dugno pirma pakylama ~5 pp iš saulės, tik tada vėl
        #    eksportuojama.
        - conditions:
            - condition: template
              value_template: >
                {{ surplus > 1 and soc >= floor + 5
                   and (not daytime_slot_active or cutoff_now >= 80) }}
          sequence:
            - service: number.set_value
              target:
                entity_id: number.solis_s6_eh3p_grid_time_of_use_discharge_cut_off_soc_slot_1
              data:
                value: "{{ floor }}"
            - service: number.set_value
              target:
                entity_id: number.solis_s6_eh3p_grid_time_of_use_discharge_battery_current_slot_1
              data:
                value: 150
            - service: time.set_value
              target:
                entity_id: time.solis_s6_eh3p_grid_time_of_use_discharge_start_slot_1
              data:
                time: "07:00:00"
            - service: time.set_value
              target:
                entity_id: time.solis_s6_eh3p_grid_time_of_use_discharge_end_slot_1
              data:
                time: "19:30:00"
            - service: switch.turn_on
              target:
                entity_id: switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
            - service: select.select_option
              target:
                entity_id: select.solis_s6_eh3p_work_mode
              data:
                option: "Feed-in + TOU"
            - service: notify.persistent_notification
              data:
                title: "Solis - Dienos tolygus eksportas ☀️→⚡"
                message: >
                  Vietos trūkumas saulei: {{ surplus }} kWh netilps
                  (baterija + namai + 1 kW eksportas). Baterija: {{ soc }}%.
                  Feed-in + TOU: baterija laikoma ~{{ floor }}%, perteklius
                  tolygiai į tinklą (TOU 07:00–19:30, 150A).
        # 2) VIRŠŪNĖS SKUTIMAS (7 punktas + sveikatos zona): SOC pasiekus
        #    lubas (nuosaikią dieną 80%, aukštos gamybos — 90%) — laikyti
        #    iškrovimo slotą aktyvų su cut-off ties lubomis. Mažina laiką
        #    aukštame SOC (kalendorinis LFP senėjimas) ir sugeria debesų
        #    susitelkimų svyravimus. Slotas lieka armuotas visai dienai.
        - conditions:
            - condition: template
              value_template: >
                {{ soc >= shave_cutoff + 1 and not daytime_slot_active }}
          sequence:
            - service: number.set_value
              target:
                entity_id: number.solis_s6_eh3p_grid_time_of_use_discharge_cut_off_soc_slot_1
              data:
                value: "{{ shave_cutoff }}"
            - service: number.set_value
              target:
                entity_id: number.solis_s6_eh3p_grid_time_of_use_discharge_battery_current_slot_1
              data:
                value: 150
            - service: time.set_value
              target:
                entity_id: time.solis_s6_eh3p_grid_time_of_use_discharge_start_slot_1
              data:
                time: "07:00:00"
            - service: time.set_value
              target:
                entity_id: time.solis_s6_eh3p_grid_time_of_use_discharge_end_slot_1
              data:
                time: "19:30:00"
            - service: switch.turn_on
              target:
                entity_id: switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
            - service: select.select_option
              target:
                entity_id: select.solis_s6_eh3p_work_mode
              data:
                option: "Feed-in + TOU"
            - service: notify.persistent_notification
              data:
                title: "Solis - Viršūnės skutimas ✂️🔋"
                message: >
                  Baterija {{ soc }}% — iškrovimo slotas aktyvuotas su
                  cut-off {{ shave_cutoff }}%: viršum laikomas kiekis
                  skutamas į tinklą (sveikatos zona / debesų buferis).
        # 3) DUGNO ATSISTATYMAS (7 punktas): floor variantas pasiekė dugną —
        #    išjungti slotą ir Self-Use, kad saulė pirma pakeltų SOC ~5 pp
        #    (re-arm šakoje 1 reikalauja floor+5); tik tada vėl eksportas.
        - conditions:
            - condition: template
              value_template: >
                {{ daytime_slot_active and cutoff_now < 80 and soc <= floor }}
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
            - service: select.select_option
              target:
                entity_id: select.solis_s6_eh3p_work_mode
              data:
                option: "Self-Use"
            - service: notify.persistent_notification
              data:
                title: "Solis - Dugnas pasiektas, kaupiam 🔋"
                message: >
                  Baterija {{ soc }}% ties dugnu {{ floor }}%. Slotas išjungtas,
                  Self-Use — saulė pirma pakels iki {{ floor + 5 }}%, tada
                  eksportas atsinaujins.
        # 4) Pertekliaus nebėra (<0.2 kWh) — išjungti floor slotą ir grąžinti
        #    Self-Use: baterija kaupia PV link target_soc. Viršūnės skutimo
        #    varianto (cut-off 90) NELIEČIA — jis teisėtas ir be pertekliaus.
        #    Vakare 20:00 logika perima kaip įprasta.
        - conditions:
            - condition: template
              value_template: >
                {{ surplus < 0.2 and daytime_slot_active and cutoff_now < 80 }}
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
            - service: select.select_option
              target:
                entity_id: select.solis_s6_eh3p_work_mode
              data:
                option: "Self-Use"
            - service: notify.persistent_notification
              data:
                title: "Solis - Dienos eksportas sustabdytas 🔋"
                message: >
                  Vietos trūkumo nebėra ({{ surplus }} kWh) — likusi saulė
                  tilps. Baterija {{ soc }}% kaupia link
                  {{ states('sensor.energy_manager_target_soc') }}% tikslo.
  mode: single

- id: solis_storm_mode_toggle
  alias: "Solis - Audros/ESO režimo perjungimas (greitas pritaikymas)"
  description: >
    Kai įjungiamas/išjungiamas Audros/ESO jungiklis — iškart pritaiko arba
    panaikina rezervo režimą, nelaukiant 06:00 / 20:00. Įjungus: visa saulė į
    bateriją, namus maitina tinklas, baterija namams neiškraunama, eksportas
    sustabdytas. Išjungus: grąžinamas Self-Use, normali logika atsinaujins
    kitą 06:00 / 20:00.
  trigger:
    - platform: state
      entity_id: input_boolean.storm_mode
  condition: []
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.storm_mode
              state: "on"
          sequence:
            - service: script.solis_storm_reserve_apply
            - service: notify.persistent_notification
              data:
                title: "Solis - Audros / ESO rezervo režimas įjungtas ⚡🔋"
                message: >
                  Visa saulė kraunama į bateriją, namus maitina tinklas, baterija
                  namams neiškraunama, eksportas sustabdytas. Baterija: {{
                  states('sensor.solis_s6_eh3p_battery_soc') }}%.
      default:
        - service: script.solis_storm_reserve_clear
        - service: notify.persistent_notification
          data:
            title: "Solis - Audros / ESO rezervo režimas išjungtas ✅"
            message: >
              Grąžinta į Self-Use. Normali dienos/nakties logika atsinaujins
              kitą 06:00 / 20:00.
  mode: single

- id: solis_night_inverter_shutdown
  alias: "Solis - Naktinis inverterio išjungimas (idle 130 W → off 30 W)"
  description: >
    Naktį, kai baterija pasiekia tikslinį rytinį SOC ir nebėra ko iškrauti,
    inverteris išjungiamas (power_state off) — kitaip jo ~130 W idle
    savivartojimas visą naktį sektų bateriją žemiau tikslo. Išjungto
    inverterio valdymo plokštė ima ~30 W iš tinklo, tad grynasis sutaupymas
    ~100 W. Namus toliau maitina tinklas, Modbus lieka gyvas, todėl rytą
    įjungiama nuotoliniu būdu. Ekonomiką skaičiuoja AppDaemon
    (sensor.inverter_night_economics). Įjungiama atgal:
    solis_morning_inverter_power_on (pagal Solcast gamybos pradžią).
    Valdoma jungikliu input_boolean.night_inverter_shutdown. Audros režimu
    nevykdoma — inverteris reikalingas backup funkcijai.
  trigger:
    - platform: time_pattern
      minutes: "/5"
    - platform: sun
      event: sunset
    - platform: state
      entity_id: input_boolean.night_inverter_shutdown
      to: "on"
  condition:
    - condition: state
      entity_id: input_boolean.night_inverter_shutdown
      state: "on"
    - condition: state
      entity_id: input_boolean.storm_mode
      state: "off"
    # Rankinio valdymo režimu nesikišti — inverteris reikalingas eksportui
    - condition: state
      entity_id: input_boolean.manual_tou_override
      state: "off"
    - condition: state
      entity_id: sun.sun
      state: "below_horizon"
    - condition: state
      entity_id: switch.solis_s6_eh3p_power_state
      state: "on"
    # Išjungti galima dviem atvejais (7 punktas, 2026-07-18):
    #  a) TOU slotas išjungtas IR baterija jau ties tiksliniu SOC (senoji
    #     logika — iškrova baigta);
    #  b) slotas ARMUOTAS, bet jo startas dar ateityje (atidėtas iškrovimas,
    #     taikomas į gamybos pradžią) — laukimo metu inverteris nereikalingas,
    #     jį ties sloto startu pažadins solis_morning_inverter_power_on.
    #     „Viduje lango" tikrinama per HH:MM:SS palyginimą: vakarinis startas
    #     (≥12:00) — langas kerta vidurnaktį; ankstyvo ryto startas (<12:00)
    #     — langas tos pačios paros 0–07:30 ruože.
    - condition: template
      value_template: >
        {% set slot_on = is_state('switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1', 'on') %}
        {% set start = states('time.solis_s6_eh3p_grid_time_of_use_discharge_start_slot_1') | default('21:00:00', true) %}
        {% set end = '07:30:00' %}
        {% set nowt = now().strftime('%H:%M:%S') %}
        {% set inside = (start >= '12:00:00' and (nowt >= start or nowt < end))
           or (start < '12:00:00' and nowt >= start and nowt < end) %}
        {% set soc_ok = states('sensor.solis_s6_eh3p_battery_soc') | float(100)
           <= [states('sensor.target_soc_effective') | float(100), 5] | max + 1 %}
        {{ (not slot_on and soc_ok) or (slot_on and not inside) }}
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.solis_s6_eh3p_power_state
    - service: notify.persistent_notification
      data:
        title: "Solis - Inverteris išjungtas nakčiai 💤"
        message: >
          Baterija {{ states('sensor.solis_s6_eh3p_battery_soc') }}% pasiekė
          tikslinį SOC {{ [states('sensor.target_soc_effective') | float(100), 5] | max | round(0) }}%.
          Inverteris išjungtas: idle 130 W (iš baterijos) → 30 W (iš tinklo),
          sutaupoma ~{{ state_attr('sensor.inverter_night_economics', 'sutaupymas_nakti_eur') | float(0) | round(2) }} €
          per naktį. Namus maitina tinklas.
          Įsijungs {{ state_attr('sensor.inverter_morning_on_time', 'laikas') | default('prieš gamybos pradžią', true) }} —
          kai Solcast numato >100 W gamybą.
  mode: single

- id: solis_morning_inverter_power_on
  alias: "Solis - Ryto inverterio įjungimas pagal Solcast gamybos pradžią"
  description: >
    Įjungia inverterį (power_state on) po naktinio išjungimo tada, kai pagal
    Solcast pusvalandinę prognozę PV gamyba viršys ~100 W (idle/off
    skirtumą) — laiką skaičiuoja AppDaemon (sensor.inverter_morning_on_time,
    timestamp). Birželį tai ~1–2 val. vėliau už saulėtekį, kas sutaupo
    ~100 W tuščio veikimo. Realaus signalo trigeris: Eimo elektrinės faktinė
    PV gamyba >200 W (10 min) — apsauga nuo Solcast ryto pesimizmo, kai
    prognozuojamas 100 W perkirtimas vėluoja prieš tikrąją gamybos pradžią
    (Solis su išjungtu inverteriu savo PV nemato; Eimo cloud sensorius čia
    tik informacinis saulės signalas, ne valdymo maišymas tarp elektrinių).
    Atsarginis trigeris 10:00, jei sensoriai nepasiekiami. Saugikliai:
    įjungiama iškart, jei įjungiamas audros režimas (reikia backup) arba
    išjungiamas naktinio išjungimo jungiklis.
  trigger:
    - platform: time
      at: sensor.inverter_morning_on_time
    # Atidėto naktinio iškrovimo startas (7 punktas): jei inverteris buvo
    # išjungtas laukimo metu — pažadinti, kad slotas realiai vykdytųsi.
    - platform: time
      at: time.solis_s6_eh3p_grid_time_of_use_discharge_start_slot_1
    - platform: numeric_state
      entity_id: sensor.eimo_pv_power
      above: 200
      for: "00:10:00"
    - platform: time
      at: "10:00:00"
    - platform: state
      entity_id: input_boolean.night_inverter_shutdown
      to: "off"
    - platform: state
      entity_id: input_boolean.storm_mode
      to: "on"
  condition:
    - condition: state
      entity_id: switch.solis_s6_eh3p_power_state
      state: "off"
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.solis_s6_eh3p_power_state
    - service: notify.persistent_notification
      data:
        title: "Solis - Inverteris įjungtas ☀️"
        message: >
          Inverteris įjungtas po naktinio išjungimo
          (baterija: {{ states('sensor.solis_s6_eh3p_battery_soc') }}%).
          Solcast numato gamybos pradžią — inverteris pasiruošęs dienai.
  mode: single

- id: solis_low_soc_night_shutdown
  alias: "Solis - Naktinis išjungimas žemo SOC juostoje (churn apsauga)"
  description: >
    Apsauga nuo nakties ciklavimo ties apatine riba. BMS/firmware naktį
    laiko bateriją 10–15 % juostoje: inverteris trumpam prisikrauna iš
    tinklo ir vėl išsikrauna (pjūklas 10↔15 %) — sekli ciklika, baterijos
    dėvėjimas, round-trip nuostolis (2026-07-06 serijos max 5.9 kWh/naktį).
    Senasis 5.5 % slenkstis niekada nesuveikdavo, nes BMS SOC žemiau 10 %
    naktį nenuleidžia. Dvi pakopos: SOC ≤ 6 % — išjungiama bet kuriuo
    nakties metu (senoji apsauga nuo force-charge ties 4–5 %); SOC ≤ 16 %
    (churn juosta) — tik 20:30–10:00 lange, kad netrukdytų vakariniam TOU
    eksportui žiemą. Išjungus namus maitina tinklas, baterija ilsisi.
    Veikia NEPRIKLAUSOMAI nuo input_boolean.night_inverter_shutdown —
    tai apsauga, ne ekonomika. Rytą įjungia solis_morning_inverter_power_on
    (Solcast gamybos pradžia arba 10:00 atsarginis). Audros ir rankinio
    valdymo režimais nevykdoma.
  trigger:
    - platform: numeric_state
      entity_id: sensor.solis_s6_eh3p_battery_soc
      below: 16
    - platform: time_pattern
      minutes: "/15"
  condition:
    - condition: state
      entity_id: sun.sun
      state: "below_horizon"
    - condition: state
      entity_id: input_boolean.storm_mode
      state: "off"
    - condition: state
      entity_id: input_boolean.manual_tou_override
      state: "off"
    - condition: state
      entity_id: switch.solis_s6_eh3p_power_state
      state: "on"
    # TOU eksportas turi būti pasibaigęs (slotą išjungia solis_tou_recalc_5min)
    - condition: state
      entity_id: switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
      state: "off"
    - condition: template
      value_template: >
        {% set soc = states('sensor.solis_s6_eh3p_battery_soc') | float(100) %}
        {{ soc <= 6 or (soc <= 16
           and (now() >= today_at('20:30') or now() < today_at('10:00'))) }}
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.solis_s6_eh3p_power_state
    - service: notify.persistent_notification
      data:
        title: "Solis - Inverteris išjungtas: žemas SOC naktį 🛡️"
        message: >
          Baterija {{ states('sensor.solis_s6_eh3p_battery_soc') }}% — churn
          juosta (BMS naktį cikluoja 10–15 %, pjūklas iš tinklo). Inverteris
          išjungtas iki ryto: be seklios ciklikos ir dėvėjimo, namus maitina
          tinklas.
          Įsijungs {{ state_attr('sensor.inverter_morning_on_time', 'laikas') | default('prieš gamybos pradžią', true) }}.
  mode: single

- id: solis_storm_export_at_high_soc
  alias: "Solis - Audros režimas: eksportas kai SOC ≥ 95%"
  description: >
    Rezervo režimu eksportas išjungtas, bet kai baterija beveik pilna
    (SOC ≥ 95%) — leidžiamas eksportas, kad saulės perteklius eitų į tinklą.
    Histerezė: įjungia ties 95%, išjungia nukritus žemiau 90%.
  trigger:
    - platform: numeric_state
      entity_id: sensor.solis_s6_eh3p_battery_soc
      above: 94
    - platform: numeric_state
      entity_id: sensor.solis_s6_eh3p_battery_soc
      below: 90
  condition:
    - condition: state
      entity_id: input_boolean.storm_mode
      state: "on"
  action:
    - choose:
        - conditions:
            - condition: numeric_state
              entity_id: sensor.solis_s6_eh3p_battery_soc
              above: 94
          sequence:
            - service: switch.turn_on
              target:
                entity_id: switch.solis_s6_eh3p_allow_export_switch_under_self_generation_and_self_use
            - service: notify.persistent_notification
              data:
                title: "Solis - Audros režimas: eksportas leistas ☀️➡️"
                message: >
                  Baterija {{ states('sensor.solis_s6_eh3p_battery_soc') }}% (≥95%)
                  — saulės perteklius eksportuojamas į tinklą.
      default:
        - service: switch.turn_off
          target:
            entity_id: switch.solis_s6_eh3p_allow_export_switch_under_self_generation_and_self_use
        - service: notify.persistent_notification
          data:
            title: "Solis - Audros režimas: eksportas sustabdytas 🔋"
            message: >
              Baterija {{ states('sensor.solis_s6_eh3p_battery_soc') }}% (<90%)
              — eksportas vėl sustabdytas, visa saulė į bateriją.
  mode: single

- id: solis_inverter_temp_alert
  alias: "Solis - Inverterio temperatūros įspėjimas (>70°C)"
  description: >
    Įspėja, kai inverterio temperatūra 10 min laikosi virš 70°C — artėja
    galios ribojimo (derating) zona, verta patikrinti vėdinimą. Trigeris
    suveikia tik kertant ribą, todėl pranešimas nesikartoja, kol
    temperatūra nenukrenta ir vėl nepakyla.
  trigger:
    - platform: numeric_state
      entity_id: sensor.solis_s6_eh3p_temperature
      above: 70
      for: "00:10:00"
  condition: []
  action:
    - service: notify.persistent_notification
      data:
        title: "Solis - Aukšta inverterio temperatūra 🌡️"
        message: >
          Inverterio temperatūra {{ states('sensor.solis_s6_eh3p_temperature') }}°C
          jau 10 min viršija 70°C. Artėjant ~75°C inverteris pradės riboti
          galią. Patikrinkite vėdinimą / užtemdymą. PV galia:
          {{ states('sensor.solis_s6_eh3p_total_pv_power') }} W.
  mode: single

- id: solis_bms_fault_alert
  alias: "Solis - Baterijos BMS gedimo įspėjimas"
  description: >
    BMS temperatūros baterija neperduoda (registras visada 0), todėl
    sveikata stebima netiesiogiai: fault_status_1/2 registrai privalo būti
    0 — bet kokia kita reikšmė yra BMS aliarmas (per aukšta/žema celių
    įtampa, temperatūra, srovė). Trigeris kertant 0 ribą.
  trigger:
    - platform: numeric_state
      entity_id:
        - sensor.solis_s6_eh3p_battery_fault_status_1_bms
        - sensor.solis_s6_eh3p_battery_fault_status_2_bms
      above: 0
  condition: []
  action:
    - service: notify.persistent_notification
      data:
        title: "Solis - Baterijos BMS aliarmas ⚠️"
        message: >
          BMS fault registrai: status_1 =
          {{ states('sensor.solis_s6_eh3p_battery_fault_status_1_bms') }},
          status_2 =
          {{ states('sensor.solis_s6_eh3p_battery_fault_status_2_bms') }}.
          SOC: {{ states('sensor.solis_s6_eh3p_battery_soc') }} %,
          baterijos galia: {{ states('sensor.solis_s6_eh3p_battery_power') }} W,
          BMS įtampa: {{ states('sensor.solis_s6_eh3p_battery_voltage_bms') }} V.
          Patikrink baterijos būseną — nenulinis fault = BMS apsauga.
  mode: single

- id: eimo_inverter_temp_alert
  alias: "Eimo - Inverterio temperatūros įspėjimas (>70°C)"
  description: >
    Solis Modbus analogo kopija Eimo elektrinei (cloud temperatūros
    sensorius): 10 min virš 70°C — artėja galios ribojimo zona.
  trigger:
    - platform: numeric_state
      entity_id: sensor.solis_inverter_1033300254190112_solis_temperature
      above: 70
      for: "00:10:00"
  condition: []
  action:
    - service: notify.persistent_notification
      data:
        title: "Eimo - Aukšta inverterio temperatūra 🌡️"
        message: >
          Eimo inverterio temperatūra
          {{ states('sensor.solis_inverter_1033300254190112_solis_temperature') }}°C
          jau 10 min viršija 70°C. Artėjant ~75°C inverteris pradės riboti
          galią. Patikrinkite vėdinimą / užtemdymą.
  mode: single
