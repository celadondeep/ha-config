- id: solis_shadow_discharge_slots_guard
  alias: Solis - Šešėlinių iškrovimo slotų apsauga
  description: 'Centrinis branduolys naudoja tik 1-ą iškrovimo slotą. 2–6 slotai laikomi išjungti, kad
    sena ar rankinė konfigūracija negalėtų apeiti atominio plano.

    '
  triggers:
  - trigger: state
    entity_id:
    - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_2
    - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_3
    - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_4
    - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_5
    - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_6
    to: 'on'
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: /10
  conditions:
  - condition: template
    value_template: "{{ is_state('switch.solis_s6_eh3p_grid_time_of_use_discharge_period_2', 'on')\n \
      \  or is_state('switch.solis_s6_eh3p_grid_time_of_use_discharge_period_3', 'on')\n   or is_state('switch.solis_s6_eh3p_grid_time_of_use_discharge_period_4',\
      \ 'on')\n   or is_state('switch.solis_s6_eh3p_grid_time_of_use_discharge_period_5', 'on')\n   or\
      \ is_state('switch.solis_s6_eh3p_grid_time_of_use_discharge_period_6', 'on') }}"
  actions:
  - action: switch.turn_off
    target:
      entity_id:
      - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_2
      - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_3
      - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_4
      - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_5
      - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_6
  - action: logbook.log
    data:
      name: ChatGPT HA priežiūra
      message: 'Namai: išjungtas nevaldomas 2–6 iškrovimo slotas; paliktas tik branduolio 1-as slotas.'
  mode: restart
- id: solis_plan_apply_mode
  alias: Solis - Atominio energijos plano vykdymas
  description: Bendro energijos plano vykdytojas; parametrai iš elektrinės profilio. modbus
  use_blueprint:
    path: energy/modbus_executor.yaml
    input:
      plan_entity: sensor.solis_plan
      planner_entity: sensor.solis_planner_health
      executor_health: sensor.solis_executor_health
      storm_entity: input_boolean.storm_mode
      hard_floor: 13
      planner_max_age: 180
      discharge_current: 150
      manual_entity: input_boolean.manual_tou_override
      manual_soc_entity: input_boolean.manual_soc_override
      mode_entity: select.solis_s6_eh3p_work_mode
      slot_entity: switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
      cutoff_entity: number.solis_s6_eh3p_grid_time_of_use_discharge_cut_off_soc_slot_1
      power_entity: switch.solis_s6_eh3p_power_state
      start_entity: time.solis_s6_eh3p_grid_time_of_use_discharge_start_slot_1
      end_entity: time.solis_s6_eh3p_grid_time_of_use_discharge_end_slot_1
      current_entity: number.solis_s6_eh3p_grid_time_of_use_discharge_battery_current_slot_1
      self_use_mode: Self-Use
      feed_in_mode: Feed-in Priority
      self_use_aliases:
      - Self-Use
      - Self-Use + TOU
      feed_in_aliases:
      - Feed-in Priority
      - Feed-in Priority + TOU
- id: solis_snapshot_daily_forecast
  alias: Solis - Įsiminti dienos prognozę (vakar prognozė)
  description: '23:55: nusaugo šiandienos Solcast forecast_today reikšmę į input_number.solcast_forecast_yesterday.
    Kitą dieną ši reikšmė rodoma kaip „vakar prognozuota" ir lyginama su faktine vakar gamyba.

    '
  trigger:
  - platform: time
    at: '23:55:00'
  condition:
  - condition: template
    value_template: "{{ states('sensor.solcast_pv_forecast_forecast_today')\n   not in ['unavailable',\
      \ 'unknown', 'none', ''] }}\n"
  action:
  - service: input_number.set_value
    target:
      entity_id: input_number.solcast_forecast_yesterday
    data:
      value: '{{ states(''sensor.solcast_pv_forecast_forecast_today'') | float(0) | round(1) }}'
  mode: single
- id: solis_time_of_use_master_sync
  alias: Solis - TOU master bito sinchronizavimas su slotais
  description: '2026-08-28 radinys: register 43110 (Work Mode) bitas 1 (switch.solis_s6_eh3p_time_of_use,
    „Time of Use") yra ATSKIRAS nuo kiekvieno konkretaus krovimo/iškrovimo sloto switch''o (tie gyvena
    kitame registre, 43707) — tai MASTER TOU žymė, kurios jokia automatika tiesiogiai nevaldė (tik atskirus
    period switch''us per solis_evening_ discharge / solis_daytime_feedin_tou / storm skriptus). Dėl to
    ji likdavo įjungta neribotai net kai VISI 12 period switch''ų off, o select.solis_s6_eh3p_work_mode
    / dashboard''as toliau rodydavo „... + TOU", nors joks slotas realiai nebuvo aktyvus (vartotojo pastaba:
    „vistiek rodo TOU vizualizacijoj"). Ši automatika laiko master bitą TEISINGĄ: on tada ir tik tada,
    kai bent vienas iš 12 TOU period switch''ų (krovimo/iškrovimo, 1–6) yra on. Vien sinchronizacija,
    ne sprendimas — veikia visais režimais (audros/rankinis nebloko).

    '
  trigger:
  - platform: state
    entity_id:
    - switch.solis_s6_eh3p_grid_time_of_use_charging_period_1
    - switch.solis_s6_eh3p_grid_time_of_use_charging_period_2
    - switch.solis_s6_eh3p_grid_time_of_use_charging_period_3
    - switch.solis_s6_eh3p_grid_time_of_use_charging_period_4
    - switch.solis_s6_eh3p_grid_time_of_use_charging_period_5
    - switch.solis_s6_eh3p_grid_time_of_use_charging_period_6
    - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
    - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_2
    - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_3
    - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_4
    - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_5
    - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_6
  - platform: time_pattern
    minutes: /10
  variables:
    any_period_on: "{{ expand(['switch.solis_s6_eh3p_grid_time_of_use_charging_period_1',\n    'switch.solis_s6_eh3p_grid_time_of_use_charging_period_2',\n\
      \    'switch.solis_s6_eh3p_grid_time_of_use_charging_period_3',\n    'switch.solis_s6_eh3p_grid_time_of_use_charging_period_4',\n\
      \    'switch.solis_s6_eh3p_grid_time_of_use_charging_period_5',\n    'switch.solis_s6_eh3p_grid_time_of_use_charging_period_6',\n\
      \    'switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1',\n    'switch.solis_s6_eh3p_grid_time_of_use_discharge_period_2',\n\
      \    'switch.solis_s6_eh3p_grid_time_of_use_discharge_period_3',\n    'switch.solis_s6_eh3p_grid_time_of_use_discharge_period_4',\n\
      \    'switch.solis_s6_eh3p_grid_time_of_use_discharge_period_5',\n    'switch.solis_s6_eh3p_grid_time_of_use_discharge_period_6'])\n\
      \   | selectattr('state', 'eq', 'on') | list | count > 0 }}"
    master_on: '{{ is_state(''switch.solis_s6_eh3p_time_of_use'', ''on'') }}'
  condition:
  - condition: template
    value_template: '{{ any_period_on != master_on }}'
  action:
  - service: switch.turn_{{ 'on' if any_period_on else 'off' }}
    target:
      entity_id: switch.solis_s6_eh3p_time_of_use
  mode: single
- id: solis_storm_mode_toggle
  alias: Solis - Audros/ESO režimo perjungimas (greitas pritaikymas)
  description: 'Kai įjungiamas/išjungiamas Audros/ESO jungiklis — iškart pritaiko arba panaikina rezervo
    režimą, nelaukiant 06:00 / 20:00. Įjungus: visa saulė į bateriją, namus maitina tinklas, baterija
    namams neiškraunama, eksportas sustabdytas. Išjungus: grąžinamas Self-Use, normali logika atsinaujins
    kitą 06:00 / 20:00.

    '
  trigger:
  - platform: state
    entity_id: input_boolean.storm_mode
  condition: []
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.storm_mode
        state: 'on'
      sequence:
      - service: script.solis_storm_reserve_apply
      - service: notify.persistent_notification
        data:
          title: Solis - Audros / ESO rezervo režimas įjungtas ⚡🔋
          message: 'Visa saulė kraunama į bateriją, namus maitina tinklas, baterija namams neiškraunama,
            eksportas sustabdytas. Baterija: {{ states(''sensor.solis_s6_eh3p_battery_soc'') }}%.

            '
    default:
    - service: script.solis_storm_reserve_clear
    - service: notify.persistent_notification
      data:
        title: Solis - Audros / ESO rezervo režimas išjungtas ✅
        message: 'Grąžinta į Self-Use. Normali dienos/nakties logika atsinaujins kitą 06:00 / 20:00.

          '
  mode: single
- id: solis_low_soc_night_shutdown
  alias: Solis - Naktinis išjungimas žemo SOC juostoje (churn apsauga)
  description: 'Apsauga nuo nakties ciklavimo ties apatine riba. BMS/firmware naktį laiko bateriją 10–15
    % juostoje: inverteris trumpam prisikrauna iš tinklo ir vėl išsikrauna (pjūklas 10↔15 %) — sekli ciklika,
    baterijos dėvėjimas, round-trip nuostolis (2026-07-06 serijos max 5.9 kWh/naktį). Senasis 5.5 % slenkstis
    niekada nesuveikdavo, nes BMS SOC žemiau 10 % naktį nenuleidžia. Dvi pakopos: SOC ≤ 6 % — išjungiama
    bet kuriuo nakties metu (senoji apsauga nuo force-charge ties 4–5 %); SOC ≤ 16 % (churn juosta) —
    tik 20:30–10:00 lange, kad netrukdytų vakariniam TOU eksportui žiemą. Išjungus namus maitina tinklas,
    baterija ilsisi. Nuo 2026-09-04 ši riba yra centriniame Planner branduolyje. Ši automatizacija liko
    tik avarine atsarga ir fiziškai rašo tik tada, kai Planner nėra sveikas arba jo heartbeat senesnis
    nei 10 min. Audros ir rankinio valdymo režimais nevykdoma.

    '
  trigger:
  - platform: numeric_state
    entity_id: sensor.solis_s6_eh3p_battery_soc
    below: 16
  - platform: time_pattern
    minutes: /15
  condition:
  - condition: state
    entity_id: input_boolean.storm_mode
    state: 'off'
  - condition: state
    entity_id: input_boolean.manual_tou_override
    state: 'off'
  - condition: state
    entity_id: switch.solis_s6_eh3p_power_state
    state: 'on'
  - condition: template
    value_template: "{% set raw = state_attr('sensor.solis_planner_health', 'last_checked') %} {% set\
      \ checked = as_datetime(raw) if raw else none %} {{ states('sensor.solis_planner_health') != 'ok'\n\
      \   or checked is none\n   or (now() - checked).total_seconds() >= 600 }}"
  - condition: state
    entity_id: switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
    state: 'off'
  - condition: template
    value_template: "{% set soc = states('sensor.solis_s6_eh3p_battery_soc') | float(100) %} {% set night\
      \ = is_state('sun.sun', 'below_horizon') %} {{ night and (soc <= 6 or (soc <= 16\n      and (now()\
      \ >= today_at('20:30') or now() < today_at('10:00')))) }}\n"
  action:
  - service: switch.turn_off
    target:
      entity_id: switch.solis_s6_eh3p_power_state
  - service: notify.persistent_notification
    data:
      title: 'Solis - Inverteris pailsi: žemas SOC + mažai saulės 🛡️'
      message: 'Baterija {{ states(''sensor.solis_s6_eh3p_battery_soc'') }}% ties nakties apsaugos riba,
        o centrinio Planner heartbeat nepatikimas. Avarinė atsarga išjungė inverterį, kad baterija nesiciklautų.
        Overdischarge nustatymas nebuvo keistas.

        '
  mode: single
- id: solis_storm_export_at_high_soc
  alias: Solis - Audros/ESO eksportas nuo 95% tik esant tinklui
  description: 'Rezervas turi prioritetą: eksporto leidimas tik su šviežiais SOC >=95% ir trijų fazių
    tinklo matavimais. Iškrovimo slotas lieka išjungtas; eksporto galios riba nekeičiama.'
  triggers:
  - trigger: state
    entity_id:
    - sensor.solis_s6_eh3p_battery_soc
    - select.solis_s6_eh3p_work_mode
    - input_boolean.storm_mode
  - trigger: time_pattern
    minutes: /1
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: input_boolean.storm_mode
    state: 'on'
  - condition: state
    entity_id: select.solis_s6_eh3p_work_mode
    state:
    - Self-Use
    - Self-Use + TOU
  - condition: state
    entity_id: switch.solis_s6_eh3p_allow_export_switch_under_self_generation_and_self_use
    state:
    - 'on'
    - 'off'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ -60 <= as_timestamp(now()) - (as_timestamp(states(''sensor.solis_s6_eh3p_last_modbus_success''),
          0)) <= 180 }}'
      - condition: numeric_state
        entity_id: sensor.solis_s6_eh3p_battery_soc
        above: 94.99
      - condition: numeric_state
        entity_id: sensor.solis_s6_eh3p_meter_ac_voltage_a
        above: 180
        below: 270
      - condition: numeric_state
        entity_id: sensor.solis_s6_eh3p_meter_ac_voltage_b
        above: 180
        below: 270
      - condition: numeric_state
        entity_id: sensor.solis_s6_eh3p_meter_ac_voltage_c
        above: 180
        below: 270
      - condition: numeric_state
        entity_id: sensor.solis_s6_eh3p_grid_frequency
        above: 45
        below: 55
      sequence:
      - if:
        - condition: state
          entity_id: switch.solis_s6_eh3p_allow_export_switch_under_self_generation_and_self_use
          state: 'off'
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.solis_s6_eh3p_allow_export_switch_under_self_generation_and_self_use
    default:
    - if:
      - condition: state
        entity_id: switch.solis_s6_eh3p_allow_export_switch_under_self_generation_and_self_use
        state: 'on'
      then:
      - action: switch.turn_off
        target:
          entity_id: switch.solis_s6_eh3p_allow_export_switch_under_self_generation_and_self_use
  mode: restart
- id: solis_inverter_temp_alert
  alias: Solis - Inverterio temperatūros įspėjimas (>70°C)
  description: 'Įspėja, kai inverterio temperatūra 10 min laikosi virš 70°C — artėja galios ribojimo (derating)
    zona, verta patikrinti vėdinimą. Trigeris suveikia tik kertant ribą, todėl pranešimas nesikartoja,
    kol temperatūra nenukrenta ir vėl nepakyla.

    '
  trigger:
  - platform: numeric_state
    entity_id: sensor.solis_s6_eh3p_temperature
    above: 70
    for: 00:10:00
  condition: []
  action:
  - service: notify.persistent_notification
    data:
      title: Solis - Aukšta inverterio temperatūra 🌡️
      message: 'Inverterio temperatūra {{ states(''sensor.solis_s6_eh3p_temperature'') }}°C jau 10 min
        viršija 70°C. Artėjant ~75°C inverteris pradės riboti galią. Patikrinkite vėdinimą / užtemdymą.
        PV galia: {{ states(''sensor.solis_s6_eh3p_total_pv_power'') }} W.

        '
  mode: single
- id: solis_bms_fault_alert
  alias: Solis - Baterijos BMS gedimo įspėjimas
  description: 'BMS temperatūros baterija neperduoda (registras visada 0), todėl sveikata stebima netiesiogiai:
    fault_status_1/2 registrai privalo būti 0 — bet kokia kita reikšmė yra BMS aliarmas (per aukšta/žema
    celių įtampa, temperatūra, srovė). Trigeris kertant 0 ribą.

    '
  trigger:
  - platform: numeric_state
    entity_id:
    - sensor.solis_s6_eh3p_battery_fault_status_1_bms
    - sensor.solis_s6_eh3p_battery_fault_status_2_bms
    above: 0
  condition: []
  action:
  - service: notify.persistent_notification
    data:
      title: Solis - Baterijos BMS aliarmas ⚠️
      message: 'BMS fault registrai: status_1 = {{ states(''sensor.solis_s6_eh3p_battery_fault_status_1_bms'')
        }}, status_2 = {{ states(''sensor.solis_s6_eh3p_battery_fault_status_2_bms'') }}. SOC: {{ states(''sensor.solis_s6_eh3p_battery_soc'')
        }} %, baterijos galia: {{ states(''sensor.solis_s6_eh3p_battery_power'') }} W, BMS įtampa: {{
        states(''sensor.solis_s6_eh3p_battery_voltage_bms'') }} V. Patikrink baterijos būseną — nenulinis
        fault = BMS apsauga.

        '
  mode: single
- id: eimo_inverter_temp_alert
  alias: Eimo - Inverterio temperatūros įspėjimas (>70°C)
  description: 'Solis Modbus analogo kopija Eimo elektrinei (cloud temperatūros sensorius): 10 min virš
    70°C — artėja galios ribojimo zona.

    '
  trigger:
  - platform: numeric_state
    entity_id: sensor.solis_inverter_1033300254190112_solis_temperature
    above: 70
    for: 00:10:00
  condition: []
  action:
  - service: notify.persistent_notification
    data:
      title: Eimo - Aukšta inverterio temperatūra 🌡️
      message: 'Eimo inverterio temperatūra {{ states(''sensor.solis_inverter_1033300254190112_solis_temperature'')
        }}°C jau 10 min viršija 70°C. Artėjant ~75°C inverteris pradės riboti galią. Patikrinkite vėdinimą
        / užtemdymą.

        '
  mode: single
- id: system_appdaemon_startup_watchdog
  alias: Sistema - AppDaemon paleidimo sargyba
  description: 'Vienkartinė HA paleidimo saviatkūra. Po 2 min. perkrauna tik AppDaemon, jei Namų branduolio
    heartbeat nesukurtas arba pasenęs. Eimo debesies telemetrijos gedimas šios sargybos nesuveikia.

    '
  trigger:
  - platform: homeassistant
    event: start
  condition: []
  action:
  - delay: 00:02:00
  - condition: template
    value_template: "{% set raw = state_attr('sensor.solis_planner_health', 'last_checked') %} {% set\
      \ checked = as_datetime(raw) if raw else none %} {{ states('sensor.solis_planner_health') in ['unknown',\
      \ 'unavailable']\n   or checked is none\n   or (now() - checked).total_seconds() > 180 }}"
  - service: logbook.log
    data:
      name: ChatGPT HA priežiūra
      message: 'Po HA paleidimo Namų Planner heartbeat neatsirado per 2 min.; automatiškai perkraunamas
        tik AppDaemon priedas.

        '
      entity_id: automation.sistema_appdaemon_paleidimo_sargyba
  - service: hassio.app_restart
    data:
      app: a0d7b954_appdaemon
  mode: single
