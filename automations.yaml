- id: solis_shadow_discharge_slots_guard
  alias: Solis - Šešėlinių iškrovimo slotų apsauga
  description: 'Centrinis branduolys naudoja tik 1-ą iškrovimo slotą. 2–6 slotai laikomi
    išjungti, kad sena ar rankinė konfigūracija negalėtų apeiti atominio plano.

    '
  triggers:
  - trigger: state
    entity_id:
    - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_2
    - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_3
    - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_4
    - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_5
    - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_6
    to: 'on'
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: /10
  conditions:
  - condition: template
    value_template: "{{ is_state('switch.solis_s6_eh3p_grid_time_of_use_discharge_period_2',
      'on')\n   or is_state('switch.solis_s6_eh3p_grid_time_of_use_discharge_period_3',
      'on')\n   or is_state('switch.solis_s6_eh3p_grid_time_of_use_discharge_period_4',
      'on')\n   or is_state('switch.solis_s6_eh3p_grid_time_of_use_discharge_period_5',
      'on')\n   or is_state('switch.solis_s6_eh3p_grid_time_of_use_discharge_period_6',
      'on') }}"
  actions:
  - action: switch.turn_off
    target:
      entity_id:
      - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_2
      - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_3
      - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_4
      - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_5
      - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_6
  - action: logbook.log
    data:
      name: ChatGPT HA priežiūra
      message: 'Namai: išjungtas nevaldomas 2–6 iškrovimo slotas; paliktas tik branduolio
        1-as slotas.'
  mode: restart
- id: solis_plan_apply_mode
  alias: Solis - Atominio energijos plano vykdymas
  description: 'Vienintelis Namų inverterio Executor. Skaito vieną pilną sensor.solis_plan commit būseną ir saugia
    tvarka suderina režimą, TOU iškrovimo slotą bei inverterio maitinimą. Sprendimų nedaro. Storm/manual/telemetry-hold
    planų nevykdo. Kas 10 min tikrina dar kartą, bet tik jei Planner heartbeat šviežias.

    13 % yra Namų inverterio baterijos saugos dugnas. Režimo readback su „+ TOU“ laikomas lygiaverčiu baziniam režimui
    ir be reikalo neperrašomas.

    '
  triggers:
  - trigger: state
    entity_id: sensor.solis_plan
    id: plan_commit
  - trigger: homeassistant
    event: start
    id: ha_start
  - trigger: time_pattern
    minutes: /10
    id: reconcile
  - trigger: state
    entity_id: sensor.solis_executor_health
    to: degraded
    for: 00:01:00
    id: feedback_retry
  conditions:
  - condition: state
    entity_id: input_boolean.storm_mode
    state: 'off'
  - condition: state
    entity_id: input_boolean.manual_tou_override
    state: 'off'
  - condition: state
    entity_id: sensor.solis_planner_health
    state: ok
  - condition: state
    entity_id: sensor.solis_plan
    state:
    - self_use
    - feed_in
    - night_export
  - condition: state
    entity_id: sensor.solis_plan
    attribute: actionable
    state: 'on'
  - condition: template
    value_template: "{% set raw = state_attr('sensor.solis_planner_health', 'last_checked') %} {% set checked =\
      \ as_datetime(raw) if raw else none %} {{ checked is not none\n   and (now() - checked).total_seconds() <\
      \ 600 }}"
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.manual_soc_override
      state: 'off'
    - condition: state
      entity_id: sensor.solis_plan
      state: 'on'
      attribute: slot_active
    - condition: state
      entity_id: switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
      state: 'on'
    - condition: template
      value_template: '{{ states(''number.solis_s6_eh3p_grid_time_of_use_discharge_cut_off_soc_slot_1'') | float(-1)
        != slot_cutoff_soc | float(-2) }}'
    then:
    - action: switch.turn_off
      target:
        entity_id: switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
  - if:
    - condition: state
      entity_id: input_boolean.manual_soc_override
      state: 'off'
    - condition: state
      entity_id: sensor.solis_plan
      attribute: slot_active
      state: 'off'
    - condition: state
      entity_id: switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
      state: 'on'
    then:
    - action: switch.turn_off
      target:
        entity_id: switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
  - alias: Keisti tik bazinį režimą, išsaugant teisėtą TOU būseną
    choose:
    - conditions:
      - condition: state
        entity_id: sensor.solis_plan
        state:
        - feed_in
        - night_export
      - condition: not
        conditions:
        - condition: state
          entity_id: select.solis_s6_eh3p_work_mode
          state:
          - Feed-in Priority
          - Feed-in Priority + TOU
      sequence:
      - action: select.select_option
        target:
          entity_id: select.solis_s6_eh3p_work_mode
        data:
          option: Feed-in Priority
    - conditions:
      - condition: state
        entity_id: sensor.solis_plan
        state: self_use
      - condition: not
        conditions:
        - condition: state
          entity_id: select.solis_s6_eh3p_work_mode
          state:
          - Self-Use
          - Self-Use + TOU
      sequence:
      - action: select.select_option
        target:
          entity_id: select.solis_s6_eh3p_work_mode
        data:
          option: Self-Use
  - if:
    - condition: state
      entity_id: input_boolean.manual_soc_override
      state: 'off'
    - condition: state
      entity_id: sensor.solis_plan
      attribute: slot_active
      state: 'on'
    - condition: template
      value_template: "{{ slot_cutoff_soc is number\n   and 13 <= slot_cutoff_soc <= 100 }}"
    then:
    - if:
      - condition: template
        value_template: "{{ states('time.solis_s6_eh3p_grid_time_of_use_discharge_start_slot_1')\n   != '00:00:00'\
          \ }}"
      then:
      - action: time.set_value
        target:
          entity_id: time.solis_s6_eh3p_grid_time_of_use_discharge_start_slot_1
        data:
          time: 00:00:00
    - if:
      - condition: template
        value_template: "{{ states('time.solis_s6_eh3p_grid_time_of_use_discharge_end_slot_1')\n   != '23:59:00'\
          \ }}"
      then:
      - action: time.set_value
        target:
          entity_id: time.solis_s6_eh3p_grid_time_of_use_discharge_end_slot_1
        data:
          time: '23:59:00'
    - if:
      - condition: template
        value_template: '{{ states(''number.solis_s6_eh3p_grid_time_of_use_discharge_cut_off_soc_slot_1'') | float(-1)
          != slot_cutoff_soc | float(-2) }}'
      then:
      - action: number.set_value
        target:
          entity_id: number.solis_s6_eh3p_grid_time_of_use_discharge_cut_off_soc_slot_1
        data:
          value: '{{ slot_cutoff_soc }}'
    - if:
      - condition: template
        value_template: "{{ (states('number.solis_s6_eh3p_grid_time_of_use_discharge_battery_current_slot_1')\n\
          \    | float(-1)) != 150 }}"
      then:
      - action: number.set_value
        target:
          entity_id: number.solis_s6_eh3p_grid_time_of_use_discharge_battery_current_slot_1
        data:
          value: 150
    - wait_template: '{{ states(''number.solis_s6_eh3p_grid_time_of_use_discharge_cut_off_soc_slot_1'') | float(-1)
        == slot_cutoff_soc | float(-2) }}'
      timeout: 00:00:45
      continue_on_timeout: false
    - condition: state
      entity_id: input_boolean.storm_mode
      state: 'off'
    - condition: state
      entity_id: sensor.solis_plan
      state: 'on'
      attribute: actionable
    - if:
      - condition: state
        entity_id: switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
        state: 'off'
      then:
      - action: switch.turn_on
        target:
          entity_id: switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
  - choose:
    - conditions:
      - condition: state
        entity_id: sensor.solis_plan
        attribute: inverter_on
        state: 'on'
      - condition: state
        entity_id: switch.solis_s6_eh3p_power_state
        state: 'off'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.solis_s6_eh3p_power_state
    - conditions:
      - condition: state
        entity_id: sensor.solis_plan
        attribute: inverter_on
        state: 'off'
      - condition: state
        entity_id: switch.solis_s6_eh3p_power_state
        state: 'on'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.solis_s6_eh3p_power_state
  variables:
    plan_mode: '{{ states(''sensor.solis_plan'') }}'
    slot_cutoff_soc: '{{ state_attr(''sensor.solis_plan'', ''slot_cutoff_soc'') }}'
  mode: restart
- id: solis_snapshot_daily_forecast
  alias: Solis - Įsiminti dienos prognozę (vakar prognozė)
  description: '23:55: nusaugo šiandienos Solcast forecast_today reikšmę į input_number.solcast_forecast_yesterday.
    Kitą dieną ši reikšmė rodoma kaip „vakar prognozuota" ir lyginama su faktine vakar
    gamyba.

    '
  trigger:
  - platform: time
    at: '23:55:00'
  condition:
  - condition: template
    value_template: "{{ states('sensor.solcast_pv_forecast_forecast_today')\n   not
      in ['unavailable', 'unknown', 'none', ''] }}\n"
  action:
  - service: input_number.set_value
    target:
      entity_id: input_number.solcast_forecast_yesterday
    data:
      value: '{{ states(''sensor.solcast_pv_forecast_forecast_today'') | float(0)
        | round(1) }}'
  mode: single
- id: solis_time_of_use_master_sync
  alias: Solis - TOU master bito sinchronizavimas su slotais
  description: '2026-08-28 radinys: register 43110 (Work Mode) bitas 1 (switch.solis_s6_eh3p_time_of_use,
    „Time of Use") yra ATSKIRAS nuo kiekvieno konkretaus krovimo/iškrovimo sloto switch''o
    (tie gyvena kitame registre, 43707) — tai MASTER TOU žymė, kurios jokia automatika
    tiesiogiai nevaldė (tik atskirus period switch''us per solis_evening_ discharge
    / solis_daytime_feedin_tou / storm skriptus). Dėl to ji likdavo įjungta neribotai
    net kai VISI 12 period switch''ų off, o select.solis_s6_eh3p_work_mode / dashboard''as
    toliau rodydavo „... + TOU", nors joks slotas realiai nebuvo aktyvus (vartotojo
    pastaba: „vistiek rodo TOU vizualizacijoj"). Ši automatika laiko master bitą TEISINGĄ:
    on tada ir tik tada, kai bent vienas iš 12 TOU period switch''ų (krovimo/iškrovimo,
    1–6) yra on. Vien sinchronizacija, ne sprendimas — veikia visais režimais (audros/rankinis
    nebloko).

    '
  trigger:
  - platform: state
    entity_id:
    - switch.solis_s6_eh3p_grid_time_of_use_charging_period_1
    - switch.solis_s6_eh3p_grid_time_of_use_charging_period_2
    - switch.solis_s6_eh3p_grid_time_of_use_charging_period_3
    - switch.solis_s6_eh3p_grid_time_of_use_charging_period_4
    - switch.solis_s6_eh3p_grid_time_of_use_charging_period_5
    - switch.solis_s6_eh3p_grid_time_of_use_charging_period_6
    - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
    - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_2
    - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_3
    - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_4
    - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_5
    - switch.solis_s6_eh3p_grid_time_of_use_discharge_period_6
  - platform: time_pattern
    minutes: /10
  variables:
    any_period_on: "{{ expand(['switch.solis_s6_eh3p_grid_time_of_use_charging_period_1',\n
      \   'switch.solis_s6_eh3p_grid_time_of_use_charging_period_2',\n    'switch.solis_s6_eh3p_grid_time_of_use_charging_period_3',\n
      \   'switch.solis_s6_eh3p_grid_time_of_use_charging_period_4',\n    'switch.solis_s6_eh3p_grid_time_of_use_charging_period_5',\n
      \   'switch.solis_s6_eh3p_grid_time_of_use_charging_period_6',\n    'switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1',\n
      \   'switch.solis_s6_eh3p_grid_time_of_use_discharge_period_2',\n    'switch.solis_s6_eh3p_grid_time_of_use_discharge_period_3',\n
      \   'switch.solis_s6_eh3p_grid_time_of_use_discharge_period_4',\n    'switch.solis_s6_eh3p_grid_time_of_use_discharge_period_5',\n
      \   'switch.solis_s6_eh3p_grid_time_of_use_discharge_period_6'])\n   | selectattr('state',
      'eq', 'on') | list | count > 0 }}"
    master_on: '{{ is_state(''switch.solis_s6_eh3p_time_of_use'', ''on'') }}'
  condition:
  - condition: template
    value_template: '{{ any_period_on != master_on }}'
  action:
  - service: switch.turn_{{ 'on' if any_period_on else 'off' }}
    target:
      entity_id: switch.solis_s6_eh3p_time_of_use
  mode: single
- id: solis_storm_mode_toggle
  alias: Solis - Audros/ESO režimo perjungimas (greitas pritaikymas)
  description: 'Kai įjungiamas/išjungiamas Audros/ESO jungiklis — iškart pritaiko
    arba panaikina rezervo režimą, nelaukiant 06:00 / 20:00. Įjungus: visa saulė į
    bateriją, namus maitina tinklas, baterija namams neiškraunama, eksportas sustabdytas.
    Išjungus: grąžinamas Self-Use, normali logika atsinaujins kitą 06:00 / 20:00.

    '
  trigger:
  - platform: state
    entity_id: input_boolean.storm_mode
  condition: []
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.storm_mode
        state: 'on'
      sequence:
      - service: script.solis_storm_reserve_apply
      - service: notify.persistent_notification
        data:
          title: "Solis - Audros / ESO rezervo režimas įjungtas ⚡\U0001F50B"
          message: 'Visa saulė kraunama į bateriją, namus maitina tinklas, baterija
            namams neiškraunama, eksportas sustabdytas. Baterija: {{ states(''sensor.solis_s6_eh3p_battery_soc'')
            }}%.

            '
    default:
    - service: script.solis_storm_reserve_clear
    - service: notify.persistent_notification
      data:
        title: Solis - Audros / ESO rezervo režimas išjungtas ✅
        message: 'Grąžinta į Self-Use. Normali dienos/nakties logika atsinaujins kitą
          06:00 / 20:00.

          '
  mode: single
- id: solis_low_soc_night_shutdown
  alias: Solis - Naktinis išjungimas žemo SOC juostoje (churn apsauga)
  description: 'Apsauga nuo nakties ciklavimo ties apatine riba. BMS/firmware naktį
    laiko bateriją 10–15 % juostoje: inverteris trumpam prisikrauna iš tinklo ir vėl
    išsikrauna (pjūklas 10↔15 %) — sekli ciklika, baterijos dėvėjimas, round-trip
    nuostolis (2026-07-06 serijos max 5.9 kWh/naktį). Senasis 5.5 % slenkstis niekada
    nesuveikdavo, nes BMS SOC žemiau 10 % naktį nenuleidžia. Dvi pakopos: SOC ≤ 6
    % — išjungiama bet kuriuo nakties metu (senoji apsauga nuo force-charge ties 4–5
    %); SOC ≤ 16 % (churn juosta) — tik 20:30–10:00 lange, kad netrukdytų vakariniam
    TOU eksportui žiemą. Išjungus namus maitina tinklas, baterija ilsisi. Nuo 2026-09-04
    ši riba yra centriniame Planner branduolyje. Ši automatizacija liko tik avarine
    atsarga ir fiziškai rašo tik tada, kai Planner nėra sveikas arba jo heartbeat
    senesnis nei 10 min. Audros ir rankinio valdymo režimais nevykdoma.

    '
  trigger:
  - platform: numeric_state
    entity_id: sensor.solis_s6_eh3p_battery_soc
    below: 16
  - platform: time_pattern
    minutes: /15
  condition:
  - condition: state
    entity_id: input_boolean.storm_mode
    state: 'off'
  - condition: state
    entity_id: input_boolean.manual_tou_override
    state: 'off'
  - condition: state
    entity_id: switch.solis_s6_eh3p_power_state
    state: 'on'
  - condition: template
    value_template: "{% set raw = state_attr('sensor.solis_planner_health', 'last_checked')
      %} {% set checked = as_datetime(raw) if raw else none %} {{ states('sensor.solis_planner_health')
      != 'ok'\n   or checked is none\n   or (now() - checked).total_seconds() >= 600
      }}"
  - condition: state
    entity_id: switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
    state: 'off'
  - condition: template
    value_template: "{% set soc = states('sensor.solis_s6_eh3p_battery_soc') | float(100)
      %} {% set night = is_state('sun.sun', 'below_horizon') %} {{ night and (soc
      <= 6 or (soc <= 16\n      and (now() >= today_at('20:30') or now() < today_at('10:00'))))
      }}\n"
  action:
  - service: switch.turn_off
    target:
      entity_id: switch.solis_s6_eh3p_power_state
  - service: notify.persistent_notification
    data:
      title: "Solis - Inverteris pailsi: žemas SOC + mažai saulės \U0001F6E1️"
      message: 'Baterija {{ states(''sensor.solis_s6_eh3p_battery_soc'') }}% ties
        nakties apsaugos riba, o centrinio Planner heartbeat nepatikimas. Avarinė
        atsarga išjungė inverterį, kad baterija nesiciklautų. Overdischarge nustatymas
        nebuvo keistas.

        '
  mode: single
- id: solis_storm_export_at_high_soc
  alias: Solis - Audros/ESO eksportas nuo 95% tik esant tinklui
  description: 'Rezervas turi prioritetą: eksporto leidimas tik su šviežiais SOC >=95% ir trijų fazių tinklo matavimais.
    Iškrovimo slotas lieka išjungtas; eksporto galios riba nekeičiama.'
  triggers:
  - trigger: state
    entity_id:
    - sensor.solis_s6_eh3p_battery_soc
    - select.solis_s6_eh3p_work_mode
    - input_boolean.storm_mode
  - trigger: time_pattern
    minutes: /1
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: input_boolean.storm_mode
    state: 'on'
  - condition: state
    entity_id: select.solis_s6_eh3p_work_mode
    state:
    - Self-Use
    - Self-Use + TOU
  - condition: state
    entity_id: switch.solis_s6_eh3p_allow_export_switch_under_self_generation_and_self_use
    state:
    - 'on'
    - 'off'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ -60 <= as_timestamp(now()) - (as_timestamp(states(''sensor.solis_s6_eh3p_last_modbus_success''),
          0)) <= 180 }}'
      - condition: numeric_state
        entity_id: sensor.solis_s6_eh3p_battery_soc
        above: 94.99
      - condition: numeric_state
        entity_id: sensor.solis_s6_eh3p_meter_ac_voltage_a
        above: 180
        below: 270
      - condition: numeric_state
        entity_id: sensor.solis_s6_eh3p_meter_ac_voltage_b
        above: 180
        below: 270
      - condition: numeric_state
        entity_id: sensor.solis_s6_eh3p_meter_ac_voltage_c
        above: 180
        below: 270
      - condition: numeric_state
        entity_id: sensor.solis_s6_eh3p_grid_frequency
        above: 45
        below: 55
      sequence:
      - if:
        - condition: state
          entity_id: switch.solis_s6_eh3p_allow_export_switch_under_self_generation_and_self_use
          state: 'off'
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.solis_s6_eh3p_allow_export_switch_under_self_generation_and_self_use
    default:
    - if:
      - condition: state
        entity_id: switch.solis_s6_eh3p_allow_export_switch_under_self_generation_and_self_use
        state: 'on'
      then:
      - action: switch.turn_off
        target:
          entity_id: switch.solis_s6_eh3p_allow_export_switch_under_self_generation_and_self_use
  mode: restart
- id: solis_inverter_temp_alert
  alias: Solis - Inverterio temperatūros įspėjimas (>70°C)
  description: 'Įspėja, kai inverterio temperatūra 10 min laikosi virš 70°C — artėja
    galios ribojimo (derating) zona, verta patikrinti vėdinimą. Trigeris suveikia
    tik kertant ribą, todėl pranešimas nesikartoja, kol temperatūra nenukrenta ir
    vėl nepakyla.

    '
  trigger:
  - platform: numeric_state
    entity_id: sensor.solis_s6_eh3p_temperature
    above: 70
    for: 00:10:00
  condition: []
  action:
  - service: notify.persistent_notification
    data:
      title: "Solis - Aukšta inverterio temperatūra \U0001F321️"
      message: 'Inverterio temperatūra {{ states(''sensor.solis_s6_eh3p_temperature'')
        }}°C jau 10 min viršija 70°C. Artėjant ~75°C inverteris pradės riboti galią.
        Patikrinkite vėdinimą / užtemdymą. PV galia: {{ states(''sensor.solis_s6_eh3p_total_pv_power'')
        }} W.

        '
  mode: single
- id: solis_bms_fault_alert
  alias: Solis - Baterijos BMS gedimo įspėjimas
  description: 'BMS temperatūros baterija neperduoda (registras visada 0), todėl sveikata
    stebima netiesiogiai: fault_status_1/2 registrai privalo būti 0 — bet kokia kita
    reikšmė yra BMS aliarmas (per aukšta/žema celių įtampa, temperatūra, srovė). Trigeris
    kertant 0 ribą.

    '
  trigger:
  - platform: numeric_state
    entity_id:
    - sensor.solis_s6_eh3p_battery_fault_status_1_bms
    - sensor.solis_s6_eh3p_battery_fault_status_2_bms
    above: 0
  condition: []
  action:
  - service: notify.persistent_notification
    data:
      title: Solis - Baterijos BMS aliarmas ⚠️
      message: 'BMS fault registrai: status_1 = {{ states(''sensor.solis_s6_eh3p_battery_fault_status_1_bms'')
        }}, status_2 = {{ states(''sensor.solis_s6_eh3p_battery_fault_status_2_bms'')
        }}. SOC: {{ states(''sensor.solis_s6_eh3p_battery_soc'') }} %, baterijos galia:
        {{ states(''sensor.solis_s6_eh3p_battery_power'') }} W, BMS įtampa: {{ states(''sensor.solis_s6_eh3p_battery_voltage_bms'')
        }} V. Patikrink baterijos būseną — nenulinis fault = BMS apsauga.

        '
  mode: single
- id: eimo_inverter_temp_alert
