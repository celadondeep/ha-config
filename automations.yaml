- id: system_appdaemon_startup_watchdog
  alias: Sistema - AppDaemon paleidimo sargyba
  description: 'Vienkartinė HA paleidimo saviatkūra. Po 2 min. perkrauna tik AppDaemon,
    jei Namų branduolio heartbeat nesukurtas arba pasenęs. Eimo debesies telemetrijos
    gedimas šios sargybos nesuveikia.

    '
  trigger:
  - platform: homeassistant
    event: start
  condition: []
  action:
  - delay: 00:02:00
  - condition: template
    value_template: "{% set raw = state_attr('sensor.solis_planner_health', 'last_checked')
      %} {% set checked = as_datetime(raw) if raw else none %} {{ states('sensor.solis_planner_health')
      in ['unknown', 'unavailable']\n   or checked is none\n   or (now() - checked).total_seconds()
      > 180 }}"
  - service: logbook.log
    data:
      name: ChatGPT HA priežiūra
      message: 'Po HA paleidimo Namų Planner heartbeat neatsirado per 2 min.; automatiškai
        perkraunamas tik AppDaemon priedas.

        '
      entity_id: automation.sistema_appdaemon_paleidimo_sargyba
  - service: hassio.app_restart
    data:
      app: a0d7b954_appdaemon
  mode: single
