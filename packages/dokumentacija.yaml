# =============================================================================
#  Dokumentacijos sinchronizavimas: /config/docs (git šaltinis) →
#  /config/www/docs/md (HA /local serviravimas — symlink'ų HA neseka).
#  Peržiūra: sidebaro „Dokumentacija" (lovelace/dokumentacija.yaml, iframe
#  į /local/docs/index.html su marked.js). Sinchronizuojama HA starte ir
#  kas 5 min (2026-07-22, buvo 30) — docs pakeitimas dashboarde matomas ne
#  vėliau kaip per 5 min (redaguojant galima iškviesti shell_command.sync_docs
#  ranka greitesniam atnaujinimui).
# =============================================================================

shell_command:
  sync_docs: "cp /config/docs/*.md /config/www/docs/md/"

automation:
  - id: docs_sync
    alias: "Dokumentacija - sinchronizuoti į /local"
    trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/5"
    action:
      - service: shell_command.sync_docs
    mode: single
