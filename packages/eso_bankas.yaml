# =============================================================================
#  ESO pasaugojimo bankas — Šeškinių (Modbus) elektrinės įvadas, obj. 220588.
#
#  Pasaugojimo schema: eksportuotos kWh keliauja į banką, importas dengiamas
#  iš banko 1:1 (mokamas tik mėnesinis abonentas). Kaupimo metai — bal. 1 iki
#  kov. 31 (nepanaudotas kreditas nudega). SVARBU: bankas niekada nelenda į
#  minusą — deficitinis mėnuo (importas > eksportas) banką nusausina daugiausiai
#  iki 0, todėl metinės sumos „eksportas − importas“ likutį NUVERTINA, jei
#  banko metuose buvo deficitinių mėnesių (2026-04: −274 kWh, ESO banke = 0).
#
#  Likutis = oficialus ESO skaičius + einamojo mėnesio srautai:
#   - sensor.eso_bankas_220588 (custom_components/eso sensorius) — ESO
#     savitarnos „Rodyti sukauptos energijos kiekį“ serija: banko likutis
#     paskutinio UŽDARYTO mėnesio gale, atnaujinamas per kasdienį importą;
#   - einamojo mėnesio eksportas/importas iš eso:energy_* statistikų (ESO
#     einamąjį mėnesį serijoje visada rodo 0, kol mėnuo neuždarytas).
#  Metiniai eso_ivado_eksportas/importas lieka informacijai (dashboarde ir
#  audite), bet likučio formulėje nebenaudojami.
#  eso_bankas_pradzia lieka tik rankinei korekcijai (normaliai 0).
# =============================================================================

input_number:
  eso_bankas_pradzia:
    name: "ESO banko korekcija (savitarnos likutis − suskaičiuotas)"
    min: -2000
    max: 20000
    step: 0.1
    mode: box
    unit_of_measurement: "kWh"
    icon: mdi:bank

sql:
  # Valandinių kWh suma einamaisiais banko metais (nuo balandžio 1 d.).
  # start_ts yra UTC epocha, todėl vidurnakčio riba pastumta −3 h (EEST).
  - name: "eso_ivado_eksportas"
    unique_id: eso_ivado_eksportas
    query: >-
      SELECT ROUND(SUM(s.state), 2) AS suma FROM statistics s
      JOIN statistics_meta m ON s.metadata_id = m.id
      WHERE m.statistic_id = 'eso:energy_returned_220588'
      AND s.start_ts >= strftime('%s', date('now', '-3 months', 'start of year', '+3 months')) - 10800;
    column: "suma"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total
    icon: mdi:transmission-tower-import

  - name: "eso_ivado_importas"
    unique_id: eso_ivado_importas
    query: >-
      SELECT ROUND(SUM(s.state), 2) AS suma FROM statistics s
      JOIN statistics_meta m ON s.metadata_id = m.id
      WHERE m.statistic_id = 'eso:energy_consumed_220588'
      AND s.start_ts >= strftime('%s', date('now', '-3 months', 'start of year', '+3 months')) - 10800;
    column: "suma"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total
    icon: mdi:transmission-tower-export

  # Einamojo mėnesio sumos — „gyvajai“ likučio daliai virš oficialaus ESO
  # skaičiaus (ESO einamąjį mėnesį uždaro tik jam pasibaigus).
  - name: "eso_ivado_eksportas_men"
    unique_id: eso_ivado_eksportas_men
    query: >-
      SELECT ROUND(COALESCE(SUM(s.state), 0), 2) AS suma FROM statistics s
      JOIN statistics_meta m ON s.metadata_id = m.id
      WHERE m.statistic_id = 'eso:energy_returned_220588'
      AND s.start_ts >= strftime('%s', date('now', '+3 hours', 'start of month')) - 10800;
    column: "suma"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total
    icon: mdi:transmission-tower-import

  - name: "eso_ivado_importas_men"
    unique_id: eso_ivado_importas_men
    query: >-
      SELECT ROUND(COALESCE(SUM(s.state), 0), 2) AS suma FROM statistics s
      JOIN statistics_meta m ON s.metadata_id = m.id
      WHERE m.statistic_id = 'eso:energy_consumed_220588'
      AND s.start_ts >= strftime('%s', date('now', '+3 hours', 'start of month')) - 10800;
    column: "suma"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total
    icon: mdi:transmission-tower-export

template:
  - sensor:
      # Banko likutis = oficialus ESO likutis (paskutinio uždaryto mėnesio
      # gale) + einamojo mėnesio eksportas − importas (+ rankinė korekcija,
      # normaliai 0). Bankas negali būti neigiamas.
      - name: "eso_bankas_likutis"
        unique_id: eso_bankas_likutis
        unit_of_measurement: "kWh"
        icon: mdi:bank
        state: >
          {% set korekcija = states('input_number.eso_bankas_pradzia') | float(0) %}
          {% set oficialus = states('sensor.eso_bankas_220588') | float(0) %}
          {% set eksp_men = states('sensor.eso_ivado_eksportas_men') | float(0) %}
          {% set imp_men = states('sensor.eso_ivado_importas_men') | float(0) %}
          {{ ([oficialus + eksp_men - imp_men + korekcija, 0] | max) | round(1) }}
        availability: >
          {{ has_value('sensor.eso_bankas_220588')
             and has_value('sensor.eso_ivado_importas_men') }}
        attributes:
          oficialus_eso: "{{ states('sensor.eso_bankas_220588') | float(0) | round(1) }}"
          oficialus_menuo: "{{ state_attr('sensor.eso_bankas_220588', 'menuo') }}"
          men_eksportas: "{{ states('sensor.eso_ivado_eksportas_men') | float(0) | round(1) }}"
          men_importas: "{{ states('sensor.eso_ivado_importas_men') | float(0) | round(1) }}"
          sukaupta_banko_metais: "{{ states('sensor.eso_ivado_eksportas') | float(0) | round(1) }}"
          atsiimta_banko_metais: "{{ states('sensor.eso_ivado_importas') | float(0) | round(1) }}"
          korekcija: "{{ states('input_number.eso_bankas_pradzia') | float(0) }}"

      # Banko vertė eurais — kiekviena banko kWh atstoja pirkimą už pv_kwh_verte.
      - name: "eso_bankas_verte"
        unique_id: eso_bankas_verte
        unit_of_measurement: "€"
        icon: mdi:cash-lock
        state: >
          {{ (states('sensor.eso_bankas_likutis') | float(0)
              * states('input_number.pv_kwh_verte') | float(0.25)) | round(0) }}
        availability: >
          {{ has_value('sensor.eso_bankas_likutis') }}
