# =============================================================================
#  ESO pasaugojimo bankas — Šeškinių (Modbus) elektrinės įvadas, obj. 220588.
#
#  Pasaugojimo schema: eksportuotos kWh keliauja į banką, importas dengiamas
#  iš banko 1:1 (mokamas tik mėnesinis abonentas). Kaupimo metai — bal. 1 iki
#  kov. 31 (nepanaudotas kreditas nudega). SVARBU: bankas niekada nelenda į
#  minusą — deficitinis mėnuo (importas > eksportas) banką nusausina daugiausiai
#  iki 0, todėl metinės sumos „eksportas − importas“ likutį NUVERTINA, jei
#  banko metuose buvo deficitinių mėnesių (2026-04: −274 kWh, ESO banke = 0).
#
#  Likutis = oficialus ESO skaičius + einamojo mėnesio srautai:
#   - sensor.eso_bankas_220588 (custom_components/eso sensorius) — ESO
#     savitarnos „Rodyti sukauptos energijos kiekį“ serija: banko likutis
#     paskutinio UŽDARYTO mėnesio gale, atnaujinamas per kasdienį importą;
#   - einamojo mėnesio eksportas/importas iš eso:energy_* statistikų (ESO
#     einamąjį mėnesį serijoje visada rodo 0, kol mėnuo neuždarytas).
#  Metiniai eso_ivado_eksportas/importas lieka informacijai (dashboarde ir
#  audite), bet likučio formulėje nebenaudojami.
#  eso_bankas_pradzia lieka tik rankinei korekcijai (normaliai 0).
# =============================================================================

input_number:
  eso_bankas_pradzia:
    name: "ESO banko korekcija (savitarnos likutis − suskaičiuotas)"
    min: -2000
    max: 20000
    step: 0.1
    mode: box
    unit_of_measurement: "kWh"
    icon: mdi:bank

sql:
  # Valandinių kWh suma einamaisiais banko metais (nuo balandžio 1 d.).
  # start_ts yra UTC epocha, todėl vidurnakčio riba pastumta −3 h (EEST).
  - name: "eso_ivado_eksportas"
    unique_id: eso_ivado_eksportas
    query: >-
      SELECT ROUND(SUM(s.state), 2) AS suma FROM statistics s
      JOIN statistics_meta m ON s.metadata_id = m.id
      WHERE m.statistic_id = 'eso:energy_returned_220588'
      AND s.start_ts >= strftime('%s', date('now', '-3 months', 'start of year', '+3 months')) - 10800;
    column: "suma"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total
    icon: mdi:transmission-tower-import

  - name: "eso_ivado_importas"
    unique_id: eso_ivado_importas
    query: >-
      SELECT ROUND(SUM(s.state), 2) AS suma FROM statistics s
      JOIN statistics_meta m ON s.metadata_id = m.id
      WHERE m.statistic_id = 'eso:energy_consumed_220588'
      AND s.start_ts >= strftime('%s', date('now', '-3 months', 'start of year', '+3 months')) - 10800;
    column: "suma"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total
    icon: mdi:transmission-tower-export

  # Einamojo mėnesio sumos — „gyvajai“ likučio daliai virš oficialaus ESO
  # skaičiaus (ESO einamąjį mėnesį uždaro tik jam pasibaigus).
  - name: "eso_ivado_eksportas_men"
    unique_id: eso_ivado_eksportas_men
    query: >-
      SELECT ROUND(COALESCE(SUM(s.state), 0), 2) AS suma FROM statistics s
      JOIN statistics_meta m ON s.metadata_id = m.id
      WHERE m.statistic_id = 'eso:energy_returned_220588'
      AND s.start_ts >= strftime('%s', date('now', '+3 hours', 'start of month')) - 10800;
    column: "suma"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total
    icon: mdi:transmission-tower-import

  - name: "eso_ivado_importas_men"
    unique_id: eso_ivado_importas_men
    query: >-
      SELECT ROUND(COALESCE(SUM(s.state), 0), 2) AS suma FROM statistics s
      JOIN statistics_meta m ON s.metadata_id = m.id
      WHERE m.statistic_id = 'eso:energy_consumed_220588'
      AND s.start_ts >= strftime('%s', date('now', '+3 hours', 'start of month')) - 10800;
    column: "suma"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total
    icon: mdi:transmission-tower-export

template:
  - sensor:
      # Banko likutis = oficialus ESO likutis (paskutinio uždaryto mėnesio
      # gale) + einamojo mėnesio eksportas − importas (+ rankinė korekcija,
      # normaliai 0). Bankas negali būti neigiamas.
      - name: "eso_bankas_likutis"
        unique_id: eso_bankas_likutis
        unit_of_measurement: "kWh"
        icon: mdi:bank
        state: >
          {% set korekcija = states('input_number.eso_bankas_pradzia') | float(0) %}
          {% set oficialus = states('sensor.eso_bankas_220588') | float(0) %}
          {% set eksp_men = states('sensor.eso_ivado_eksportas_men') | float(0) %}
          {% set imp_men = states('sensor.eso_ivado_importas_men') | float(0) %}
          {{ ([oficialus + eksp_men - imp_men + korekcija, 0] | max) | round(1) }}
        availability: >
          {{ has_value('sensor.eso_bankas_220588')
             and has_value('sensor.eso_ivado_importas_men') }}
        attributes:
          oficialus_eso: "{{ states('sensor.eso_bankas_220588') | float(0) | round(1) }}"
          oficialus_menuo: "{{ state_attr('sensor.eso_bankas_220588', 'menuo') }}"
          men_eksportas: "{{ states('sensor.eso_ivado_eksportas_men') | float(0) | round(1) }}"
          men_importas: "{{ states('sensor.eso_ivado_importas_men') | float(0) | round(1) }}"
          sukaupta_banko_metais: "{{ states('sensor.eso_ivado_eksportas') | float(0) | round(1) }}"
          atsiimta_banko_metais: "{{ states('sensor.eso_ivado_importas') | float(0) | round(1) }}"
          korekcija: "{{ states('input_number.eso_bankas_pradzia') | float(0) }}"

      # =====================================================================
      # Banko biudžetas iki kovo 31 (banko metų pabaigos).
      #
      # Trajektorija: dabartinis likutis + likusių mėnesių (eksportas −
      # importas), su mėnesio grindimis ties 0 (deficitinis mėnuo banko
      # nenusuka į minusą — ESO taisyklė, patvirtinta 2026-04 faktu).
      #
      # MĖNESIŲ LENTELĖS — PRELIMINARIOS (2026-07-17): geg./birž. — faktas,
      # liepa — ekstrapoliuota iš 16 d., kiti mėnesiai — įverčiai pagal LT
      # sezoniškumą ir NE-elektrinį šildymą (importas žiemą ~10-13 kWh/d).
      # Kasdienis auditas, mėnesiui užsidarius, turi pakeisti to mėnesio
      # įvertį faktu ir pertikrinti likusius.
      #
      # Interpretacija: prognozė >0 kovo 31 = tiek kWh NUDEGS (per didelis
      # kaupimas — vasaros pabaigoje galima drąsiau vartoti/mažiau saugoti);
      # pritruks_kwh >0 = žiemą bankas išsisems ir tiek kWh reikės pirkti
      # (kaupimas kritiškai svarbus, realizavimo prioritetas teisingas).
      # =====================================================================
      - name: "eso_bankas_prognoze"
        unique_id: eso_bankas_prognoze
        unit_of_measurement: "kWh"
        icon: mdi:chart-sankey
        state: >
          {% set exp = {4:200, 5:194, 6:302, 7:210, 8:180, 9:120, 10:60, 11:15, 12:5, 1:10, 2:40, 3:120} %}
          {% set imp = {4:150, 5:128, 6:98, 7:145, 8:110, 9:130, 10:200, 11:300, 12:380, 1:380, 2:300, 3:250} %}
          {% set m0 = now().month %}
          {% set likusi = 1 - (now().day / 30.4) %}
          {% set men_sarasas = (range(m0, 13) | list) + [1, 2, 3] if m0 >= 4 else (range(m0, 4) | list) %}
          {% set ns = namespace(bal = states('sensor.eso_bankas_likutis') | float(0)) %}
          {% for m in men_sarasas %}
            {% set frac = likusi if loop.first else 1.0 %}
            {% set ns.bal = [ns.bal + (exp[m] - imp[m]) * frac, 0] | max %}
          {% endfor %}
          {{ ns.bal | round(0) }}
        availability: >
          {{ has_value('sensor.eso_bankas_likutis') }}
        attributes:
          pritruks_kwh: >-
            {% set exp = {4:200, 5:194, 6:302, 7:210, 8:180, 9:120, 10:60, 11:15, 12:5, 1:10, 2:40, 3:120} %}
            {% set imp = {4:150, 5:128, 6:98, 7:145, 8:110, 9:130, 10:200, 11:300, 12:380, 1:380, 2:300, 3:250} %}
            {% set m0 = now().month %}
            {% set likusi = 1 - (now().day / 30.4) %}
            {% set men_sarasas = (range(m0, 13) | list) + [1, 2, 3] if m0 >= 4 else (range(m0, 4) | list) %}
            {% set ns = namespace(bal = states('sensor.eso_bankas_likutis') | float(0), trukumas = 0.0) %}
            {% for m in men_sarasas %}
              {% set frac = likusi if loop.first else 1.0 %}
              {% set naujas = ns.bal + (exp[m] - imp[m]) * frac %}
              {% if naujas < 0 %}{% set ns.trukumas = ns.trukumas - naujas %}{% endif %}
              {% set ns.bal = [naujas, 0] | max %}
            {% endfor %}
            {{ ns.trukumas | round(0) }}
          pirmas_deficito_men: >-
            {% set exp = {4:200, 5:194, 6:302, 7:210, 8:180, 9:120, 10:60, 11:15, 12:5, 1:10, 2:40, 3:120} %}
            {% set imp = {4:150, 5:128, 6:98, 7:145, 8:110, 9:130, 10:200, 11:300, 12:380, 1:380, 2:300, 3:250} %}
            {% set m0 = now().month %}
            {% set likusi = 1 - (now().day / 30.4) %}
            {% set men_sarasas = (range(m0, 13) | list) + [1, 2, 3] if m0 >= 4 else (range(m0, 4) | list) %}
            {% set ns = namespace(bal = states('sensor.eso_bankas_likutis') | float(0), men = 0) %}
            {% for m in men_sarasas %}
              {% set frac = likusi if loop.first else 1.0 %}
              {% set naujas = ns.bal + (exp[m] - imp[m]) * frac %}
              {% if naujas < 0 and ns.men == 0 %}{% set ns.men = m %}{% endif %}
              {% set ns.bal = [naujas, 0] | max %}
            {% endfor %}
            {{ ns.men if ns.men > 0 else 'nėra' }}
          verdiktas: >-
            {% set p = states('sensor.eso_bankas_prognoze') | float(-1) %}
            {% if p > 50 %}NUDEGS ~{{ p | round(0) }} kWh kovo 31 — kaupiama per daug
            {% elif p >= 0 and state_attr('sensor.eso_bankas_prognoze', 'pritruks_kwh') | float(0) < 50 %}Subalansuota
            {% else %}DEFICITAS — banko pritrūks, kaupimas kritiškai svarbus{% endif %}

      # Baterijos ciklo ekonomika esant pasaugojimo schemai: kol banko
      # likutis > 0, kiekviena per bateriją apsukta kWh pralaimi prieš
      # kelią „eksportas į banką → importas 1:1“ — praranda round-trip
      # nuostolį (1−η)×kWh_vertė + nusidėvėjimą (~0.04 €/kWh: 6000 ciklų
      # LFP, ~3500 € baterijos dalis / (6000 × 14.4 kWh)). Ciklas lieka
      # BŪTINAS kaip perpildymo buferis (1 kW eksporto lubos) — čia
      # vertinamas tik savanoriškas ciklas (vakaro iškrovimas į namus,
      # krovimas žiemą). Žiemos politikai: kai bankas > 0 ir nėra
      # perpildymo, baterijos geriau nesukti.
      - name: "baterijos_ciklo_nuostolis"
        unique_id: baterijos_ciklo_nuostolis
        unit_of_measurement: "ct/kWh"
        icon: mdi:battery-minus-outline
        state: >
          {% set rt = states('sensor.battery_roundtrip_efficiency') | float(90) / 100 %}
          {% set verte = states('input_number.pv_kwh_verte') | float(0.25) %}
          {{ (((1 - rt) * verte + 0.04) * 100) | round(1) }}
        availability: >
          {{ has_value('sensor.battery_roundtrip_efficiency') }}
        attributes:
          round_trip: "{{ states('sensor.battery_roundtrip_efficiency') }} %"
          nusidevejimas_ct_kwh: "4.0"
          verdiktas: >-
            {% if states('sensor.eso_bankas_likutis') | float(0) > 20 %}Bankas dengia importą 1:1 — savanoriškas ciklas nuostolingas ({{ states('sensor.baterijos_ciklo_nuostolis') }} ct/kWh); ciklas pateisinamas tik perpildymo buferiui
            {% else %}Bankas beveik tuščias — baterijos ciklas dengia realų pirkimą, apsimoka{% endif %}

      # Banko vertė eurais — kiekviena banko kWh atstoja pirkimą už pv_kwh_verte.
      - name: "eso_bankas_verte"
        unique_id: eso_bankas_verte
        unit_of_measurement: "€"
        icon: mdi:cash-lock
        state: >
          {{ (states('sensor.eso_bankas_likutis') | float(0)
              * states('input_number.pv_kwh_verte') | float(0.25)) | round(0) }}
        availability: >
          {{ has_value('sensor.eso_bankas_likutis') }}
