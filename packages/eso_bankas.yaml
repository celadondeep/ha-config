# =============================================================================
#  ESO pasaugojimo bankas — Šeškinių (Modbus) elektrinės įvadas, obj. 220588.
#  Duomenų šaltinis: custom_components/eso ilgalaikės statistikos
#  (eso:energy_consumed_220588 / eso:energy_returned_220588), pilna valandinė
#  istorija atsisiųsta atgaline data (eso.import_now su date_from/date_to).
#
#  Pasaugojimo schema: eksportuotos kWh keliauja į banką, importas dengiamas
#  iš banko 1:1 (mokamas tik mėnesinis abonentas). Kaupimo metai — bal. 1 iki
#  kov. 31 (nepanaudotas kreditas nudega). SQL sumos skaičiuojamos einamųjų
#  banko metų lange, kurio pradžią SQLite išsiveda pati (balandžio 1 d.:
#  now −3 mėn. → metų pradžia → +3 mėn.), tad balandžio 1 niekas
#  neperstatinėjama — sensoriai persijungia automatiškai.
#  eso_bankas_pradzia lieka tik rankinei korekcijai, jei ESO savitarnos
#  likutis skirtųsi nuo suskaičiuoto (normaliai 0).
# =============================================================================

input_number:
  eso_bankas_pradzia:
    name: "ESO banko korekcija (savitarnos likutis − suskaičiuotas)"
    min: -2000
    max: 20000
    step: 0.1
    mode: box
    unit_of_measurement: "kWh"
    icon: mdi:bank

sql:
  # Valandinių kWh suma einamaisiais banko metais (nuo balandžio 1 d.).
  # start_ts yra UTC epocha, todėl vidurnakčio riba pastumta −3 h (EEST).
  - name: "eso_ivado_eksportas"
    unique_id: eso_ivado_eksportas
    query: >-
      SELECT ROUND(SUM(s.state), 2) AS suma FROM statistics s
      JOIN statistics_meta m ON s.metadata_id = m.id
      WHERE m.statistic_id = 'eso:energy_returned_220588'
      AND s.start_ts >= strftime('%s', date('now', '-3 months', 'start of year', '+3 months')) - 10800;
    column: "suma"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total
    icon: mdi:transmission-tower-import

  - name: "eso_ivado_importas"
    unique_id: eso_ivado_importas
    query: >-
      SELECT ROUND(SUM(s.state), 2) AS suma FROM statistics s
      JOIN statistics_meta m ON s.metadata_id = m.id
      WHERE m.statistic_id = 'eso:energy_consumed_220588'
      AND s.start_ts >= strftime('%s', date('now', '-3 months', 'start of year', '+3 months')) - 10800;
    column: "suma"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total
    icon: mdi:transmission-tower-export

template:
  - sensor:
      # Banko likutis = eksportuota − atsiimta einamaisiais banko metais
      # (+ rankinė korekcija, normaliai 0).
      - name: "eso_bankas_likutis"
        unique_id: eso_bankas_likutis
        unit_of_measurement: "kWh"
        icon: mdi:bank
        state: >
          {% set korekcija = states('input_number.eso_bankas_pradzia') | float(0) %}
          {% set eksp = states('sensor.eso_ivado_eksportas') | float(0) %}
          {% set imp = states('sensor.eso_ivado_importas') | float(0) %}
          {{ ([korekcija + eksp - imp, 0] | max) | round(1) }}
        availability: >
          {{ has_value('sensor.eso_ivado_importas') }}
        attributes:
          sukaupta_banko_metais: "{{ states('sensor.eso_ivado_eksportas') | float(0) | round(1) }}"
          atsiimta_banko_metais: "{{ states('sensor.eso_ivado_importas') | float(0) | round(1) }}"
          korekcija: "{{ states('input_number.eso_bankas_pradzia') | float(0) }}"

      # Banko vertė eurais — kiekviena banko kWh atstoja pirkimą už pv_kwh_verte.
      - name: "eso_bankas_verte"
        unique_id: eso_bankas_verte
        unit_of_measurement: "€"
        icon: mdi:cash-lock
        state: >
          {{ (states('sensor.eso_bankas_likutis') | float(0)
              * states('input_number.pv_kwh_verte') | float(0.25)) | round(0) }}
        availability: >
          {{ has_value('sensor.eso_bankas_likutis') }}
