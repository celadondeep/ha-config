# =============================================================================
#  2-a elektrinė (Eimo SE) — energijos valdymas per Solis Cloud API
#  ATSKIRA, NEPRIKLAUSOMA sistema nuo 1-os elektrinės (Šeškinių 2, lokalus Modbus).
#  Inverteris: 1033300254190112 (cloud: solis + solis_cloud_control).
#  Tikslinį SOC skaičiuoja appdaemon/apps/energy_manager_eimo.py
#  (publikuoja sensor.energy_manager_eimo_target_soc); čia — tik valdymas + helperiai.
#  NIEKADA neliesti 1-os elektrinės entitės (solis_s6_eh3p_*, energy_manager_*).
# =============================================================================

input_boolean:
  storm_mode_eimo:
    name: "Eimo: Audros / ESO režimas"
    icon: mdi:weather-lightning

input_select:
  energy_season_eimo:
    name: "Eimo: Sezonas"
    options:
      - žiema
      - pavasaris
      - vasara
      - ruduo
    initial: vasara
    icon: mdi:weather-sunny

input_number:
  # Solcast „vakar prognozė" Eimo elektrinei (kasdien 23:55 įrašoma forecast_today).
  solcast_forecast_yesterday_eimo:
    name: "Eimo: Vakar prognozuota gamyba"
    min: 0
    max: 200
    step: 0.1
    unit_of_measurement: kWh
    icon: mdi:weather-partly-cloudy
    mode: box
  # Elektros kainos Eimo elektrinei (atskiros nuo 1-os, kad būtų nepriklausoma).
  electricity_price_buy_eimo:
    name: "Eimo: Elektros pirkimo kaina"
    min: 0
    max: 1
    step: 0.001
    unit_of_measurement: "€/kWh"
    icon: mdi:transmission-tower-import
    mode: box
  electricity_price_sell_eimo:
    name: "Eimo: Elektros pardavimo kaina"
    min: 0
    max: 1
    step: 0.001
    unit_of_measurement: "€/kWh"
    icon: mdi:transmission-tower-export
    mode: box
  # Dienos iškrovimo apatinė riba (slot1 cut-off SOC). Baterijos dugnas 5 (HW
  # over-discharge), eksporto dugnas 6 (slot SOC min) — slot įsijungia ties
  # riba+1 (7%).
  daytime_export_floor_eimo:
    name: "Eimo: Dienos eksporto apatinė riba"
    min: 6
    max: 50
    step: 1
    initial: 6
    unit_of_measurement: "%"
    icon: mdi:battery-arrow-down
    mode: box

# Namų suvartojimo energijos skaitiklis (kWh) iš cloud galios sensoriaus —
# Modbus pusėje yesterday_energy_consumption duoda pats inverteris, cloud jo
# neturi. Riemann left (cloud atsinaujina ~5 min laipteliais), utility_meter
# paros ciklas → last_period po 00:00 = vakardienos suma. Iš jos
# sensor.eimo_consumption_yesterday, kurį skaito consumption_model_eimo.py
# (iki 2026-07-17 entity neegzistavo ir modelis mokėsi tik iš 15 min mėginių,
# dingstančių per AppDaemon restartą).
sensor:
  - platform: integration
    source: sensor.solis_inverter_1033300254190112_solis_total_consumption_power
    name: eimo_house_energy
    unique_id: eimo_house_energy
    unit_prefix: k
    round: 3
    method: left

utility_meter:
  eimo_consumption_today:
    name: "Eimo: namų suvartojimas šiandien"
    source: sensor.eimo_house_energy
    cycle: daily

template:
  - sensor:
      # Vakardienos paros suvartojimas — utility_meter last_period atributas
      # (užsipildo po pirmo paros resetinimo 00:00). consumption_model_eimo.py
      # jį skaito 00:05 kaip patikimą dienos sumą (Modbus analogas —
      # sensor.solis_s6_eh3p_yesterday_energy_consumption).
      - name: "eimo_consumption_yesterday"
        unique_id: eimo_consumption_yesterday
        unit_of_measurement: kWh
        icon: mdi:home-lightning-bolt
        state: >
          {{ state_attr('sensor.eimo_consumption_today', 'last_period') | float(0) | round(2) }}
        availability: >
          {{ state_attr('sensor.eimo_consumption_today', 'last_period') is not none }}
      # Intradienos Solcast santykis (Eimo) — faktinė šios dienos gamyba
      # lyginama su tuo, kiek pagal koreguotą prognozę TURĖJO būti pagaminta
      # iki šio momento. Naudojamas surplus skaičiavime, kad geresnę nei
      # prognozuota dieną dienos iškrovimas įsijungtų nuo to momento, kai
      # likusi gamyba nebetilps baterijoje — nelaukiant paros EMA (23:50).
      # Kol tikėtina gamyba < 1.5 kWh — santykis 1 (ryto triukšmas / mažas
      # vardiklis; cloud energy_today dar ir vėluoja ~5 min). Clamp 0.5–1.8.
      # Modbus analogas: sensor.solcast_intraday_ratio (configuration.yaml).
      - name: "solcast_intraday_ratio_eimo"
        unique_id: solcast_intraday_ratio_eimo
        state_class: measurement
        icon: mdi:sun-clock
        state: >
          {% set corr = states('sensor.solcast_correction_factor_eimo') | float(1) %}
          {% set total = states('sensor.solcast_pv_forecast_forecast_today') | float(0) %}
          {% set remaining = states('sensor.solcast_pv_forecast_forecast_remaining_today') | float(0) %}
          {% set expected = [total - remaining, 0] | max * corr %}
          {% set actual = states('sensor.solis_inverter_1033300254190112_solis_energy_today') | float(0) %}
          {% if expected < 1.5 %}
            1.0
          {% else %}
            {{ [[actual / expected, 0.5] | max, 1.8] | min | round(3) }}
          {% endif %}
        availability: >
          {{ states('sensor.solcast_pv_forecast_forecast_today') not in ['unavailable', 'unknown', '']
             and states('sensor.solcast_pv_forecast_forecast_remaining_today') not in ['unavailable', 'unknown', '']
             and states('sensor.solis_inverter_1033300254190112_solis_energy_today') not in ['unavailable', 'unknown', ''] }}
        attributes:
          faktas_kwh: >
            {{ states('sensor.solis_inverter_1033300254190112_solis_energy_today') | float(0) | round(2) }}
          tiketasi_iki_dabar_kwh: >
            {% set total = states('sensor.solcast_pv_forecast_forecast_today') | float(0) %}
            {% set remaining = states('sensor.solcast_pv_forecast_forecast_remaining_today') | float(0) %}
            {{ ([total - remaining, 0] | max * states('sensor.solcast_correction_factor_eimo') | float(1)) | round(2) }}

      # Numatomas šiandienos rezultatas (Eimo): jau pagaminta + Solcast „liko
      # šiandien" × Eimo korekcija × intradienos santykis. Modbus analogas —
      # sensor.solar_today_expected (configuration.yaml); ten Solcast likutis
      # imamas žalias, nes Solcast site sukalibruotas 1-ai elektrinei, o Eimo
      # tą pačią prognozę skaliuoja solcast_correction_factor_eimo (EMA) ir
      # solcast_intraday_ratio_eimo (šios dienos faktas vs prognozė).
      - name: "solar_today_expected_eimo"
        unique_id: solar_today_expected_eimo
        unit_of_measurement: kWh
        state_class: measurement
        icon: mdi:chart-bell-curve-cumulative
        state: >
          {% set a = states('sensor.solis_inverter_1033300254190112_solis_energy_today') | float(0) %}
          {% set r = states('sensor.solcast_pv_forecast_forecast_remaining_today') | float(0)
                     * states('sensor.solcast_correction_factor_eimo') | float(1)
                     * states('sensor.solcast_intraday_ratio_eimo') | float(1) %}
          {{ (a + r) | round(1) }}
        availability: >
          {{ states('sensor.solis_inverter_1033300254190112_solis_energy_today') not in ['unavailable', 'unknown', '']
             and states('sensor.solcast_pv_forecast_forecast_remaining_today') not in ['unavailable', 'unknown', ''] }}
        attributes:
          pagaminta_kwh: >
            {{ states('sensor.solis_inverter_1033300254190112_solis_energy_today') | float(0) | round(2) }}
          liko_koreguota_kwh: >
            {{ (states('sensor.solcast_pv_forecast_forecast_remaining_today') | float(0)
                * states('sensor.solcast_correction_factor_eimo') | float(1)
                * states('sensor.solcast_intraday_ratio_eimo') | float(1)) | round(2) }}

      # --- Ekonomika ir baterijos sveikata (Modbus analogai, 2026-07-17) ----
      # Šaltiniai — cloud paros/lifetime skaitliukai (granuliarumas ~1 kWh,
      # atsinaujina ~5 min; energy_today retkarčiais rodo artefaktus — žr.
      # 07-14 auditą, todėl reikšmės orientacinės).
      # ----------------------------------------------------------------------

      # Savarankiškumas šiandien: kiek % namų suvartojimo padengė ne tinklas.
      # Modbus analogas — sensor.self_sufficiency_today.
      - name: "self_sufficiency_today_eimo"
        unique_id: self_sufficiency_today_eimo
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:home-percent
        state: >
          {% set cons = states('sensor.solis_inverter_1033300254190112_solis_daily_grid_energy_used') | float(0) %}
          {% set imp  = states('sensor.solis_inverter_1033300254190112_solis_daily_grid_energy_purchased') | float(0) %}
          {{ ([(1 - imp / cons) * 100, 0] | max) | round(0) if cons > 0.1 else 0 }}
        availability: >
          {{ states('sensor.solis_inverter_1033300254190112_solis_daily_grid_energy_used') not in ['unavailable', 'unknown', ''] }}

      # Sutaupyta šiandien €: savo reikmėms panaudota saulė (PV − parduota) ×
      # pirkimo kaina + parduota × pardavimo kaina − pirkta × pirkimo kaina.
      # Modbus analogas — sensor.energy_savings_today. 0 — TEISĖTA kaina
      # (ESO pasaugojimo schema: buy=0.0/sell=0.25); fallback tik kai
      # input_number nepasiekiamas (float default).
      - name: "energy_savings_today_eimo"
        unique_id: energy_savings_today_eimo
        unit_of_measurement: "€"
        state_class: measurement
        icon: mdi:piggy-bank
        state: >
          {% set pv   = states('sensor.solis_inverter_1033300254190112_solis_energy_today') | float(0) %}
          {% set sell = states('sensor.solis_inverter_1033300254190112_solis_daily_on_grid_energy') | float(0) %}
          {% set buy  = states('sensor.solis_inverter_1033300254190112_solis_daily_grid_energy_purchased') | float(0) %}
          {% set p_buy  = states('input_number.electricity_price_buy_eimo') | float(0.18) %}
          {% set p_sell = states('input_number.electricity_price_sell_eimo') | float(0.08) %}
          {{ (([pv - sell, 0] | max) * p_buy + sell * p_sell - buy * p_buy) | round(2) }}
        availability: >
          {{ states('sensor.solis_inverter_1033300254190112_solis_energy_today') not in ['unavailable', 'unknown', ''] }}

      # Baterijos round-trip efektyvumas (lifetime): iškrauta / įkrauta,
      # atėmus baterijoje likusią energiją (SOC × 14.336 kWh). Modbus
      # analogas — sensor.battery_roundtrip_efficiency; inverterio savivartos
      # korekcijos cloud pusėje nėra (nėra tokio matavimo), todėl reikšmė
      # šiek tiek pesimistinė.
      - name: "battery_roundtrip_efficiency_eimo"
        unique_id: battery_roundtrip_efficiency_eimo
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:battery-sync
        state: >
          {% set chg = states('sensor.solis_inverter_1033300254190112_solis_total_energy_charged') | float(0) %}
          {% set dis = states('sensor.solis_inverter_1033300254190112_solis_total_energy_discharged') | float(0) %}
          {% set stored = states('sensor.solis_inverter_1033300254190112_solis_remaining_battery_capacity') | float(0) / 100 * 14.336 %}
          {% set denom = chg - stored %}
          {{ (dis / denom * 100) | round(1) if denom > 50 else 'unknown' }}
        availability: >
          {{ states('sensor.solis_inverter_1033300254190112_solis_total_energy_charged') not in ['unavailable', 'unknown', ''] }}

      # Ekvivalentiniai baterijos ciklai = bendra įkrovos energija /
      # naudingoji talpa (13.619 kWh = 14.336 × 95 %, ruožas 5–100 % —
      # KWH_PER_SOC iš energy_manager_eimo.py). Modbus analogas —
      # sensor.battery_equivalent_cycles.
      - name: "battery_equivalent_cycles_eimo"
        unique_id: battery_equivalent_cycles_eimo
        state_class: total_increasing
        icon: mdi:battery-sync
        state: >
          {{ (states('sensor.solis_inverter_1033300254190112_solis_total_energy_charged') | float(0) / 13.619) | round(1) }}
        availability: >
          {{ states('sensor.solis_inverter_1033300254190112_solis_total_energy_charged') not in ['unavailable', 'unknown', ''] }}
        # Nusidėvėjimo tempas nuo paleidimo ~2026-02-01 ir projekcija iki
        # 6000 ciklų (tipinis LFP resursas iki 80 % SOH).
        attributes:
          ikrauta_kwh: "{{ states('sensor.solis_inverter_1033300254190112_solis_total_energy_charged') | float(0) | round(0) }}"
          dienos_nuo_pajungimo: "{{ ((as_timestamp(now()) - as_timestamp('2026-02-01 12:00:00+02:00')) / 86400) | round(0) }}"
          ciklai_per_diena: >-
            {% set d = (as_timestamp(now()) - as_timestamp('2026-02-01 12:00:00+02:00')) / 86400 %}
            {{ ((states('sensor.solis_inverter_1033300254190112_solis_total_energy_charged') | float(0) / 13.619) / d) | round(2) if d > 1 else 'unknown' }}
          prognoze_ciklu_per_metus: >-
            {% set d = (as_timestamp(now()) - as_timestamp('2026-02-01 12:00:00+02:00')) / 86400 %}
            {{ ((states('sensor.solis_inverter_1033300254190112_solis_total_energy_charged') | float(0) / 13.619) / d * 365) | round(0) if d > 1 else 'unknown' }}
          metai_iki_6000_ciklu: >-
            {% set d = (as_timestamp(now()) - as_timestamp('2026-02-01 12:00:00+02:00')) / 86400 %}
            {% set per_metus = (states('sensor.solis_inverter_1033300254190112_solis_total_energy_charged') | float(0) / 13.619) / d * 365 if d > 1 else 0 %}
            {{ ((6000 - states('sensor.solis_inverter_1033300254190112_solis_total_energy_charged') | float(0) / 13.619) / per_metus) | round(0) if per_metus > 1 else 'unknown' }}
          bms_soh: "{{ states('sensor.solis_inverter_1033300254190112_solis_battery_state_of_health') }}"

      # Realus eksportuojamas perteklius (kWh) — kiek likusios dienos saulės
      # NETURĖS kur dėtis, tik į tinklą (Modbus energy_manager_surplus analogas).
      #
      #   perteklius = pv_liko − baterijos_vieta_iki_100%
      #
      #   pv_liko   = Solcast „liko šiandien" × solcast_correction_factor_eimo
      #               × intradienos santykis (solcast_intraday_ratio_eimo) —
      #               dinamiškai seka realią dieną (2026-07-11)
      #   vieta     = (100 − SOC) × 0.1434 kWh/%  (KWH_PER_SOC iš
      #               energy_manager_eimo.py: 13.619 kWh / 95)
      #
      # Namų suvartojimas į formulę NEĮTRAUKIAMAS (2026-07-11): didžioji jo
      # dalis būna vakare/naktį, kai saulės nebėra — toks vartojimas negali
      # „sugerti" PV, todėl atimant visos paros likutį perteklius būdavo
      # dirbtinai mažinamas ir pardavimas vėluodavo. Dienos vartojimo poveikį
      # uždaro grįžtamasis ryšys: SOC kas 15 min perskaičiuoja vietą.
      # Sloto eksporto sparta praktiškai ~1 kW ≈ 1 kWh/val, todėl pardavimą
      # svarbu pradėti anksti (ON slenkstis >1 kWh); pardavimo_eta_h atributas
      # rodo, kiek valandų pardavimo reikia dabartiniam pertekliui.
      - name: "energy_manager_eimo_surplus"
        unique_id: energy_manager_eimo_surplus
        unit_of_measurement: kWh
        # device_class: energy negalima — svyruojanti prognozė (measurement)
        state_class: measurement
        icon: mdi:transmission-tower-export
        state: >
          {% set per = 0.1434 %}
          {% set pv_remaining = states('sensor.solcast_pv_forecast_forecast_remaining_today') | float(0)
                                * states('sensor.solcast_correction_factor_eimo') | float(1)
                                * states('sensor.solcast_intraday_ratio_eimo') | float(1) %}
          {% set soc = states('sensor.solis_inverter_1033300254190112_solis_remaining_battery_capacity') | float(100) %}
          {% set battery_headroom = [(100 - soc) * per, 0] | max %}
          {{ [pv_remaining - battery_headroom, 0] | max | round(1) }}
        availability: >
          {{ states('sensor.solcast_pv_forecast_forecast_remaining_today') not in ['unavailable', 'unknown', '']
             and states('sensor.solis_inverter_1033300254190112_solis_remaining_battery_capacity') not in ['unavailable', 'unknown', ''] }}
        attributes:
          pv_remaining_kwh: >
            {{ (states('sensor.solcast_pv_forecast_forecast_remaining_today') | float(0)
                * states('sensor.solcast_correction_factor_eimo') | float(1)
                * states('sensor.solcast_intraday_ratio_eimo') | float(1)) | round(2) }}
          intraday_ratio: >
            {{ states('sensor.solcast_intraday_ratio_eimo') | float(1) }}
          battery_headroom_kwh: >
            {% set soc = states('sensor.solis_inverter_1033300254190112_solis_remaining_battery_capacity') | float(100) %}
            {{ [(100 - soc) * 0.1434, 0] | max | round(2) }}
          # Kiek valandų dienos pardavimo (~1 kW → ~1 kWh/val) reikia
          # dabartiniam pertekliui atiduoti į tinklą.
          pardavimo_eta_h: >
            {% set per = 0.1434 %}
            {% set pv_remaining = states('sensor.solcast_pv_forecast_forecast_remaining_today') | float(0)
                                  * states('sensor.solcast_correction_factor_eimo') | float(1)
                                  * states('sensor.solcast_intraday_ratio_eimo') | float(1) %}
            {% set soc = states('sensor.solis_inverter_1033300254190112_solis_remaining_battery_capacity') | float(100) %}
            {% set headroom = [(100 - soc) * per, 0] | max %}
            {{ ([pv_remaining - headroom, 0] | max / 1.0) | round(1) }}

      # Bendra PV galia (W) = PV1 + PV2. energy_manager_eimo.py naudoja kaip pv_power.
      # SVARBU: entity_id = sensor.eimo_pv_power (rankiniu būdu pervadintas entitetų
      # registre pagal unique_id). HA iš pavadinimo "Eimo PV galia" auto-generuotų
      # sensor.eimo_pv_galia — todėl entity_id NEKEISTI per name; jis pririštas prie
      # unique_id. Kodas ir dashboard remiasi sensor.eimo_pv_power.
      - name: "Eimo PV galia"
        unique_id: eimo_pv_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:solar-power
        state: >
          {{ (states('sensor.solis_inverter_1033300254190112_solis_dc_power_pv1') | float(0)
              + states('sensor.solis_inverter_1033300254190112_solis_dc_power_pv2') | float(0)) | round(0) }}
        availability: >
          {{ states('sensor.solis_inverter_1033300254190112_solis_dc_power_pv1')
             not in ['unavailable', 'unknown', 'none', ''] }}

automation:
  # ───────────────────────────────────────────────────────────────────────
  #  Vakaro iškrovimas (20:00) — pagal energy_manager_eimo tikslinį SOC.
  #  Cloud: iškrovimas į tinklą = slot1_discharge jungiklis (storage_mode lieka
  #  Self-Use). slot1_discharge_soc = cut-off (min 6%!).
  # ───────────────────────────────────────────────────────────────────────
  - id: solis_evening_discharge_eimo
    alias: "Eimo - Vakaro iškrovimas pagal rytojaus prognozę"
    description: >
      20:00: jei esamas SOC viršija energy_manager_eimo apskaičiuotą tikslą —
      įjungia cloud slot1 iškrovimą į tinklą (21:00–07:30) su cut-off ties tikslu
      (clamp ≥6%, nes slot SOC min = 6). Kitaip — slotas išjungtas, baterija namams.
    trigger:
      - platform: time
        at: "20:00:00"
    variables:
      forecast_tomorrow: >-
        {{ (states('sensor.solcast_pv_forecast_forecast_tomorrow') | float(0)
            * states('sensor.solcast_correction_factor_eimo') | float(1)) | round(1) }}
      current_soc: "{{ states('sensor.solis_inverter_1033300254190112_solis_remaining_battery_capacity') | float(0) }}"
      # Tikslinis SOC iš AppDaemon (energy_manager_eimo). Clamp į slot SOC min 6%.
      target_soc: "{{ [states('sensor.energy_manager_eimo_target_soc') | float(100) | round(0) | int, 6] | max }}"
      discharge_current: 100   # A, slot iškrovimo srovė (max 220) — derinama pagal poreikį
      # 7 punktas (2026-07-18): iškrovimo PABAIGA taikoma į saulėtekį (Eimo
      # neturi morning_on sensoriaus — naudojamas sun.sun next_rising), kad
      # baterija kuo trumpiau stovėtų ties minimumu. Sparta ~1 kWh/val +
      # 0.5 val atsarga; itin saulėtai dienai (>22 kWh) baigiama ~1 val
      # anksčiau. Startas ne ankstesnis nei 21:00. 1% SOC ≈ 0.1434 kWh.
      discharge_start: >-
        {% set m = as_datetime(state_attr('sun.sun', 'next_rising')) %}
        {% set morning = m.astimezone() if m is not none
           else (now() + timedelta(days=1)).replace(hour=6, minute=0, second=0, microsecond=0) %}
        {% set hours = ((current_soc - target_soc) * 0.1434 / 1.0) + 0.5
           + (1.0 if forecast_tomorrow > 22 else 0.0) %}
        {% set start = morning - timedelta(hours=hours) %}
        {% set earliest = now().replace(hour=21, minute=0, second=0, microsecond=0) %}
        {{ (start if start > earliest else earliest).strftime('%H:%M') }}
    action:
      - choose:
          # 1) Audros/ESO režimas — neiškrauti, baterija rezervas namams
          - conditions:
              - condition: state
                entity_id: input_boolean.storm_mode_eimo
                state: "on"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.inverter_control_1033300254190112_slot1_discharge
              - service: select.select_option
                target:
                  entity_id: select.inverter_control_1033300254190112_storage_mode
                data:
                  option: "Self-Use"
              - service: notify.persistent_notification
                data:
                  title: "Eimo - Audros / ESO rezervo režimas 🔋"
                  message: >
                    Audros režimas — iškrovimas sustabdytas, baterija laikoma
                    namams kaip rezervas.
          # 2) SOC viršija tikslą — iškrauti perteklių į tinklą (21:00–07:30)
          - conditions:
              - condition: template
                value_template: "{{ current_soc > target_soc }}"
            sequence:
              - service: number.set_value
                target:
                  entity_id: number.inverter_control_1033300254190112_slot1_discharge_soc
                data:
                  value: "{{ target_soc }}"
              - service: number.set_value
                target:
                  entity_id: number.inverter_control_1033300254190112_slot1_discharge_current
                data:
                  value: "{{ discharge_current }}"
              - service: text.set_value
                target:
                  entity_id: text.inverter_control_1033300254190112_slot1_discharge_time
                data:
                  value: "{{ discharge_start }}-07:30"
              - service: switch.turn_on
                target:
                  entity_id: switch.inverter_control_1033300254190112_slot1_discharge
              - service: select.select_option
                target:
                  entity_id: select.inverter_control_1033300254190112_storage_mode
                data:
                  option: "Self-Use"
              - service: notify.persistent_notification
                data:
                  title: "Eimo - Naktinis iškrovimas 🔋→⚡"
                  message: >
                    Rytojaus prognozė: {{ forecast_tomorrow }} kWh.
                    Iškraunam: SOC {{ current_soc }}% → {{ target_soc }}%.
                    Slot1 {{ discharge_start }}–07:30 (pabaiga taikoma į
                    saulėtekį), srovė {{ discharge_current }}A, cut-off {{ target_soc }}%.
        # 3) SOC jau ≤ tikslo — iškrauti nereikia, baterija lieka namams
        default:
          - service: switch.turn_off
            target:
              entity_id: switch.inverter_control_1033300254190112_slot1_discharge
          - service: select.select_option
            target:
              entity_id: select.inverter_control_1033300254190112_storage_mode
            data:
              option: "Self-Use"
          - service: notify.persistent_notification
            data:
              title: "Eimo - Iškrovimas nereikalingas 🔋"
              message: >
                Rytojaus prognozė: {{ forecast_tomorrow }} kWh.
                Tikslinis SOC {{ target_soc }}% ≥ esamo {{ current_soc }}%.
                Baterija paliekama namams.
    mode: single

  # ───────────────────────────────────────────────────────────────────────
  #  TOU perskaičiavimas kas 5 min (20:05–07:00). Cloud rate-limit apsauga:
  #  rašom į slot SOC TIK kai reikšmė pasikeitė. Pasiekus tikslą — slotas off.
  # ───────────────────────────────────────────────────────────────────────
  - id: solis_tou_recalc_eimo
    alias: "Eimo - TOU: tikslinio SOC perskaičiavimas kas 5 min"
    description: >
      Vakare/naktį perskaičiuoja cloud slot1 iškrovimo cut-off SOC pagal naujausią
      energy_manager_eimo tikslą. Rašo tik kai pasikeitė (cloud API tausojimas).
      Pasiekus tikslą — išjungia slot1 iškrovimą.
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      # 20:05–07:00, kad nesikirstų su dienos iškrovimu (07:00–19:30), kuris
      # naudoja kitą cut-off (floor), ir nesilenktyniautų su vakaro automatika
      # (20:00). Naktinį slotą valdo TIK šis recalc.
      - condition: time
        after: "20:05:00"
        before: "07:00:00"
      - condition: state
        entity_id: input_boolean.storm_mode_eimo
        state: "off"
      # Veikiam tik kai iškrovimo slotas įjungtas
      - condition: state
        entity_id: switch.inverter_control_1033300254190112_slot1_discharge
        state: "on"
    variables:
      target_soc: "{{ [states('sensor.energy_manager_eimo_target_soc') | float(100) | round(0) | int, 6] | max }}"
      current_soc: "{{ states('sensor.solis_inverter_1033300254190112_solis_remaining_battery_capacity') | float(100) }}"
      slot_soc: "{{ states('number.inverter_control_1033300254190112_slot1_discharge_soc') | float(-1) | round(0) | int }}"
    action:
      - choose:
          # Pasiektas tikslas — išjungti iškrovimą, baterija namams
          - conditions:
              - condition: template
                value_template: "{{ current_soc <= target_soc }}"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.inverter_control_1033300254190112_slot1_discharge
              # Po iškrovos lieka Self-Use: tik šis režimas (su slotu) realiai
              # iškrauna bateriją į tinklą. Feed-In Priority baterijos neiškrauna
              # (eksportuoja tik PV perteklių) — todėl jo nebenaudojam.
              - variables:
                  forecast_tomorrow: >-
                    {{ (states('sensor.solcast_pv_forecast_forecast_tomorrow') | float(0)
                        * states('sensor.solcast_correction_factor_eimo') | float(1)) | round(1) }}
                  next_mode: "Self-Use"
              - service: select.select_option
                target:
                  entity_id: select.inverter_control_1033300254190112_storage_mode
                data:
                  option: "{{ next_mode }}"
              - service: notify.persistent_notification
                data:
                  title: "Eimo - TOU išjungtas: SOC tikslas pasiektas 🔋"
                  message: >
                    Baterija {{ current_soc }}% ≤ tikslo {{ target_soc }}%.
                    Rytojaus prognozė: {{ forecast_tomorrow }} kWh →
                    iškrovimas išjungtas, režimas: {{ next_mode }}.
          # Tikslas pasikeitė — atnaujinti cut-off SOC (tik kai skiriasi)
          - conditions:
              - condition: template
                value_template: "{{ slot_soc != target_soc }}"
            sequence:
              - service: number.set_value
                target:
                  entity_id: number.inverter_control_1033300254190112_slot1_discharge_soc
                data:
                  value: "{{ target_soc }}"
    mode: single

  # ───────────────────────────────────────────────────────────────────────
  #  Dienos iškrovimas į tinklą (Self-Use + slot1), langas 07:00–19:30.
  #  SVARBU: tik Self-Use + slotas realiai iškrauna bateriją į tinklą;
  #  Feed-In Priority baterijos NEIŠKRAUNA (tik prikrauna ją ir eksportuoja
  #  PV likutį) — todėl jo nebenaudojam. SĄLYGINIS (2026-07-08, audito 07-07
  #  radinys — anksčiau besąlygiškas laikė bateriją prie dugno ir ignoravo
  #  target_soc): iškraunama tik kai energy_manager_eimo_surplus rodo, kad
  #  likusi dienos saulė netilps (histerezė: ON > 1 kWh, OFF < 0.2 kWh —
  #  tarpas saugo cloud API nuo debesų mirgėjimo). Be pertekliaus slotas
  #  išjungiamas ir baterija kaupia PV link target_soc. Cut-off = floor
  #  (dugnas), 150A. Stabdo cloud cut-off SOC (floor) + HW over-discharge
  #  (5%). Langas iki 19:30, kad nesikirstų su naktiniu solis_tou_recalc_eimo
  #  (20:05–07:00).
  # ───────────────────────────────────────────────────────────────────────
  - id: solis_daytime_discharge_eimo
    alias: "Eimo - Dienos iškrovimas į tinklą (Self-Use + slot, pagal perteklių)"
    trigger:
      - platform: time_pattern
        minutes: "/15"
    condition:
      - condition: time
        after: "07:00:00"
        before: "19:30:00"
      - condition: state
        entity_id: input_boolean.storm_mode_eimo
        state: "off"
    variables:
      floor: "{{ [states('input_number.daytime_export_floor_eimo') | float(6) | round(0) | int, 6] | max }}"
      # 2026-07-14: REALIZAVIMO kriterijus (AppDaemon room_shortfall — likusi
      # saulė vs vieta + namai + 1 kW eksportas, su marža) vietoj
      # energy_manager_eimo_surplus (be vartojimo/eksporto narių — armuodavo
      # iškrovimą, kai vietos ir taip užtenka).
      surplus: "{{ states('sensor.energy_manager_eimo_room_shortfall') | float(0) }}"
      soc: "{{ states('sensor.solis_inverter_1033300254190112_solis_remaining_battery_capacity') | float(0) }}"
      # Reali sloto būsena (jungiklis + langas + režimas), ne vien jungiklis:
      # jei naktinė iškrova nesibaigė iki 07:00, slotas lieka ON su nakties
      # langu (21:00–07:30) ir vien „slotas on/off" klaidintų abi šakas.
      daytime_slot_active: >-
        {{ is_state('switch.inverter_control_1033300254190112_slot1_discharge', 'on')
           and is_state('text.inverter_control_1033300254190112_slot1_discharge_time', '07:00-19:30')
           and is_state('select.inverter_control_1033300254190112_storage_mode', 'Self-Use') }}
      # Dabartinis sloto cut-off: ≥90 = „viršūnės skutimo" variantas
      # (7 punktas), <90 = pertekliaus (floor) variantas.
      slot_cutoff: "{{ states('number.inverter_control_1033300254190112_slot1_discharge_soc') | float(0) }}"
    action:
      - choose:
          # 1) Yra perteklius (>1 kWh netilps) ir yra ką atiduoti — įjungti
          #    dienos iškrovimą, jei dar nesukonfigūruotas (cloud
          #    neperrašinėjam kas 15 min). Gali perimti viršūnės skutimo
          #    slotą (slot_cutoff >= 90). Re-arm slenkstis floor+5
          #    (7 punktas): nuo dugno pirma pakylama ~5 pp iš saulės.
          - conditions:
              - condition: template
                value_template: >
                  {{ surplus > 1 and soc >= floor + 5
                     and (not daytime_slot_active or slot_cutoff >= 90) }}
            sequence:
              - service: number.set_value
                target:
                  entity_id: number.inverter_control_1033300254190112_slot1_discharge_soc
                data:
                  value: "{{ floor }}"
              - service: number.set_value
                target:
                  entity_id: number.inverter_control_1033300254190112_slot1_discharge_current
                data:
                  value: 150
              - service: text.set_value
                target:
                  entity_id: text.inverter_control_1033300254190112_slot1_discharge_time
                data:
                  value: "07:00-19:30"
              - service: switch.turn_on
                target:
                  entity_id: switch.inverter_control_1033300254190112_slot1_discharge
              - service: select.select_option
                target:
                  entity_id: select.inverter_control_1033300254190112_storage_mode
                data:
                  option: "Self-Use"
              - service: notify.persistent_notification
                data:
                  title: "Eimo - Dienos iškrovimas į tinklą 🔋→⚡"
                  message: >
                    Vietos trūkumas saulei: {{ surplus }} kWh netilps
                    (baterija + namai + 1 kW eksportas). Baterija {{ soc }}%.
                    Self-Use + slot: iškraunama į tinklą
                    iki ~{{ floor }}% (slot 07:00–19:30, 150A).
          # 2) VIRŠŪNĖS SKUTIMAS (7 punktas, 2026-07-18): SOC ≥ 91% — laikyti
          #    slotą aktyvų su cut-off 90, net jei pertekliaus kriterijus jo
          #    neplanavo. Mažina laiką ties 100% ir sugeria debesų
          #    susitelkimų svyravimus.
          - conditions:
              - condition: template
                value_template: >
                  {{ soc >= 91 and not daytime_slot_active }}
            sequence:
              - service: number.set_value
                target:
                  entity_id: number.inverter_control_1033300254190112_slot1_discharge_soc
                data:
                  value: 90
              - service: number.set_value
                target:
                  entity_id: number.inverter_control_1033300254190112_slot1_discharge_current
                data:
                  value: 150
              - service: text.set_value
                target:
                  entity_id: text.inverter_control_1033300254190112_slot1_discharge_time
                data:
                  value: "07:00-19:30"
              - service: switch.turn_on
                target:
                  entity_id: switch.inverter_control_1033300254190112_slot1_discharge
              - service: select.select_option
                target:
                  entity_id: select.inverter_control_1033300254190112_storage_mode
                data:
                  option: "Self-Use"
              - service: notify.persistent_notification
                data:
                  title: "Eimo - Viršūnės skutimas 90–100% ✂️🔋"
                  message: >
                    Baterija {{ soc }}% — slotas aktyvuotas su cut-off 90%:
                    viršum 90% laikomas kiekis skutamas į tinklą.
          # 3) DUGNO ATSISTATYMAS (7 punktas): floor variantas pasiekė dugną
          #    — išjungti slotą, kad saulė pirma pakeltų SOC ~5 pp (re-arm
          #    šakoje 1 reikalauja floor+5); tik tada vėl eksportas.
          - conditions:
              - condition: template
                value_template: >
                  {{ daytime_slot_active and slot_cutoff < 90 and soc <= floor }}
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.inverter_control_1033300254190112_slot1_discharge
              - service: notify.persistent_notification
                data:
                  title: "Eimo - Dugnas pasiektas, kaupiam 🔋"
                  message: >
                    Baterija {{ soc }}% ties dugnu {{ floor }}%. Slotas
                    išjungtas — saulė pirma pakels iki {{ floor + 5 }}%,
                    tada iškrovimas atsinaujins.
          # 4) Pertekliaus nebėra (<0.2 kWh) — išjungti floor slotą, baterija
          #    kaupia PV link target_soc. Viršūnės skutimo varianto
          #    (cut-off 90) NELIEČIA. Vakare 20:00 logika perima kaip įprasta.
          - conditions:
              - condition: template
                value_template: >
                  {{ surplus < 0.2 and daytime_slot_active and slot_cutoff < 90 }}
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.inverter_control_1033300254190112_slot1_discharge
              - service: notify.persistent_notification
                data:
                  title: "Eimo - Dienos iškrovimas sustabdytas 🔋"
                  message: >
                    Vietos trūkumo nebėra ({{ surplus }} kWh) — likusi saulė
                    tilps. Baterija {{ soc }}% kaupia link
                    {{ states('sensor.energy_manager_eimo_target_soc') }}% tikslo.
    mode: single

  # ───────────────────────────────────────────────────────────────────────
  #  Audros/ESO režimo perjungimas — momentinis pritaikymas (kaip 1-os
  #  elektrinės solis_storm_mode_toggle). Be šio, storm_mode_eimo įsigaliodavo
  #  tik 20:00 (vakaro automatika), o dienos iškrovimo slotas likdavo aktyvus.
  #  Įjungus: iškrovimas STOP, krovimo slotas visai parai (tik saulė —
  #  allow_grid_charging paliekamas off), Self-Use. Išjungus: krovimo slotas
  #  off; dienos iškrovimą per ≤15 min atstato solis_daytime_discharge_eimo,
  #  naktinį — 20:00 vakaro automatika.
  # ───────────────────────────────────────────────────────────────────────
  - id: solis_storm_mode_toggle_eimo
    alias: "Eimo - Audros/ESO režimo perjungimas (greitas pritaikymas)"
    trigger:
      - platform: state
        entity_id: input_boolean.storm_mode_eimo
    condition: []
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.storm_mode_eimo
                state: "on"
            sequence:
              # Jokio iškrovimo į tinklą
              - service: switch.turn_off
                target:
                  entity_id: switch.inverter_control_1033300254190112_slot1_discharge
              # Iš tinklo NEkrauti — tik saulė
              - service: switch.turn_off
                target:
                  entity_id: switch.inverter_control_1033300254190112_allow_grid_charging
              # Krovimo slotas visai parai iki 100%
              - service: text.set_value
                target:
                  entity_id: text.inverter_control_1033300254190112_slot1_charge_time
                data:
                  value: "00:00-23:59"
              - service: number.set_value
                target:
                  entity_id: number.inverter_control_1033300254190112_slot1_charge_soc
                data:
                  value: 100
              - service: number.set_value
                target:
                  entity_id: number.inverter_control_1033300254190112_slot1_charge_current
                data:
                  value: 150
              - service: switch.turn_on
                target:
                  entity_id: switch.inverter_control_1033300254190112_slot1_charge
              - service: select.select_option
                target:
                  entity_id: select.inverter_control_1033300254190112_storage_mode
                data:
                  option: "Self-Use"
              - service: notify.persistent_notification
                data:
                  title: "Eimo - Audros / ESO rezervo režimas įjungtas ⚡🔋"
                  message: >
                    Visa saulė kraunama į bateriją (slot1 charge 00:00–23:59,
                    cut-off 100%), iškrovimas į tinklą sustabdytas.
                    Baterija: {{ states('sensor.solis_inverter_1033300254190112_solis_remaining_battery_capacity') }}%.
        default:
          - service: switch.turn_off
            target:
              entity_id: switch.inverter_control_1033300254190112_slot1_charge
          - service: text.set_value
            target:
              entity_id: text.inverter_control_1033300254190112_slot1_charge_time
            data:
              value: "00:00-00:00"
          - service: select.select_option
            target:
              entity_id: select.inverter_control_1033300254190112_storage_mode
            data:
              option: "Self-Use"
          - service: notify.persistent_notification
            data:
              title: "Eimo - Audros / ESO rezervo režimas išjungtas ✅"
              message: >
                Krovimo slotas išjungtas. Dienos iškrovimą per ≤15 min atstatys
                automatika, naktinį — 20:00 vakaro logika.
    mode: single

  # ───────────────────────────────────────────────────────────────────────
  #  Solcast „vakar prognozė" snapshot 23:55 (Eimo).
  # ───────────────────────────────────────────────────────────────────────
  - id: solis_snapshot_daily_forecast_eimo
    alias: "Eimo - Įsiminti dienos prognozę (vakar prognozė)"
    trigger:
      - platform: time
        at: "23:55:00"
    condition:
      - condition: template
        value_template: >
          {{ states('sensor.solcast_pv_forecast_forecast_today')
             not in ['unavailable', 'unknown', 'none', ''] }}
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.solcast_forecast_yesterday_eimo
        data:
          value: "{{ states('sensor.solcast_pv_forecast_forecast_today') | float(0) | round(1) }}"
    mode: single
