input_boolean:
  storm_mode_eimo:
    name: 'Eimo: Audros / ESO režimas'
    icon: mdi:weather-lightning
input_select:
  energy_season_eimo:
    name: 'Eimo: Sezonas'
    options:
    - žiema
    - pavasaris
    - vasara
    - ruduo
    initial: vasara
    icon: mdi:weather-sunny
input_number:
  solcast_forecast_yesterday_eimo:
    name: 'Eimo: Vakar prognozuota gamyba'
    min: 0
    max: 200
    step: 0.1
    unit_of_measurement: kWh
    icon: mdi:weather-partly-cloudy
    mode: box
  electricity_price_buy_eimo:
    name: 'Eimo: Elektros pirkimo kaina'
    min: 0
    max: 1
    step: 0.001
    unit_of_measurement: €/kWh
    icon: mdi:transmission-tower-import
    mode: box
  electricity_price_sell_eimo:
    name: 'Eimo: Elektros pardavimo kaina'
    min: 0
    max: 1
    step: 0.001
    unit_of_measurement: €/kWh
    icon: mdi:transmission-tower-export
    mode: box
  daytime_export_floor_eimo:
    name: 'Eimo: Dienos eksporto apatinė riba'
    min: 6
    max: 50
    step: 1
    initial: 6
    unit_of_measurement: '%'
    icon: mdi:battery-arrow-down
    mode: box
sensor:
- platform: integration
  source: sensor.solis_inverter_1033300254190112_solis_total_consumption_power
  name: eimo_house_energy
  unique_id: eimo_house_energy
  unit_prefix: k
  round: 3
  method: left
utility_meter:
  eimo_consumption_today:
    name: 'Eimo: namų suvartojimas šiandien'
    source: sensor.eimo_house_energy
    cycle: daily
template:
- sensor:
  - name: eimo_consumption_yesterday
    unique_id: eimo_consumption_yesterday
    unit_of_measurement: kWh
    icon: mdi:home-lightning-bolt
    state: '{{ state_attr(''sensor.eimo_namu_suvartojimas_siandien'', ''last_period'') | float(0) | round(2)
      }}

      '
    availability: '{{ state_attr(''sensor.eimo_namu_suvartojimas_siandien'', ''last_period'') is not none
      }}

      '
  - name: solcast_intraday_ratio_eimo
    unique_id: solcast_intraday_ratio_eimo
    state_class: measurement
    icon: mdi:sun-clock
    state: "{% set corr = states('sensor.solcast_correction_factor_eimo') | float(1) %} {% set total =\
      \ states('sensor.solcast_pv_forecast_forecast_today') | float(0) %} {% set remaining = states('sensor.solcast_pv_forecast_forecast_remaining_today')\
      \ | float(0) %} {% set expected = [total - remaining, 0] | max * corr %} {% set actual = states('sensor.solis_inverter_1033300254190112_solis_energy_today')\
      \ | float(0) %} {% if expected < 1.5 %}\n  1.0\n{% else %}\n  {{ [[actual / expected, 0.5] | max,\
      \ 1.8] | min | round(3) }}\n{% endif %}\n"
    availability: "{{ states('sensor.solcast_pv_forecast_forecast_today') not in ['unavailable', 'unknown',\
      \ '']\n   and states('sensor.solcast_pv_forecast_forecast_remaining_today') not in ['unavailable',\
      \ 'unknown', '']\n   and states('sensor.solis_inverter_1033300254190112_solis_energy_today') not\
      \ in ['unavailable', 'unknown', ''] }}\n"
    attributes:
      faktas_kwh: '{{ states(''sensor.solis_inverter_1033300254190112_solis_energy_today'') | float(0)
        | round(2) }}

        '
      tiketasi_iki_dabar_kwh: '{% set total = states(''sensor.solcast_pv_forecast_forecast_today'') |
        float(0) %} {% set remaining = states(''sensor.solcast_pv_forecast_forecast_remaining_today'')
        | float(0) %} {{ ([total - remaining, 0] | max * states(''sensor.solcast_correction_factor_eimo'')
        | float(1)) | round(2) }}

        '
  - name: solar_today_expected_eimo
    unique_id: solar_today_expected_eimo
    unit_of_measurement: kWh
    state_class: measurement
    icon: mdi:chart-bell-curve-cumulative
    state: "{% set a = states('sensor.solis_inverter_1033300254190112_solis_energy_today') | float(0)\
      \ %} {% set r = states('sensor.solcast_pv_forecast_forecast_remaining_today') | float(0)\n     \
      \      * states('sensor.solcast_correction_factor_eimo') | float(1)\n           * states('sensor.solcast_intraday_ratio_eimo')\
      \ | float(1) %}\n{{ (a + r) | round(1) }}\n"
    availability: "{{ states('sensor.solis_inverter_1033300254190112_solis_energy_today') not in ['unavailable',\
      \ 'unknown', '']\n   and states('sensor.solcast_pv_forecast_forecast_remaining_today') not in ['unavailable',\
      \ 'unknown', ''] }}\n"
    attributes:
      pagaminta_kwh: '{{ states(''sensor.solis_inverter_1033300254190112_solis_energy_today'') | float(0)
        | round(2) }}

        '
      liko_koreguota_kwh: "{{ (states('sensor.solcast_pv_forecast_forecast_remaining_today') | float(0)\n\
        \    * states('sensor.solcast_correction_factor_eimo') | float(1)\n    * states('sensor.solcast_intraday_ratio_eimo')\
        \ | float(1)) | round(2) }}\n"
  - name: self_sufficiency_today_eimo
    unique_id: self_sufficiency_today_eimo
    unit_of_measurement: '%'
    state_class: measurement
    icon: mdi:home-percent
    state: '{% set cons = states(''sensor.solis_inverter_1033300254190112_solis_daily_grid_energy_used'')
      | float(0) %} {% set imp  = states(''sensor.solis_inverter_1033300254190112_solis_daily_grid_energy_purchased'')
      | float(0) %} {{ ([(1 - imp / cons) * 100, 0] | max) | round(0) if cons > 0.1 else 0 }}

      '
    availability: '{{ states(''sensor.solis_inverter_1033300254190112_solis_daily_grid_energy_used'')
      not in [''unavailable'', ''unknown'', ''''] }}

      '
  - name: energy_savings_today_eimo
    unique_id: energy_savings_today_eimo
    unit_of_measurement: €
    state_class: measurement
    icon: mdi:piggy-bank
    state: '{% set pv   = states(''sensor.solis_inverter_1033300254190112_solis_energy_today'') | float(0)
      %} {% set sell = states(''sensor.solis_inverter_1033300254190112_solis_daily_on_grid_energy'') |
      float(0) %} {% set buy  = states(''sensor.solis_inverter_1033300254190112_solis_daily_grid_energy_purchased'')
      | float(0) %} {% set p_buy  = states(''input_number.electricity_price_buy_eimo'') | float(0.18)
      %} {% set p_sell = states(''input_number.electricity_price_sell_eimo'') | float(0.08) %} {{ (([pv
      - sell, 0] | max) * p_buy + sell * p_sell - buy * p_buy) | round(2) }}

      '
    availability: '{{ states(''sensor.solis_inverter_1033300254190112_solis_energy_today'') not in [''unavailable'',
      ''unknown'', ''''] }}

      '
  - name: battery_roundtrip_efficiency_eimo
    unique_id: battery_roundtrip_efficiency_eimo
    unit_of_measurement: '%'
    state_class: measurement
    icon: mdi:battery-sync
    state: '{% set chg = states(''sensor.solis_inverter_1033300254190112_solis_total_energy_charged'')
      | float(0) %} {% set dis = states(''sensor.solis_inverter_1033300254190112_solis_total_energy_discharged'')
      | float(0) %} {% set stored = states(''sensor.solis_inverter_1033300254190112_solis_remaining_battery_capacity'')
      | float(0) / 100 * 14.336 %} {% set denom = chg - stored %} {{ (dis / denom * 100) | round(1) if
      denom > 50 else ''unknown'' }}

      '
    availability: '{{ states(''sensor.solis_inverter_1033300254190112_solis_total_energy_charged'') not
      in [''unavailable'', ''unknown'', ''''] }}

      '
  - name: battery_equivalent_cycles_eimo
    unique_id: battery_equivalent_cycles_eimo
    state_class: total_increasing
    icon: mdi:battery-sync
    state: '{{ (states(''sensor.solis_inverter_1033300254190112_solis_total_energy_charged'') | float(0)
      / 13.619) | round(1) }}

      '
    availability: '{{ states(''sensor.solis_inverter_1033300254190112_solis_total_energy_charged'') not
      in [''unavailable'', ''unknown'', ''''] }}

      '
    attributes:
      ikrauta_kwh: '{{ states(''sensor.solis_inverter_1033300254190112_solis_total_energy_charged'') |
        float(0) | round(0) }}'
      dienos_nuo_pajungimo: '{{ ((as_timestamp(now()) - as_timestamp(''2026-02-01 12:00:00+02:00'')) /
        86400) | round(0) }}'
      ciklai_per_diena: '{% set d = (as_timestamp(now()) - as_timestamp(''2026-02-01 12:00:00+02:00''))
        / 86400 %} {{ ((states(''sensor.solis_inverter_1033300254190112_solis_total_energy_charged'')
        | float(0) / 13.619) / d) | round(2) if d > 1 else ''unknown'' }}'
      prognoze_ciklu_per_metus: '{% set d = (as_timestamp(now()) - as_timestamp(''2026-02-01 12:00:00+02:00''))
        / 86400 %} {{ ((states(''sensor.solis_inverter_1033300254190112_solis_total_energy_charged'')
        | float(0) / 13.619) / d * 365) | round(0) if d > 1 else ''unknown'' }}'
      metai_iki_6000_ciklu: '{% set d = (as_timestamp(now()) - as_timestamp(''2026-02-01 12:00:00+02:00''))
        / 86400 %} {% set per_metus = (states(''sensor.solis_inverter_1033300254190112_solis_total_energy_charged'')
        | float(0) / 13.619) / d * 365 if d > 1 else 0 %} {{ ((6000 - states(''sensor.solis_inverter_1033300254190112_solis_total_energy_charged'')
        | float(0) / 13.619) / per_metus) | round(0) if per_metus > 1 else ''unknown'' }}'
      bms_soh: '{{ states(''sensor.solis_inverter_1033300254190112_solis_battery_state_of_health'') }}'
  - name: energy_manager_eimo_surplus
    unique_id: energy_manager_eimo_surplus
    unit_of_measurement: kWh
    state_class: measurement
    icon: mdi:transmission-tower-export
    state: "{% set per = 0.1434 %} {% set pv_remaining = states('sensor.solcast_pv_forecast_forecast_remaining_today')\
      \ | float(0)\n                      * states('sensor.solcast_correction_factor_eimo') | float(1)\n\
      \                      * states('sensor.solcast_intraday_ratio_eimo') | float(1) %}\n{% set soc\
      \ = states('sensor.solis_inverter_1033300254190112_solis_remaining_battery_capacity') | float(100)\
      \ %} {% set battery_headroom = [(100 - soc) * per, 0] | max %} {{ [pv_remaining - battery_headroom,\
      \ 0] | max | round(1) }}\n"
    availability: "{{ states('sensor.solcast_pv_forecast_forecast_remaining_today') not in ['unavailable',\
      \ 'unknown', '']\n   and states('sensor.solis_inverter_1033300254190112_solis_remaining_battery_capacity')\
      \ not in ['unavailable', 'unknown', ''] }}\n"
    attributes:
      pv_remaining_kwh: "{{ (states('sensor.solcast_pv_forecast_forecast_remaining_today') | float(0)\n\
        \    * states('sensor.solcast_correction_factor_eimo') | float(1)\n    * states('sensor.solcast_intraday_ratio_eimo')\
        \ | float(1)) | round(2) }}\n"
      intraday_ratio: '{{ states(''sensor.solcast_intraday_ratio_eimo'') | float(1) }}

        '
      battery_headroom_kwh: '{% set soc = states(''sensor.solis_inverter_1033300254190112_solis_remaining_battery_capacity'')
        | float(100) %} {{ [(100 - soc) * 0.1434, 0] | max | round(2) }}

        '
      pardavimo_eta_h: "{% set per = 0.1434 %} {% set pv_remaining = states('sensor.solcast_pv_forecast_forecast_remaining_today')\
        \ | float(0)\n                      * states('sensor.solcast_correction_factor_eimo') | float(1)\n\
        \                      * states('sensor.solcast_intraday_ratio_eimo') | float(1) %}\n{% set soc\
        \ = states('sensor.solis_inverter_1033300254190112_solis_remaining_battery_capacity') | float(100)\
        \ %} {% set headroom = [(100 - soc) * per, 0] | max %} {{ ([pv_remaining - headroom, 0] | max\
        \ / 1.0) | round(1) }}\n"
  - name: Eimo PV galia
    unique_id: eimo_pv_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    icon: mdi:solar-power
    state: "{{ (states('sensor.solis_inverter_1033300254190112_solis_dc_power_pv1') | float(0)\n    +\
      \ states('sensor.solis_inverter_1033300254190112_solis_dc_power_pv2') | float(0)) | round(0) }}\n"
    availability: "{{ states('sensor.solis_inverter_1033300254190112_solis_dc_power_pv1')\n   not in ['unavailable',\
      \ 'unknown', 'none', ''] }}\n"
automation:
- id: solis_plan_apply_mode_eimo
  alias: Eimo - Atominio energijos plano vykdymas
  description: Bendro energijos plano vykdytojas; parametrai iš elektrinės profilio. solis_cloud
  use_blueprint:
    path: energy/solis_cloud_executor.yaml
    input:
      plan_entity: sensor.eimo_plan
      planner_entity: sensor.eimo_planner_health
      storm_entity: input_boolean.storm_mode_eimo
      hard_floor: 6
      planner_max_age: 180
      discharge_current: 150
      entry_id: 01KT7EWKQVY3ANB6EDBEZNK39H
      inverter_sn: '1033300254190112'
      heartbeat_entity: sensor.solis_inverter_1033300254190112_solis_timestamp_measurements_received
      soc_entity: sensor.solis_inverter_1033300254190112_solis_remaining_battery_capacity
      voltage_a: sensor.solis_inverter_1033300254190112_solis_meter_item_a_volt
      voltage_b: sensor.solis_inverter_1033300254190112_solis_meter_item_b_volt
      voltage_c: sensor.solis_inverter_1033300254190112_solis_meter_item_c_volt
      frequency_entity: sensor.solis_inverter_1033300254190112_solis_ac_frequency
      telemetry_max_age: 900
      charge_current: 150
- id: solis_snapshot_daily_forecast_eimo
  alias: Eimo - Įsiminti dienos prognozę (vakar prognozė)
  trigger:
  - platform: time
    at: '23:55:00'
  condition:
  - condition: template
    value_template: "{{ states('sensor.solcast_pv_forecast_forecast_today')\n   not in ['unavailable',\
      \ 'unknown', 'none', ''] }}\n"
  action:
  - service: input_number.set_value
    target:
      entity_id: input_number.solcast_forecast_yesterday_eimo
    data:
      value: '{{ states(''sensor.solcast_pv_forecast_forecast_today'') | float(0) | round(1) }}'
  mode: single
- id: eimo_solis_cloud_monitor
  alias: Eimo - Solis ryšio ir komandų priežiūra
  description: HA pranešimai apie ilgą ryšio sutrikimą ir nepatvirtintas komandas; inverteriui užklausų
    nesiunčia.
  triggers:
  - trigger: state
    entity_id: sensor.solis_inverter_1033300254190112_cloud_api_health
    to: write_rate_alert
    id: problem
  - trigger: state
    entity_id: sensor.solis_inverter_1033300254190112_cloud_api_health
    to:
    - backoff
    - stale_telemetry
    - worker_stopped
    - command_stalled
    - control_degraded
    - storage_error
    - unavailable
    for: 00:15:00
    id: problem
  - trigger: state
    entity_id: sensor.solis_inverter_1033300254190112_cloud_command_status
    to:
    - not_confirmed
    - storage_error
    - waiting_for_cloud
    - unsupported_profile
    - retry_wait
    - conflicting_targets
    for: 00:15:00
    id: problem
  - trigger: state
    entity_id: sensor.solis_inverter_1033300254190112_cloud_api_health
    to: healthy
    id: recovered
  - trigger: state
    entity_id: sensor.solis_inverter_1033300254190112_cloud_command_status
    to:
    - idle
    - ready
    id: recovered
  actions:
  - choose:
    - conditions: '{{ trigger.id == ''problem'' }}'
      sequence:
      - action: persistent_notification.create
        data:
          notification_id: eimo_solis_cloud_health
          title: Eimo - reikia patikrinti Solis ryšį
          message: 'Ryšys: {{ states(''sensor.solis_inverter_1033300254190112_cloud_api_health'') }}.
            Komanda: {{ states(''sensor.solis_inverter_1033300254190112_cloud_command_status'') }}. Tikrų
            įrašų per 5 min.: {{ state_attr(''sensor.solis_inverter_1033300254190112_cloud_api_health'',
            ''writes_last_5min'') }}. Kitas ryšio bandymas: {{ state_attr(''sensor.solis_inverter_1033300254190112_cloud_api_health'',
            ''next_retry'') }}. Patikrinkite Eimo valdymo skydelio ryšio diagnostiką.'
    - conditions: "{{ is_state('sensor.solis_inverter_1033300254190112_cloud_api_health', 'healthy')\n\
        \   and states('sensor.solis_inverter_1033300254190112_cloud_command_status') in ['idle', 'ready']\
        \ }}"
      sequence:
      - action: persistent_notification.dismiss
        data:
          notification_id: eimo_solis_cloud_health
  mode: single
