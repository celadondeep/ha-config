# =============================================================================
#  ESO pranešimai ir automatinis rezervo planavimas planuotiems atjungimams.
#
#  Duomenų šaltinis: custom_components/eso — kasdienio importo metu nuskaito
#  savitarnos /messages dėžutę, naujiems pranešimams kelia eso_new_message
#  įvykį (tipas: planuojamas_atjungimas / atjungimas_baigtas / kita; jei
#  tekste rastas langas — atjungimas_nuo/atjungimas_iki "YYYY-MM-DD HH:MM").
#  Pirmas paleidimas tik užsėja matytų sąrašą (eso_seen_messages.json) — be
#  įvykių, kad istorija nesuplanuotų praėjusių atjungimų.
#
#  Grandinė:
#   1. eso_naujas_pranesimas — kiekvienam naujam pranešimui HA notification;
#      planuojamo atjungimo atveju užpildo input_datetime langus ir įjungia
#      eso_rezervo_planas (tik jei atjungimas ateityje).
#   2. eso_rezervo_ijungimas — likus ≤14 val. iki atjungimo įjungia
#      input_boolean.storm_mode (Šeškinių elektrinė; atjungimo pranešimai —
#      šio įvado). storm_mode toliau tvarko solis_storm_mode_toggle: eksportas
#      stop, visa saulė į bateriją, naktinis iškrovimas neliečia rezervo.
#   3. eso_rezervo_isjungimas — atjungimui pasibaigus (+30 min) išjungia
#      storm_mode ir planą. Jei storm_mode buvo įjungtas rankomis be plano —
#      automatika jo neliečia (sąlyga: planas turi būti on).
# =============================================================================

input_boolean:
  eso_rezervo_planas:
    name: "ESO atjungimo rezervo planas"
    icon: mdi:calendar-alert

input_datetime:
  eso_atjungimas_nuo:
    name: "ESO atjungimas nuo"
    has_date: true
    has_time: true
    icon: mdi:transmission-tower-off
  eso_atjungimas_iki:
    name: "ESO atjungimas iki"
    has_date: true
    has_time: true
    icon: mdi:transmission-tower

automation:
  # PIRMINIS atjungimų šaltinis (2026-07-18, vartotojo pageidavimas):
  # savitarnos dashboardo blokas „Planuojami elektros atjungimai" —
  # integracija jį tikrina per kasdienį importą ir naujam langui kelia
  # eso_planned_outage įvykį. Pranešimų tekstų kelias (žemiau) lieka
  # atsarginis — abu nustato tą patį langą, konflikto nėra.
  - id: eso_atjungimas_is_dashboardo
    alias: "ESO - Planuojamas atjungimas (dashboardo blokas)"
    trigger:
      - platform: event
        event_type: eso_planned_outage
    condition:
      - condition: template
        value_template: >
          {{ as_timestamp(trigger.event.data.atjungimas_nuo ~ ':00', 0)
             > as_timestamp(now()) }}
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.eso_atjungimas_nuo
        data:
          datetime: "{{ trigger.event.data.atjungimas_nuo }}:00"
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.eso_atjungimas_iki
        data:
          datetime: "{{ trigger.event.data.atjungimas_iki }}:00"
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.eso_rezervo_planas
      - service: notify.persistent_notification
        data:
          title: "ESO atjungimas suplanuotas (dashboardas) — rezervas paruoštas 📅⚡"
          message: >
            Savitarnos dashboarde rastas planuojamas atjungimas
            {{ trigger.event.data.atjungimas_nuo }} –
            {{ trigger.event.data.atjungimas_iki }}.
            Rezervo režimas įsijungs automatiškai likus ~14 val. —
            atjungimo dienai baterija bus kaupiama pilna.
    mode: queued
    max: 5

  - id: eso_naujas_pranesimas
    alias: "ESO - Naujas savitarnos pranešimas"
    description: >
      Kiekvienam eso_new_message įvykiui — persistent notification.
      Planuojamo atjungimo su rastu laiko langu atveju papildomai užpildo
      atjungimo input_datetime ir įjungia rezervo planą (tik ateities datai).
    trigger:
      - platform: event
        event_type: eso_new_message
    action:
      - service: notify.persistent_notification
        data:
          title: "ESO pranešimas: {{ trigger.event.data.tema }}"
          message: >
            {{ trigger.event.data.data }} —
            {{ trigger.event.data.tekstas[:600] }}
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ trigger.event.data.tipas == 'planuojamas_atjungimas'
                     and trigger.event.data.atjungimas_nuo is defined
                     and as_timestamp(trigger.event.data.atjungimas_nuo, 0) > as_timestamp(now()) }}
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.eso_atjungimas_nuo
                data:
                  datetime: "{{ trigger.event.data.atjungimas_nuo }}:00"
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.eso_atjungimas_iki
                data:
                  datetime: "{{ trigger.event.data.atjungimas_iki }}:00"
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.eso_rezervo_planas
              - service: notify.persistent_notification
                data:
                  title: "ESO atjungimas suplanuotas — rezervas paruoštas 📅⚡"
                  message: >
                    Planuojamas atjungimas
                    {{ trigger.event.data.atjungimas_nuo }} –
                    {{ trigger.event.data.atjungimas_iki }}.
                    Audros/rezervo režimas įsijungs automatiškai likus ~14 val.
                    (baterija bus kaupiama rezervui, eksportas sustabdytas).
    mode: queued
    max: 10

  - id: eso_rezervo_ijungimas
    alias: "ESO - Rezervo režimo įjungimas prieš atjungimą"
    description: >
      Likus ≤14 val. iki suplanuoto atjungimo įjungia storm_mode (Šeškiniai):
      naktinis iškrovimas praleidžiamas, rytinė saulė kaupiama į bateriją,
      namai iš tinklo — atjungimo momentu baterija maksimaliai pilna.
    trigger:
      - platform: time_pattern
        minutes: "/30"
    condition:
      - condition: state
        entity_id: input_boolean.eso_rezervo_planas
        state: "on"
      - condition: state
        entity_id: input_boolean.storm_mode
        state: "off"
      - condition: template
        value_template: >
          {% set nuo = state_attr('input_datetime.eso_atjungimas_nuo', 'timestamp') %}
          {{ nuo is not none and 0 < (nuo - as_timestamp(now())) <= 14 * 3600 }}
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.storm_mode
      - service: notify.persistent_notification
        data:
          title: "ESO atjungimas artėja — rezervo režimas įjungtas 🔋⚡"
          message: >
            Atjungimas {{ states('input_datetime.eso_atjungimas_nuo') }} –
            {{ states('input_datetime.eso_atjungimas_iki') }}.
            Baterija kaupiama rezervui, eksportas sustabdytas.
    mode: single

  - id: eso_rezervo_isjungimas
    alias: "ESO - Rezervo režimo išjungimas po atjungimo"
    description: >
      Atjungimo langui pasibaigus (+30 min atsarga) išjungia storm_mode ir
      rezervo planą — sistema grįžta į normalų realizavimo režimą.
    trigger:
      - platform: time_pattern
        minutes: "/30"
    condition:
      - condition: state
        entity_id: input_boolean.eso_rezervo_planas
        state: "on"
      - condition: template
        value_template: >
          {% set iki = state_attr('input_datetime.eso_atjungimas_iki', 'timestamp') %}
          {{ iki is not none and as_timestamp(now()) > iki + 1800 }}
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.eso_rezervo_planas
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.storm_mode
      - service: notify.persistent_notification
        data:
          title: "ESO atjungimas baigėsi — grįžtama į normalų režimą ✅"
          message: >
            Atjungimo langas ({{ states('input_datetime.eso_atjungimas_iki') }})
            praėjo. Rezervo režimas išjungtas, realizavimas tęsiasi.
    mode: single
