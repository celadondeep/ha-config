<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistemos dokumentacija</title>
<script src="/local/docs/marked.min.js"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #212121; --muted: #757575; --card: #fff;
    --accent: #ff9800; --border: #e0e0e0; --code: #f0f0f0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --fg: #e0e0e0; --muted: #9e9e9e; --card: #1c1c1c;
            --accent: #ffb74d; --border: #333; --code: #262626; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Roboto, system-ui, sans-serif;
         background: var(--bg); color: var(--fg); display: flex; min-height: 100vh; }
  nav { width: 220px; flex-shrink: 0; padding: 16px 8px; border-right: 1px solid var(--border); }
  nav button { display: block; width: 100%; text-align: left; padding: 10px 12px;
               margin: 2px 0; border: none; border-radius: 8px; background: none;
               color: var(--fg); font-size: 14px; cursor: pointer; }
  nav button:hover { background: var(--code); }
  nav button.active { background: var(--accent); color: #000; font-weight: 500; }
  main { flex: 1; padding: 24px 32px; max-width: 900px; overflow-x: hidden; }
  main h1, main h2 { border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  main a { color: var(--accent); }
  main table { border-collapse: collapse; width: 100%; margin: 12px 0; display: block; overflow-x: auto; }
  main th, main td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; font-size: 14px; }
  main code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  main pre { background: var(--code); padding: 12px; border-radius: 8px; overflow-x: auto; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  @media (max-width: 700px) {
    body { flex-direction: column; }
    nav { width: 100%; display: flex; flex-wrap: wrap; border-right: none;
          border-bottom: 1px solid var(--border); }
    nav button { width: auto; }
  }
</style>
</head>
<body>
<nav id="nav"></nav>
<main>
  <div class="meta" id="meta"></div>
  <div id="content">Kraunama…</div>
</main>
<script>
const FILES = [
  ["README.md", "Indeksas"],
  ["architektura.md", "Architektūra"],
  ["taisykles.md", "Taisyklės"],
  ["valdymo_logika.md", "Valdymo logika"],
  ["eso.md", "ESO"],
  ["prognozes.md", "Prognozės"],
  ["zurnalas.md", "Žurnalas"],
];
const nav = document.getElementById("nav");
FILES.forEach(([f, label]) => {
  const b = document.createElement("button");
  b.textContent = label;
  b.onclick = () => load(f, b);
  nav.appendChild(b);
});
async function load(file, btn) {
  document.querySelectorAll("nav button").forEach(x => x.classList.remove("active"));
  if (btn) btn.classList.add("active");
  const r = await fetch("/local/docs/md/" + file + "?t=" + Date.now());
  if (!r.ok) {
    document.getElementById("content").textContent = "Nepavyko užkrauti: " + file + " (" + r.status + ")";
    return;
  }
  const md = await r.text();
  document.getElementById("meta").textContent = "docs/" + file + " · atnaujinta: " + (r.headers.get("last-modified") || "—");
  // Vidines .md nuorodas paversti į peržiūros perjungimą
  const html = marked.parse(md);
  const div = document.getElementById("content");
  div.innerHTML = html;
  div.querySelectorAll("a[href$='.md']").forEach(a => {
    const target = a.getAttribute("href");
    a.onclick = (e) => {
      e.preventDefault();
      const idx = FILES.findIndex(([f]) => f === target);
      load(target, idx >= 0 ? nav.children[idx] : null);
    };
  });
  window.scrollTo(0, 0);
}
load("README.md", nav.children[0]);
</script>
</body>
</html>
