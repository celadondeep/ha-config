name: HA Control Validation

on:
  push:
    branches: [main]
    paths:
      - "custom_components/solis/**"
      - "tests/test_solis_confirmed_controls.py"
      - "scripts/**"
      - ".agents/skills/home-assistant-admin/**"
      - "plugins/home-assistant-admin/skills/home-assistant-admin/**"
      - "automations.yaml"
      - "packages/eimo.yaml"
      - "lovelace/eimo.yaml"
      - "claude/tests/valdymo_simuliacija.py"
      - "AGENTS.md"
      - ".github/workflows/ha-stage1-validation.yml"
  pull_request:
    paths:
      - "custom_components/solis/**"
      - "tests/test_solis_confirmed_controls.py"
      - "scripts/**"
      - ".agents/skills/home-assistant-admin/**"
      - "plugins/home-assistant-admin/skills/home-assistant-admin/**"
      - "automations.yaml"
      - "packages/eimo.yaml"
      - "lovelace/eimo.yaml"
      - "claude/tests/valdymo_simuliacija.py"
      - "AGENTS.md"
      - ".github/workflows/ha-stage1-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate unified Solis Python syntax
        run: |
          python3 -m compileall -q custom_components/solis
          python3 -m py_compile scripts/analyze_eimo_cloud_log.py

      - name: Validate deploy and diagnostic scripts
        run: |
          bash -n scripts/deploy_eimo_solis_stage1.sh
          bash -n scripts/check_eimo_solis_stage1.sh
          bash -n scripts/recover_control_plans.sh
          bash -n scripts/deploy_morning_100w.sh

      - name: Verify confirmed command sequencing and cloud recovery
        run: python3 -m unittest discover -s tests -p test_solis_confirmed_controls.py

      - name: Verify repo skill mirror
        run: |
          diff -ru \
            plugins/home-assistant-admin/skills/home-assistant-admin \
            .agents/skills/home-assistant-admin

      - name: Validate Home Assistant YAML syntax
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml
          for path in ("automations.yaml", "packages/eimo.yaml", "lovelace/eimo.yaml"):
              with open(path, "r", encoding="utf-8") as f:
                  yaml.safe_load(f)
              print(f"{path}: YAML OK")
          PY

      - name: Run control logic simulation
        run: python3 claude/tests/valdymo_simuliacija.py
