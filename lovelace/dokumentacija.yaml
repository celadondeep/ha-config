title: Dokumentacija
views:
  # Pilno ekrano peržiūra: /config/docs/*.md renderinami per
  # /local/docs/index.html (marked.js lokaliai, be CDN). Šaltinis —
  # /config/docs, www/docs/md yra symlink į jį (visada šviežia).
  - title: Docs
    path: docs
    panel: true
    cards:
      # ?v= — cache-busteris: keičiant index.html padidink versiją, kad
      # naršyklė užsikrautų naują peržiūros HTML (2026-07-22).
      - type: iframe
        url: /local/docs/index.html?v=20260722
        aspect_ratio: 100%
