title: Eimo SE
views:
  # Išdėstymo logika (2026-07-12 kompaktinė pertvarka): DVI kolonos be
  # tarpinių sekcijų — trečia sekcija sukurdavo naują eilutę žemiau
  # aukštesnės kolonos ir palikdavo tuščią tarpą. Dabar:
  # 1) KAIRĖ — galios srautai, SOC vs tikslas, balansas/sprendimas,
  #    naktinis planas, šiandienos rezultatai,
  # 2) DEŠINĖ — audros tile, nustatymai/kainos, Slot1 registrai, būsena,
  #    Solcast prognozė ir korekcijos,
  # 3) GRAFIKAI — per visą plotį.
  # Atskirų heading kortelių nėra (kortelių title pakanka) — taupo vietą.
  # Stilius sąmoningai identiškas energijos_valdymas.yaml (spalvos, šriftai,
  # button-card šablonai), kad abu dashboard'ai atrodytų kaip viena sistema.
  - title: Eimo SE
    path: eimo
    type: sections
    max_columns: 2
    dense_section_placement: true
    sections:
      # ── 1. DABAR ─────────────────────────────────────────────────────
      - type: grid
        cards:
          # Cloud duomenų amžius iš solis_timestamp_measurements_received
          # (unix s). Cloud atnaujina kas ~5 min: iki 6 min žalia, >6 min
          # pilka (vėluoja), >15 min raudona (cloud/integracijos strigtis,
          # audituose pasitaikydavo unavailable ruožų). update_timer būtinas,
          # kad amžius "bėgtų" ir spalva keistųsi net kai entity nebesikeičia.
          - type: custom:button-card
            entity: sensor.solis_inverter_1033300254190112_solis_timestamp_measurements_received
            update_timer: 5000
            icon: mdi:cloud-check-variant
            name: ☀️ Eimo SE energija
            show_name: true
            show_icon: true
            show_label: true
            show_state: false
            label: |
              [[[
                var a = Math.max(0, Math.round(Date.now()/1000 - parseFloat(entity.state)));
                if (a < 60) return a + 's';
                return Math.round(a/60) + ' min';
              ]]]
            tap_action:
              action: none
            styles:
              card:
                - background: none
                - box-shadow: none
                - border: none
                - padding: 0
              grid:
                - grid-template-areas: '"n i l"'
                - grid-template-columns: 1fr min-content min-content
                - align-items: center
              name:
                - justify-self: start
                - font-size: 1.4em
                - font-weight: normal
                - color: var(--primary-text-color)
              icon:
                - width: 22px
                - color: |
                    [[[
                      var a = Math.max(0, Math.round(Date.now()/1000 - parseFloat(entity.state)));
                      return a > 900 ? '#f44336' : (a > 360 ? '#9e9e9e' : '#00E676');
                    ]]]
              label:
                - font-size: 14px
                - padding-left: 6px
                - color: var(--primary-text-color)

          # Dabartinė galia — button-card eilė su krypčiai jautriomis ikonomis
          # (identiška Modbus dashboard'ui). Ženklai (Eimo cloud, patikrinta
          # pagal 2026-07-13 istoriją: naktį namai iš baterijos = neigiamas,
          # rytą PV krauna + SOC kyla = teigiamas): grid_total_power + =
          # eksportas, − = importas; battery_power + = KRAUNASI, − = IŠKRAUNA
          # (ABU atvirkščiai nei Modbus!).
          - type: horizontal-stack
            cards:
              # Saulė
              - type: custom:button-card
                entity: sensor.eimo_pv_power
                size: 24px
                name: Saulė
                show_state: true
                icon: mdi:weather-sunny
                state_display: '[[[ return Math.round(parseFloat(entity.state)) + " W"; ]]]'
                styles:
                  grid:
                    - grid-template-areas: '"n" "i" "s"'
                  name:
                    - font-size: 0.9em
                    - font-weight: normal
                    - color: var(--secondary-text-color)
                  state:
                    - font-size: 1em
                    - color: var(--primary-text-color)
                  icon:
                    - color: |
                        [[[ return parseFloat(entity.state) > 10 ? '#FFB300' : 'var(--secondary-text-color)'; ]]]

              # Namai
              - type: custom:button-card
                entity: sensor.solis_inverter_1033300254190112_solis_total_consumption_power
                size: 24px
                name: Namai
                show_state: true
                icon: mdi:home-import-outline
                state_display: '[[[ return Math.round(parseFloat(entity.state)) + " W"; ]]]'
                styles:
                  grid:
                    - grid-template-areas: '"n" "i" "s"'
                  name:
                    - font-size: 0.9em
                    - font-weight: normal
                    - color: var(--secondary-text-color)
                  state:
                    - font-size: 1em
                    - color: var(--primary-text-color)
                  icon:
                    - color: |
                        [[[ return parseFloat(entity.state) > 0 ? '#42A5F5' : 'var(--secondary-text-color)'; ]]]

              # Tinklas — Eimo cloud: + = eksportas (žalia), − = importas (raudona)
              - type: custom:button-card
                entity: sensor.solis_inverter_1033300254190112_solis_power_grid_total_power
                size: 24px
                show_state: true
                name: |
                  [[[
                    var p = parseFloat(entity.state);
                    if (p > 20) return 'Į tinklą';
                    if (p < -20) return 'Iš tinklo';
                    return 'Tinklas';
                  ]]]
                icon: |
                  [[[
                    var p = parseFloat(entity.state);
                    if (p > 20) return 'mdi:transmission-tower-import';
                    if (p < -20) return 'mdi:transmission-tower-export';
                    return 'mdi:transmission-tower';
                  ]]]
                state_display: '[[[ return Math.round(Math.abs(parseFloat(entity.state))) + " W"; ]]]'
                styles:
                  grid:
                    - grid-template-areas: '"n" "i" "s"'
                  name:
                    - font-size: 0.9em
                    - font-weight: normal
                    - color: var(--secondary-text-color)
                  state:
                    - font-size: 1em
                    - color: var(--primary-text-color)
                  icon:
                    - color: |
                        [[[
                          var p = parseFloat(entity.state);
                          if (p > 20) return '#00C853';
                          if (p < -20) return '#F44336';
                          return 'var(--secondary-text-color)';
                        ]]]

              # Baterija — su žaibu kai kraunasi; lygis pagal SOC (10 % žingsniu)
              - type: custom:button-card
                entity: sensor.solis_inverter_1033300254190112_solis_battery_power
                size: 24px
                show_state: true
                name: |
                  [[[
                    var p = parseFloat(entity.state);
                    if (p > 20) return 'Kraunasi';
                    if (p < -20) return 'Iškrauna';
                    return 'Baterija';
                  ]]]
                icon: |
                  [[[
                    var p = parseFloat(entity.state);
                    var s = states['sensor.solis_inverter_1033300254190112_solis_remaining_battery_capacity'];
                    var soc = s ? parseFloat(s.state) : 0;
                    var lvl = Math.min(100, Math.max(0, Math.round(soc / 10) * 10));
                    if (p > 20) return lvl <= 0 ? 'mdi:battery-charging-outline' : 'mdi:battery-charging-' + lvl;
                    if (lvl >= 100) return 'mdi:battery';
                    if (lvl <= 0) return 'mdi:battery-outline';
                    return 'mdi:battery-' + lvl;
                  ]]]
                state_display: '[[[ return Math.round(Math.abs(parseFloat(entity.state))) + " W"; ]]]'
                styles:
                  grid:
                    - grid-template-areas: '"n" "i" "s"'
                  name:
                    - font-size: 0.9em
                    - font-weight: normal
                    - color: var(--secondary-text-color)
                  state:
                    - font-size: 1em
                    - color: var(--primary-text-color)
                  icon:
                    - color: |
                        [[[
                          var p = parseFloat(entity.state);
                          if (p > 20) return '#00C853';
                          if (p < -20) return '#FF9800';
                          return 'var(--secondary-text-color)';
                        ]]]

              # SOC — pripildymo lygis, spalva pagal %
              - type: custom:button-card
                entity: sensor.solis_inverter_1033300254190112_solis_remaining_battery_capacity
                size: 24px
                name: SOC
                show_state: true
                icon: |
                  [[[
                    var soc = parseFloat(entity.state);
                    var lvl = Math.min(100, Math.max(0, Math.round(soc / 10) * 10));
                    if (lvl >= 100) return 'mdi:battery';
                    if (lvl <= 0) return 'mdi:battery-outline';
                    return 'mdi:battery-' + lvl;
                  ]]]
                state_display: '[[[ return Math.round(parseFloat(entity.state)) + "%"; ]]]'
                styles:
                  grid:
                    - grid-template-areas: '"n" "i" "s"'
                  name:
                    - font-size: 0.9em
                    - font-weight: normal
                    - color: var(--secondary-text-color)
                  state:
                    - font-size: 1em
                    - color: var(--primary-text-color)
                  icon:
                    - color: |
                        [[[
                          var soc = parseFloat(entity.state);
                          if (soc < 20) return '#F44336';
                          if (soc < 50) return '#FF9800';
                          return '#00C853';
                        ]]]

          # Esamas SOC prieš algoritmo tikslą — vienoje eilėje matosi, ar
          # baterija juda link tikslo (07-08 dienos iškrova tapo sąlyginė —
          # be pertekliaus baterija turi kauptis link target).
          - type: horizontal-stack
            cards:
              - type: gauge
                entity: sensor.solis_inverter_1033300254190112_solis_remaining_battery_capacity
                name: Baterijos SOC
                unit: "%"
                min: 0
                max: 100
                severity:
                  green: 50
                  yellow: 20
                  red: 5
              - type: gauge
                entity: sensor.energy_manager_eimo_target_soc
                name: Tikslinė SOC riba
                unit: "%"
                min: 0
                max: 100
                needle: true

          # Ką automatika suskaičiavo ir kur link veda bateriją.
          # Sprendimas — pirmoje eilėje (svarbiausia); Solcast korekcijos
          # rodikliai perkelti į Prognozių skiltį (grupavimas pagal temą).
          - type: entities
            show_header_toggle: false
            title: Balansas ir automatika
            entities:
              - entity: sensor.energy_manager_eimo_decision
                name: Sprendimas
                icon: mdi:robot
                secondary_info: last-changed
              - entity: sensor.energy_manager_eimo_target_soc
                name: Tikslinė SOC riba
                icon: mdi:bullseye-arrow
              - entity: sensor.energy_manager_eimo_balance
                name: Energijos balansas
                icon: mdi:scale-balance
              - entity: sensor.energy_manager_eimo_surplus
                name: Perteklius (netilps šiandien)
                icon: mdi:solar-power
              - entity: sensor.energy_manager_eimo_surplus_now
                name: Perteklius dabar
                icon: mdi:flash-outline
              - entity: sensor.consumption_remaining_today_eimo
                name: Likęs suvartojimas šiandien
                icon: mdi:timer-sand
              - entity: sensor.consumption_forecast_tomorrow_eimo
                name: Rytojaus suvartojimas
                icon: mdi:calendar-arrow-right

          # Nakties ekonomika — skaičiuoja AppDaemon (energy_manager_eimo.py),
          # analogiška Modbus kortelei.
          - type: markdown
            title: Naktinis planas 💤
            content: >
              **{{ states('sensor.inverter_night_economics_eimo') }}**

              - Įjungtas naktį: **{{ (state_attr('sensor.inverter_night_economics_eimo', 'kaina_ijungtas_eur_h') | float(0) * 100) | round(1) }} ct/h** ·
                išjungtas: **{{ (state_attr('sensor.inverter_night_economics_eimo', 'kaina_isjungtas_eur_h') | float(0) * 100) | round(1) }} ct/h**
              - Baterijos kWh vertė: {{ state_attr('sensor.inverter_night_economics_eimo', 'baterijos_kwh_verte') }}
              - Numatomas išjungimas: **{{ states('sensor.inverter_shutdown_eta_eimo') }}**
              - Ryto įjungimas: **{{ states('sensor.inverter_morning_on_time_eimo') | as_timestamp(none) | timestamp_custom('%H:%M', true, '—') }}**

          # Šiandienos rezultatai — kairės kolonos apačioje (kolonų aukščio
          # balansui; atskira „Prognozių" sekcija palikdavo tuščią tarpą).
          - type: glance
            title: Šiandien
            entities:
              - entity: sensor.solis_inverter_1033300254190112_solis_energy_today
                name: Pagaminta
                icon: mdi:solar-power-variant
              - entity: sensor.solar_today_expected_eimo
                name: Numatoma
                icon: mdi:chart-bell-curve-cumulative
              - entity: sensor.self_sufficiency_today_eimo
                name: Savarankiškumas
                icon: mdi:home-percent
              - entity: sensor.energy_savings_today_eimo
                name: Sutaupyta
                icon: mdi:piggy-bank
              - entity: sensor.solis_inverter_1033300254190112_solis_daily_grid_energy_used
                name: Suvartota
                icon: mdi:home-lightning-bolt
              - entity: sensor.solis_inverter_1033300254190112_solis_daily_on_grid_energy
                name: Parduota
                icon: mdi:transmission-tower-import
              - entity: sensor.solis_inverter_1033300254190112_solis_daily_grid_energy_purchased
                name: Pirkta
                icon: mdi:transmission-tower-export
              - entity: sensor.solis_inverter_1033300254190112_solis_daily_energy_charged
                name: Į bateriją
                icon: mdi:battery-plus
              - entity: sensor.solis_inverter_1033300254190112_solis_daily_energy_discharged
                name: Iš baterijos
                icon: mdi:battery-minus
            show_state: true

      # ── 2. VALDYMAS IR PROGNOZĖS (dešinė kolona) ─────────────────────
      - type: grid
        cards:
          # Audros režimas — tile viršuje, kaip Modbus rankinio valdymo tiles:
          # svarbiausias jungiklis matomas ir perjungiamas vienu paspaudimu.
          - type: tile
            entity: input_boolean.storm_mode_eimo
            name: Audros / ESO režimas
            icon: mdi:weather-lightning
            color: red
            tap_action:
              action: toggle

          - type: entities
            show_header_toggle: false
            title: Nustatymai ir kainos
            entities:
              - entity: input_select.energy_season_eimo
                name: Sezonas
                icon: mdi:calendar-sync
              - entity: input_number.daytime_export_floor_eimo
                name: Dienos eksporto riba (floor)
                icon: mdi:transmission-tower
              - entity: input_number.electricity_price_buy_eimo
                name: Pirkimo kaina
                icon: mdi:cash-minus
              - entity: input_number.electricity_price_sell_eimo
                name: Pardavimo kaina
                icon: mdi:cash-plus

          # Ką inverteris REALIAI turi nustatyta slot1 (automacijos jį valdo).
          # Slot1 — vienintelis automatikos naudojamas; slot2–6 palikti seni
          # rankiniai įrašai su OFF jungikliais.
          - type: entities
            show_header_toggle: false
            title: Slot1 (inverterio registrai)
            entities:
              - entity: select.inverter_control_1033300254190112_storage_mode
                name: Inverterio režimas
                icon: mdi:cog
              - entity: switch.inverter_control_1033300254190112_slot1_discharge
                name: Iškrovimo slotas
                icon: mdi:battery-arrow-down
              - entity: text.inverter_control_1033300254190112_slot1_discharge_time
                name: Iškrovimo langas
                icon: mdi:clock-outline
              - entity: number.inverter_control_1033300254190112_slot1_discharge_soc
                name: Iškrovimo cut-off SOC
                icon: mdi:battery-low
              - entity: number.inverter_control_1033300254190112_slot1_discharge_current
                name: Iškrovimo srovė
                icon: mdi:current-dc
              - entity: switch.inverter_control_1033300254190112_slot1_charge
                name: Krovimo slotas (audros rež.)
                icon: mdi:battery-arrow-up
              - entity: switch.inverter_control_1033300254190112_allow_grid_charging
                name: Krovimas iš tinklo leidžiamas
                icon: mdi:transmission-tower-export
              - entity: switch.inverter_control_1033300254190112_allow_export
                name: Eksportas leidžiamas
                icon: mdi:transmission-tower-import

          - type: entities
            show_header_toggle: false
            title: Inverterio būsena
            entities:
              - entity: sensor.solis_inverter_1033300254190112_solis_temperature
                name: Temperatūra
                icon: mdi:thermometer
              - entity: sensor.solis_inverter_1033300254190112_solis_battery_state_of_health
                name: Baterijos sveikata (SOH)
                icon: mdi:battery-heart-variant
              - entity: sensor.battery_roundtrip_efficiency_eimo
                name: Round-trip efektyvumas
                icon: mdi:battery-sync
              - entity: sensor.battery_equivalent_cycles_eimo
                name: Ekvivalentiniai ciklai
                icon: mdi:counter
              - entity: sensor.solis_inverter_1033300254190112_solis_state
                name: Inverterio būsena
                icon: mdi:information-outline
              - entity: switch.inverter_control_1033300254190112_inverter_on_off
                name: Inverteris (on/off)
                icon: mdi:power

          # Solcast + korekcijos rodikliai vienoje vietoje (dešinės kolonos
          # apačioje — kolonų aukščio balansui).
          - type: entities
            show_header_toggle: false
            title: Saulės prognozė ir korekcija
            entities:
              - entity: sensor.solcast_pv_forecast_forecast_remaining_today
                name: Liko šiandien (žalias Solcast)
                icon: mdi:timer-sand
              - type: attribute
                entity: sensor.solar_today_expected_eimo
                attribute: liko_koreguota_kwh
                name: Liko šiandien (Eimo koreguota)
                suffix: kWh
                icon: mdi:timer-sand-complete
              - entity: sensor.solcast_pv_forecast_forecast_tomorrow
                name: Rytoj
                icon: mdi:weather-partly-cloudy
              - entity: input_number.solcast_forecast_yesterday_eimo
                name: Vakar prognozuota
                icon: mdi:history
              - entity: sensor.solcast_correction_factor_eimo
                name: Solcast korekcija
                icon: mdi:tune-variant
                secondary_info: last-updated
              - entity: sensor.solcast_intraday_ratio_eimo
                name: Intradienos santykis (faktas/prognozė)
                icon: mdi:chart-line
                secondary_info: last-updated

      # Grafikai per visą plotį — cloud duomenys ~5 min žingsniu.
      - type: grid
        column_span: 2
        cards:
          # SOC (kairė ašis, %) + galios (dešinė ašis, W) — kaip Modbus
          # dashboard'e. Matosi, ar baterija kaupiasi link target, kada
          # iškrauna, kaip saulė dengia namus.
          - type: custom:apexcharts-card
            header:
              show: true
              title: Suvartojimas ir gamyba (24 val. · SOC % / W)
            graph_span: 24h
            update_interval: 60s
            apex_config:
              chart:
                height: 300
                parentHeightOffset: 0
                animations:
                  enabled: false
              grid:
                padding:
                  left: 0
                  right: 0
                  top: 0
                  bottom: 0
              xaxis:
                labels:
                  datetimeFormatter:
                    hour: 'HH:mm'
            yaxis:
              - id: soc
                min: 0
                max: 100
                decimals: 0
              - id: power
                opposite: true
                min: 0
                align_to: 500
                decimals: 0
                apex_config:
                  stepSize: 500
            series:
              - entity: sensor.eimo_pv_power
                name: Saulė
                yaxis_id: power
                color: '#2196f3'
                type: area
                opacity: 0.25
                stroke_width: 1
                group_by:
                  func: avg
                  duration: 5min
              - entity: sensor.solis_inverter_1033300254190112_solis_total_consumption_power
                name: Namai
                yaxis_id: power
                color: '#f44336'
                stroke_width: 1
                group_by:
                  func: avg
                  duration: 5min
              - entity: sensor.solis_inverter_1033300254190112_solis_remaining_battery_capacity
                name: SOC
                yaxis_id: soc
                color: '#880e4f'
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 5min

          # 14 d. dienos balansas iš cloud dienos skaitliukų (resetinasi
          # vidurnaktį, todėl max per parą = dienos suma).
          - type: custom:apexcharts-card
            header:
              show: true
              title: Dienos balansas (14 d. · kWh)
            graph_span: 14d
            update_interval: 5min
            span:
              end: day
            apex_config:
              chart:
                height: 280
                animations:
                  enabled: false
            yaxis:
              - min: 0
                decimals: 0
            series:
              - entity: sensor.solis_inverter_1033300254190112_solis_energy_today
                name: Saulė
                type: column
                color: '#fbc02d'
                group_by:
                  func: max
                  duration: 1d
              - entity: sensor.solis_inverter_1033300254190112_solis_daily_grid_energy_used
                name: Suvartota
                type: column
                color: '#f44336'
                group_by:
                  func: max
                  duration: 1d
              - entity: sensor.solis_inverter_1033300254190112_solis_daily_on_grid_energy
                name: Parduota
                type: column
                color: '#4caf50'
                group_by:
                  func: max
                  duration: 1d
              - entity: sensor.solis_inverter_1033300254190112_solis_daily_grid_energy_purchased
                name: Pirkta
                type: column
                color: '#9e9e9e'
                group_by:
                  func: max
                  duration: 1d

  - title: Vartojimas
    path: vartojimas
    icon: mdi:chart-bar
    cards:
      - type: markdown
        content: >
          ### Eimo vartojimo profilis

          Paros vidurkis **{{ state_attr('sensor.consumption_profile_eimo','daily_avg') }} kWh**
          · duomenų **{{ state_attr('sensor.consumption_profile_eimo','data_days') }} d.**
          · valandinio mokymosi **{{ states('sensor.consumption_profile_eimo') }} d.**
      - type: custom:apexcharts-card
        header:
          show: true
          title: Vartojimas pagal valandą (kWh)
        graph_span: 24h
        span:
          start: day
        apex_config:
          chart:
            height: 260
            animations:
              enabled: false
          xaxis:
            labels:
              format: 'HH:00'
          tooltip:
            x:
              format: 'HH:00'
        yaxis:
          - min: 0
            decimals: 1
        series:
          - entity: sensor.consumption_profile_eimo
            name: kWh
            type: column
            color: '#42a5f5'
            data_generator: |
              const arr = entity.attributes.hourly_kwh || [];
              const pts = arr.map((v, i) => {
                const d = new Date(); d.setHours(i, 0, 0, 0);
                return [d.getTime(), v];
              });
              if (arr.length) {
                const d = new Date(); d.setHours(24, 0, 0, 0);
                pts.push([d.getTime(), arr[0]]);
              }
              return pts;
      - type: custom:apexcharts-card
        header:
          show: true
          title: Vartojimas pagal savaitės dieną (kWh)
        graph_span: 154h
        span:
          start: isoWeek
          offset: '-7d'
        apex_config:
          chart:
            height: 240
            animations:
              enabled: false
            locales:
              - name: en
                options:
                  days: [Sekmadienis, Pirmadienis, Antradienis, Trečiadienis, Ketvirtadienis, Penktadienis, Šeštadienis]
                  shortDays: [Sk, Pr, An, Tr, Kt, Pn, Št]
                  months: [Sausis, Vasaris, Kovas, Balandis, Gegužė, Birželis, Liepa, Rugpjūtis, Rugsėjis, Spalis, Lapkritis, Gruodis]
                  shortMonths: [Sau, Vas, Kov, Bal, Geg, Bir, Lie, Rgp, Rgs, Spa, Lap, Gru]
          xaxis:
            type: datetime
            tickAmount: 6
            labels:
              format: ddd
              datetimeUTC: false
          tooltip:
            x:
              format: dddd
          stroke:
            curve: straight
          markers:
            size: 0
            hover:
              size: 0
        yaxis:
          - min: 0
            decimals: 1
        series:
          - entity: sensor.consumption_profile_eimo
            name: kWh
            type: column
            color: '#66bb6a'
            data_generator: |
              const now = new Date();
              const dow = (now.getDay() + 6) % 7;
              const monday = new Date(now); monday.setDate(now.getDate() - dow - 7); monday.setHours(0, 0, 0, 0);
              return (entity.attributes.weekday_kwh || []).map((v, i) => {
                const d = new Date(monday); d.setDate(monday.getDate() + i); d.setHours(0, 0, 0, 0);
                return [d.getTime(), v];
              });
          - entity: sensor.consumption_profile_eimo
            name: Vidurkis
            type: line
            color: '#78909c'
            stroke_width: 1
            data_generator: |
              const arr = entity.attributes.weekday_kwh || [];
              const avg = arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
              const now = new Date();
              const dow = (now.getDay() + 6) % 7;
              const monday = new Date(now); monday.setDate(now.getDate() - dow - 7); monday.setHours(0, 0, 0, 0);
              return arr.map((v, i) => {
                const d = new Date(monday); d.setDate(monday.getDate() + i); d.setHours(0, 0, 0, 0);
                return [d.getTime(), avg];
              });
