  # Gilesnė analizė: vartojimo modelis, baterijos sveikata, ilgalaikiai
  # grafikai. Kasdieniam valdymui — pirmas puslapis.
  - title: Analizė
    path: analize
    icon: mdi:chart-box
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: glance
            title: Šiandienos rezultatas
            entities:
              - entity: sensor.self_sufficiency_today
                name: Savarankiškumas
                icon: mdi:home-percent
              - entity: sensor.energy_savings_today
                name: Sutaupyta
                icon: mdi:piggy-bank
              - entity: sensor.solis_s6_eh3p_today_energy_consumption
                name: Suvartota
              - entity: sensor.solis_s6_eh3p_today_energy_imported_from_grid
                name: Pirkta
              - entity: sensor.solis_s6_eh3p_today_energy_fed_into_grid
                name: Parduota
            show_state: true

          - type: glance
            title: Vartojimo modelis (AppDaemon)
            entities:
              - entity: sensor.consumption_daily_avg
                name: Paros vidurkis
                icon: mdi:counter
              - entity: sensor.consumption_remaining_today
                name: Liko šiandien
                icon: mdi:timer-sand
              - entity: sensor.consumption_forecast_tomorrow
                name: Rytoj
                icon: mdi:calendar-arrow-right
            show_state: true

          # Fazės: įtampa ir tinklo mainai iš smart meter (registrai per
          # lokalų Modbus kaip meter_*), inverterio paduodama galia į fazes
          # — U×I iš inverterio AC gnybtų (fazinės galios registro nėra).
          # 2026-07-18 perkelta iš Energijos view — diagnostika, ne valdymas.
          - type: glance
            title: Fazės L1 / L2 / L3
            columns: 3
            entities:
              - entity: sensor.solis_s6_eh3p_meter_ac_voltage_a
                name: Įtampa L1
              - entity: sensor.solis_s6_eh3p_meter_ac_voltage_b
                name: Įtampa L2
              - entity: sensor.solis_s6_eh3p_meter_ac_voltage_c
                name: Įtampa L3
              - entity: sensor.solis_s6_eh3p_meter_active_power_a
                name: Tinklas L1
                icon: mdi:transmission-tower
              - entity: sensor.solis_s6_eh3p_meter_active_power_b
                name: Tinklas L2
                icon: mdi:transmission-tower
              - entity: sensor.solis_s6_eh3p_meter_active_power_c
                name: Tinklas L3
                icon: mdi:transmission-tower
              - entity: sensor.inverter_phase_power_l1
                name: Inverteris L1
              - entity: sensor.inverter_phase_power_l2
                name: Inverteris L2
              - entity: sensor.inverter_phase_power_l3
                name: Inverteris L3
            show_state: true

      - type: grid
        cards:
          - type: glance
            title: Baterijos sveikata
            entities:
              - entity: sensor.solis_s6_eh3p_battery_soh
                name: SOH
                icon: mdi:battery-heart-variant
              - entity: sensor.battery_equivalent_cycles
                name: Ciklai
              - entity: sensor.solis_s6_eh3p_today_battery_charge_energy
                name: Įkrauta šiandien
                icon: mdi:battery-plus
              - entity: sensor.solis_s6_eh3p_today_battery_discharge_energy
                name: Iškrauta šiandien
                icon: mdi:battery-minus
            show_state: true

          - type: glance
            title: Inverteris
            entities:
              - entity: sensor.solis_s6_eh3p_temperature
                name: Temperatūra
              - entity: sensor.solis_s6_eh3p_status_string
                name: Būsena
              - entity: sensor.solis_s6_eh3p_grid_frequency
                name: Tinklo dažnis
            show_state: true

          # Sistemos nuostolių balansas iš lifetime skaitliukų: kur dingsta
          # energija — baterijos round-trip vs inverterio konversija + idle.
          - type: glance
            title: Efektyvumas ir nuostoliai (nuo įrengimo)
            entities:
              - entity: sensor.system_efficiency
                name: Sistema
              - entity: sensor.battery_roundtrip_efficiency
                name: Baterija
              - entity: sensor.battery_losses_total
                name: Bat. nuostoliai
              - entity: sensor.inverter_losses_total
                name: Inv. nuostoliai
              - entity: sensor.battery_equivalent_cycles
                name: Bat. ciklai
            show_state: true

          # I²R nuostoliai 50 m 5×6 mm² kabelyje inverteris ↔ skydas,
          # skaičiuojami iš inverterio fazių srovių (R ≈ 0.146 Ω/gysla).
          - type: glance
            title: Kabelio nuostoliai (50 m, 5×6 mm²)
            entities:
              - entity: sensor.cable_loss_power
                name: Dabar
              - entity: sensor.cable_loss_percent
                name: Nuo srauto
              - entity: sensor.kabelio_nuostoliai_siandien
                name: Šiandien
              - entity: sensor.cable_loss_energy
                name: Iš viso
            show_state: true

      - type: grid
        column_span: 2
        cards:
          # 14 d. dienos balansas — gamyba, suvartojimas, tinklo mainai.
          # Dienos skaitliukai resetinasi vidurnaktį, todėl max per parą =
          # dienos suma.
          - type: custom:apexcharts-card
            header:
              show: true
              title: Dienos balansas (14 d. · kWh)
            graph_span: 14d
            update_interval: 5min
            span:
              end: day
            apex_config:
              chart:
                height: 280
                animations:
                  enabled: false
            yaxis:
              - min: 0
                decimals: 0
            series:
              - entity: sensor.solis_s6_eh3p_pv_today_energy_generation
                name: Saulė
                type: column
                color: '#fbc02d'
                group_by:
                  func: max
                  duration: 1d
              - entity: sensor.solis_s6_eh3p_today_energy_consumption
                name: Suvartota
                type: column
                color: '#f44336'
                group_by:
                  func: max
                  duration: 1d
              - entity: sensor.solis_s6_eh3p_today_energy_fed_into_grid
                name: Parduota
                type: column
                color: '#4caf50'
                group_by:
                  func: max
                  duration: 1d
              - entity: sensor.solis_s6_eh3p_today_energy_imported_from_grid
                name: Pirkta
                type: column
                color: '#9e9e9e'
                group_by:
                  func: max
                  duration: 1d

          # Inverterio temperatūra — derating prasideda ~75°C.
          - type: custom:apexcharts-card
            header:
              show: true
              title: Inverterio temperatūra (48 val.)
            graph_span: 48h
            update_interval: 5min
            apex_config:
              chart:
                height: 220
                animations:
                  enabled: false
            yaxis:
              - min: ~20
                decimals: 0
            series:
              - entity: sensor.solis_s6_eh3p_temperature
                name: Temperatūra °C
                color: '#ff7043'
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 15min

          # Baterijos round-trip efektyvumo trendas — audituose stebima tema
          # (lėtas dreifas žemyn nuo ~96 % birželį iki ~93 % liepą); vienas
          # skaičius glance kortelėje krypties neparodo.
          - type: custom:apexcharts-card
            header:
              show: true
              title: Baterijos round-trip efektyvumas (30 d.)
            graph_span: 30d
            update_interval: 10min
            span:
              end: day
            apex_config:
              chart:
                height: 220
                animations:
                  enabled: false
            yaxis:
              - min: 88
                max: 100
                decimals: 1
            series:
              - entity: sensor.battery_roundtrip_efficiency
                name: Round-trip %
                color: '#7e57c2'
                stroke_width: 2
                group_by:
                  func: last
                  duration: 1d

          # Solcast prognozės tikslumas per 30 d. — korekcijos koeficientas
          # (sensor.solcast_correction_factor) mokosi iš šių duomenų.
          - type: custom:apexcharts-card
            header:
              show: true
              title: Prognozės tikslumas (30 d.)
            graph_span: 30d
            update_interval: 10min
            span:
              end: day
            apex_config:
              chart:
                animations:
                  enabled: false
            yaxis:
              - min: 0
                decimals: 0
            series:
              - entity: sensor.solcast_forecast_yesterday_accuracy
                name: Tikslumas %
                type: column
                group_by:
                  func: last
                  duration: 1d

  # ---------------------------------------------------------------------------
  #  Atsipirkimas — abi elektrinės kartu. Investicija/parama įvedama ranka.
  #  Kreivių forma iki šiandien ir į ateitį — sezoninis modelis (LT mėnesių
  #  svoriai), prikabintas prie faktinių skaitliukų šiandien.
  # ---------------------------------------------------------------------------
  - title: Atsipirkimas
    path: atsipirkimas
    icon: mdi:cash-clock
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: entities
            show_header_toggle: false
            title: Įvestis (pildyk ranka)
            entities:
              - entity: input_number.pv_investicija
                name: Investicija (abi elektrinės)
              - entity: input_number.pv_parama
                name: Parama (APVA)
              - entity: input_number.pv_kwh_verte
                name: kWh vertė
              - entity: input_number.pv_men_mokestis
                name: Pasaugojimo mokestis /mėn
              - entity: input_number.pv_metine_gamyba
                name: Metinė gamyba (prognozė)

          - type: glance
            title: Rezultatas
            columns: 3
            entities:
              - entity: sensor.pv_pagaminta_viso
                name: Pagaminta (abi)
              - entity: sensor.solis_s6_eh3p_pv_total_energy_generation
                name: Šeškiniai
                icon: mdi:solar-panel
              - entity: sensor.solis_inverter_1033300254190112_solis_energy_total
                name: Eimo
                icon: mdi:solar-panel
              - entity: sensor.pv_sutaupyta_viso
                name: Sutaupyta
              - entity: sensor.pv_gryna_investicija
                name: Investicija–parama
              - entity: sensor.pv_atsipirkes_procentais
                name: Atsipirko
              - entity: sensor.pv_liko_iki_atsipirkimo
                name: Liko
              - entity: sensor.pv_atsipirkimo_prognoze
                name: Kada atsipirks

      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            header:
              show: true
              title: Atsipirkimas — sutaupyta € ir pagaminta kWh vs investicija
            graph_span: 4y
            span:
              start: year
            update_interval: 1h
            now:
              show: true
              label: šiandien
            apex_config:
              chart:
                height: 380
                animations:
                  enabled: false
              stroke:
                dashArray: [0, 8, 0]
              legend:
                show: true
            yaxis:
              - id: eur
                min: 0
                decimals: 0
                apex_config:
                  title:
                    text: '€'
              - id: kwh
                opposite: true
                min: 0
                decimals: 0
                apex_config:
                  title:
                    text: 'kWh'
            series:
              # Sutaupyta € — sezoninis modelis, prikabintas prie faktinio
              # sensor.pv_sutaupyta_viso šiandien; ateitis = prognozė.
              - entity: sensor.pv_sutaupyta_viso
                name: Sutaupyta €
                yaxis_id: eur
                color: '#4caf50'
                stroke_width: 3
                extend_to: false
                show:
                  extremas: false
                data_generator: |
                  const W = [0.02, 0.04, 0.08, 0.12, 0.14, 0.14, 0.14, 0.12, 0.09, 0.06, 0.03, 0.02];
                  const a = entity.attributes;
                  const annual = Number(a.metine_gamyba) || 11000;
                  const price = Number(a.kwh_verte) || 0.25;
                  // Naudingumo koef.: sutaupoma tik naudinga energija
                  // (pagaminta − nuostoliai) — sinchronizuota su
                  // pv_sutaupyta_viso (2026-07-18 korekcija).
                  const ratio = Number(a.naudingumo_koef) || 0.85;
                  const fee = Number(a.men_mokestis) || 10;
                  const eimoStart = new Date(2026, 1, 1);
                  // Modbus į tinklą pajungtas 2026-05-09 (iš ESO istorijos;
                  // ankstesnis 04-01 buvo spėjimas — balandį gamybos nebuvo).
                  const modbusStart = new Date(2026, 4, 9);
                  const eimoShare = 0.46;
                  const pts = [];
                  let cum = 0;
                  let d = new Date(2026, 1, 1);
                  const endD = new Date(2030, 1, 1);
                  while (d <= endD) {
                    pts.push([d.getTime(), cum]);
                    const share = d < modbusStart ? eimoShare : 1;
                    const mFee = (d >= eimoStart ? fee / 2 : 0) + (d >= modbusStart ? fee / 2 : 0);
                    cum += annual * W[d.getMonth()] * share * price * ratio - mFee;
                    d = new Date(d.getFullYear(), d.getMonth() + 1, 1);
                  }
                  const now = Date.now();
                  let modelNow = null;
                  for (let i = 1; i < pts.length; i++) {
                    if (pts[i][0] >= now) {
                      const [t0, v0] = pts[i - 1], [t1, v1] = pts[i];
                      modelNow = v0 + (v1 - v0) * (now - t0) / (t1 - t0);
                      break;
                    }
                  }
                  const actual = Number(entity.state);
                  const k = (modelNow > 0 && actual > 0) ? actual / modelNow : 1;
                  return pts.map(([t, v]) => [t, Math.round(v * k)]);

              # Grynoji investicija (investicija − parama) — tiesi linija.
              # Kur ją kerta žalia kreivė — atsipirkimo momentas.
              - entity: sensor.pv_gryna_investicija
                name: Investicija (be paramos)
                yaxis_id: eur
                color: '#f44336'
                stroke_width: 2
                extend_to: false
                show:
                  extremas: false
                data_generator: |
                  const v = Number(entity.state) || 0;
                  return [[new Date(2026, 1, 1).getTime(), v], [new Date(2030, 1, 1).getTime(), v]];

              # Pagaminta kWh (kaupiamoji) — dešinė ašis.
              - entity: sensor.pv_pagaminta_viso
                name: Pagaminta kWh
                yaxis_id: kwh
                color: '#fbc02d'
                stroke_width: 2
                opacity: 0.7
                extend_to: false
                show:
                  extremas: false
                data_generator: |
                  const W = [0.02, 0.04, 0.08, 0.12, 0.14, 0.14, 0.14, 0.12, 0.09, 0.06, 0.03, 0.02];
                  const annual = Number(entity.attributes.metine_gamyba) || 11000;
                  const modbusStart = new Date(2026, 4, 9);
                  const eimoShare = 0.46;
                  const pts = [];
                  let cum = 0;
                  let d = new Date(2026, 1, 1);
                  const endD = new Date(2030, 1, 1);
                  while (d <= endD) {
                    pts.push([d.getTime(), cum]);
                    cum += annual * W[d.getMonth()] * (d < modbusStart ? eimoShare : 1);
                    d = new Date(d.getFullYear(), d.getMonth() + 1, 1);
                  }
                  const now = Date.now();
                  let modelNow = null;
                  for (let i = 1; i < pts.length; i++) {
                    if (pts[i][0] >= now) {
                      const [t0, v0] = pts[i - 1], [t1, v1] = pts[i];
                      modelNow = v0 + (v1 - v0) * (now - t0) / (t1 - t0);
                      break;
                    }
                  }
                  const actual = Number(entity.state);
                  const k = (modelNow > 0 && actual > 0) ? actual / modelNow : 1;
                  return pts.map(([t, v]) => [t, Math.round(v * k)]);

  - title: Vartojimas
    path: vartojimas
    icon: mdi:chart-bar
    cards:
      - type: markdown
        content: >
          ### Namų vartojimo profilis

          Paros vidurkis **{{ state_attr('sensor.consumption_profile','daily_avg') }} kWh**
          · duomenų **{{ state_attr('sensor.consumption_profile','data_days') }} d.**
          · valandinio mokymosi **{{ states('sensor.consumption_profile') }} d.**
      - type: custom:apexcharts-card
        header:
          show: true
          title: Vartojimas pagal valandą (kWh)
        graph_span: 24h
        span:
          start: day
        apex_config:
          chart:
            height: 260
            animations:
              enabled: false
          xaxis:
            labels:
              format: 'HH:00'
          tooltip:
            x:
              format: 'HH:00'
        yaxis:
          - min: 0
            decimals: 1
        series:
          - entity: sensor.consumption_profile
            name: kWh
            type: column
            color: '#42a5f5'
            data_generator: |
              const arr = entity.attributes.hourly_kwh || [];
              const pts = arr.map((v, i) => {
                const d = new Date(); d.setHours(i, 0, 0, 0);
                return [d.getTime(), v];
              });
              if (arr.length) {
                const d = new Date(); d.setHours(24, 0, 0, 0);
                pts.push([d.getTime(), arr[0]]);
              }
              return pts;
      - type: custom:apexcharts-card
        header:
          show: true
          title: Vartojimas pagal savaitės dieną (kWh)
        graph_span: 167h
        span:
          start: isoWeek
        apex_config:
          chart:
            height: 240
            animations:
              enabled: false
            locales:
              - name: en
                options:
                  days: [Sekmadienis, Pirmadienis, Antradienis, Trečiadienis, Ketvirtadienis, Penktadienis, Šeštadienis]
                  shortDays: [Sk, Pr, An, Tr, Kt, Pn, Št]
                  months: [Sausis, Vasaris, Kovas, Balandis, Gegužė, Birželis, Liepa, Rugpjūtis, Rugsėjis, Spalis, Lapkritis, Gruodis]
                  shortMonths: [Sau, Vas, Kov, Bal, Geg, Bir, Lie, Rgp, Rgs, Spa, Lap, Gru]
          xaxis:
            type: datetime
            tickAmount: 6
            labels:
              format: ddd
              datetimeUTC: false
          tooltip:
            x:
              format: dddd
          stroke:
            dashArray: [0, 4]
            curve: straight
          markers:
            size: 0
        yaxis:
          - min: 0
            decimals: 1
        series:
          - entity: sensor.consumption_profile
            name: kWh
            type: column
            color: '#66bb6a'
            data_generator: |
              const now = new Date();
              const dow = (now.getDay() + 6) % 7;
              const monday = new Date(now); monday.setDate(now.getDate() - dow); monday.setHours(0, 0, 0, 0);
              return (entity.attributes.weekday_kwh || []).map((v, i) => {
                const d = new Date(monday); d.setDate(monday.getDate() + i); d.setHours(0, 0, 0, 0);
                return [d.getTime(), v];
              });
          - entity: sensor.consumption_profile
            name: Vidurkis
            type: line
            color: '#78909c'
            stroke_width: 1
            data_generator: |
              const arr = entity.attributes.weekday_kwh || [];
              const avg = arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
              const now = new Date();
              const dow = (now.getDay() + 6) % 7;
              const monday = new Date(now); monday.setDate(now.getDate() - dow); monday.setHours(0, 0, 0, 0);
              return arr.map((v, i) => {
                const d = new Date(monday); d.setDate(monday.getDate() + i); d.setHours(0, 0, 0, 0);
                return [d.getTime(), avg];
              });
      # ESO tinklo srautas — iš ILGALAIKĖS statistikos (jutiklio būsena
      # atsinaujina tik ~kartą per parą, todėl diff nieko nerodo). Išorinė
      # statistika eso:energy_consumed_220588 turi valandinius duomenis.
      # Native statistics-graph (ECharts) leidžia zoom/slinkti per datas.
      # PASTABA: ESO savitarnos duomenys vėluoja ~1–2 paras; eksporto
      # valandinės statistikos ESO kol kas neteikia (rodys tik importą).
      - type: statistics-graph
        title: ESO tinklo srautas (valandinis)
        chart_type: bar
        period: hour
        days_to_show: 7
        stat_types:
          - change
        entities:
          - entity: eso:energy_consumed_220588
            name: Iš tinklo (pirkta)
          - entity: eso:energy_returned_220588
            name: Į tinklą (parduota)
