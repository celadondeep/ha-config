title: Namai SE
views:
  # Išdėstymo logika (2026-07-08 pertvarka): keturios funkcinės grupės —
  # 1) DABAR (kairė viršuje) — kas vyksta šiuo metu ir ką nusprendė automatika,
  # 2) VALDYMAS (dešinė viršuje) — visi jungikliai ir inverterio registrai,
  # 3) FAZĖS (kairė apačioje) — techninė info, žiūrima rečiausiai,
  # 4) PROGNOZĖS (dešinė apačioje) — kainos, šiandien/vakar rezultatai.
  # Mobiliame sekcijos susideda ta pačia eile: Dabar → Valdymas → Fazės → Prognozės.
  - title: Energija
    path: energija
    type: sections
    max_columns: 2
    sections:
      # ── 1. DABAR ─────────────────────────────────────────────────────
      - type: grid
        cards:
          # Duomenų amžius skaičiuojamas tiesiai iš last_modbus_success
          # (timestamp) — atskiro kas 1 s template sensoriaus nebereikia.
          # update_timer būtinas: be jo button-card JS šablonus perskaičiuoja
          # tik entity pokyčio momentu, tad sekundės "stovi", o Modbus'ui
          # nutrūkus kortelė apskritai nebepersipiešia ir neparaudonuoja.
          - type: custom:button-card
            entity: sensor.solis_s6_eh3p_last_modbus_success
            update_timer: 1000
            icon: mdi:satellite-variant
            name: ☀️ Namai SE
            show_name: true
            show_icon: true
            show_label: true
            show_state: false
            label: |
              [[[
                var a = Math.max(0, Math.round((Date.now() - new Date(entity.state).getTime()) / 1000));
                return a + 's';
              ]]]
            tap_action:
              action: none
            styles:
              card:
                - background: none
                - box-shadow: none
                - border: none
                - padding: 0
              grid:
                - grid-template-areas: '"n i l"'
                - grid-template-columns: 1fr min-content min-content
                - align-items: center
              name:
                - justify-self: start
                - font-size: 1.4em
                - font-weight: normal
                - color: var(--primary-text-color)
              icon:
                - width: 22px
                - color: |
                    [[[
                      var a = Math.max(0, Math.round((Date.now() - new Date(entity.state).getTime()) / 1000));
                      return a > 60 ? '#f44336' : (a <= 15 ? '#00E676' : 'var(--primary-text-color)');
                    ]]]
              label:
                - font-size: 14px
                - padding-left: 6px
                - color: var(--primary-text-color)

          # Dabartinė galia — button-card eilė su krypčiai jautriomis ikonomis.
          # Ženklai (patikrinti iš Modbus): grid_power_net + = ima iš tinklo,
          # − = atiduoda; battery_power_net + = iškrauna, − = kraunasi.
          - type: heading
            heading: Dabartinė galia
            heading_style: subtitle
            icon: mdi:flash

          - type: horizontal-stack
            cards:
              # Saulė
              - type: custom:button-card
                entity: sensor.solis_s6_eh3p_total_pv_power
                size: 24px
                name: Saulė
                show_state: true
                icon: mdi:weather-sunny
                state_display: '[[[ return Math.round(parseFloat(entity.state)) + " W"; ]]]'
                styles:
                  grid:
                    - grid-template-areas: '"n" "i" "s"'
                  name:
                    - font-size: 0.9em
                    - font-weight: normal
                    - color: var(--secondary-text-color)
                  state:
                    - font-size: 1em
                    - color: var(--primary-text-color)
                  icon:
                    - color: |
                        [[[ return parseFloat(entity.state) > 10 ? '#FFB300' : 'var(--secondary-text-color)'; ]]]

              # Namai
              - type: custom:button-card
                entity: sensor.solis_s6_eh3p_household_load_power
                size: 24px
                name: Namai
                show_state: true
                icon: mdi:home-import-outline
                state_display: '[[[ return Math.round(parseFloat(entity.state)) + " W"; ]]]'
                styles:
                  grid:
                    - grid-template-areas: '"n" "i" "s"'
                  name:
                    - font-size: 0.9em
                    - font-weight: normal
                    - color: var(--secondary-text-color)
                  state:
                    - font-size: 1em
                    - color: var(--primary-text-color)
                  icon:
                    - color: |
                        [[[ return parseFloat(entity.state) > 0 ? '#42A5F5' : 'var(--secondary-text-color)'; ]]]

              # Tinklas — import (raudona, įeinanti) / export (žalia, išeinanti)
              - type: custom:button-card
                entity: sensor.solis_s6_eh3p_grid_power_net
                size: 24px
                show_state: true
                name: |
                  [[[
                    var p = parseFloat(entity.state);
                    if (p > 20) return 'Iš tinklo';
                    if (p < -20) return 'Į tinklą';
                    return 'Tinklas';
                  ]]]
                icon: |
                  [[[
                    var p = parseFloat(entity.state);
                    if (p > 20) return 'mdi:transmission-tower-export';
                    if (p < -20) return 'mdi:transmission-tower-import';
                    return 'mdi:transmission-tower';
                  ]]]
                state_display: '[[[ return Math.round(Math.abs(parseFloat(entity.state))) + " W"; ]]]'
                styles:
                  grid:
                    - grid-template-areas: '"n" "i" "s"'
                  name:
                    - font-size: 0.9em
                    - font-weight: normal
                    - color: var(--secondary-text-color)
                  state:
                    - font-size: 1em
                    - color: var(--primary-text-color)
                  icon:
                    - color: |
                        [[[
                          var p = parseFloat(entity.state);
                          if (p > 20) return '#F44336';
                          if (p < -20) return '#00C853';
                          return 'var(--secondary-text-color)';
                        ]]]

              # Baterija — su žaibu kai kraunasi, be žaibo kai iškrauna/rimsta; lygis pagal SOC (10 % žingsniu)
              - type: custom:button-card
                entity: sensor.solis_s6_eh3p_battery_power_net
                size: 24px
                show_state: true
                name: |
                  [[[
                    var p = parseFloat(entity.state);
                    if (p < -20) return 'Kraunasi';
                    if (p > 20) return 'Iškrauna';
                    return 'Baterija';
                  ]]]
                icon: |
                  [[[
                    var p = parseFloat(entity.state);
                    var s = states['sensor.solis_s6_eh3p_battery_soc'];
                    var soc = s ? parseFloat(s.state) : 0;
                    var lvl = Math.min(100, Math.max(0, Math.round(soc / 10) * 10));
                    // Kraunasi → su žaibu; kitaip → paprasta baterija pagal SOC.
                    if (p < -20) return lvl <= 0 ? 'mdi:battery-charging-outline' : 'mdi:battery-charging-' + lvl;
                    if (lvl >= 100) return 'mdi:battery';
                    if (lvl <= 0) return 'mdi:battery-outline';
                    return 'mdi:battery-' + lvl;
                  ]]]
                state_display: '[[[ return Math.round(Math.abs(parseFloat(entity.state))) + " W"; ]]]'
                styles:
                  grid:
                    - grid-template-areas: '"n" "i" "s"'
                  name:
                    - font-size: 0.9em
                    - font-weight: normal
                    - color: var(--secondary-text-color)
                  state:
                    - font-size: 1em
                    - color: var(--primary-text-color)
                  icon:
                    - color: |
                        [[[
                          var p = parseFloat(entity.state);
                          if (p < -20) return '#00C853';
                          if (p > 20) return '#FF9800';
                          return 'var(--secondary-text-color)';
                        ]]]

              # SOC — pripildymo lygis, spalva pagal %
              - type: custom:button-card
                entity: sensor.solis_s6_eh3p_battery_soc
                size: 24px
                name: SOC
                show_state: true
                icon: |
                  [[[
                    var soc = parseFloat(entity.state);
                    var lvl = Math.min(100, Math.max(0, Math.round(soc / 10) * 10));
                    if (lvl >= 100) return 'mdi:battery';
                    if (lvl <= 0) return 'mdi:battery-outline';
                    return 'mdi:battery-' + lvl;
                  ]]]
                state_display: '[[[ return Math.round(parseFloat(entity.state)) + "%"; ]]]'
                styles:
                  grid:
                    - grid-template-areas: '"n" "i" "s"'
                  name:
                    - font-size: 0.9em
                    - font-weight: normal
                    - color: var(--secondary-text-color)
                  state:
                    - font-size: 1em
                    - color: var(--primary-text-color)
                  icon:
                    - color: |
                        [[[
                          var soc = parseFloat(entity.state);
                          if (soc < 20) return '#F44336';
                          if (soc < 50) return '#FF9800';
                          return '#00C853';
                        ]]]

          # Ką automatika suskaičiavo ir kur link veda bateriją.
          - type: glance
            title: Balansas ir tikslai
            columns: 3
            entities:
              - entity: sensor.energy_manager_balance
                name: Balansas
              - entity: sensor.energy_manager_surplus
                name: Perteklius
              - entity: sensor.target_soc_effective
                name: SOC tikslas
              - entity: sensor.energy_manager_discharge_needed
                name: Reikia iškrauti
              - entity: sensor.energy_manager_surplus_now
                name: Perteklius dabar
              - entity: sensor.energy_manager_inverter_temp
                name: Inverteris
            show_state: true

          - type: entities
            show_header_toggle: false
            title: Automacijos būsena
            entities:
              - entity: sensor.energy_manager_status
                name: Režimas
                secondary_info: last-changed
              - entity: sensor.energy_manager_decision
                name: Paskutinis sprendimas
                secondary_info: last-changed
              - entity: sensor.energy_manager_boiler_status
                name: Boilerio valdymas
              # Audros/ESO režimo jungiklis perkeltas į bendrą „Audros / ESO
              # rezervas" kortelę (2026-07-18) — nebedubliuojamas čia.
              - entity: input_select.energy_season
                name: Sezonas

          # Nakties ekonomika — skaičiuoja AppDaemon (energy_manager.py):
          # kada apsimoka išjungti inverterį ir kada jį vėl įjungti ryte.
          - type: markdown
            title: Naktinis planas 💤
            content: >
              **{{ states('sensor.inverter_night_economics') }}**

              - Įjungtas naktį: **{{ (state_attr('sensor.inverter_night_economics', 'kaina_ijungtas_eur_h') | float(0) * 100) | round(1) }} ct/h** ·
                išjungtas: **{{ (state_attr('sensor.inverter_night_economics', 'kaina_isjungtas_eur_h') | float(0) * 100) | round(1) }} ct/h**
              - Baterijos kWh vertė: {{ state_attr('sensor.inverter_night_economics', 'baterijos_kwh_verte') }}
              - Numatomas išjungimas: **{{ states('sensor.inverter_shutdown_eta') }}**
              - Ryto įjungimas (Solcast >100 W): **{{ state_attr('sensor.inverter_morning_on_time', 'laikas') | default('—', true) }}**

      # ── 2. VALDYMAS ──────────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Valdymas
            heading_style: title
            icon: mdi:tune

          # Rankinis valdymas: įjungus — sustabdo automatizacijas, kurios
          # perrašo TOU iškrovimo slotą / darbo režimą (recalc kas 5 min,
          # ryto/vakaro režimai, dienos apsaugos, naktinis išjungimas).
          # Leidžia rankiniu būdu forsuoti iškrovimą į tinklą.
          - type: tile
            entity: input_boolean.manual_tou_override
            name: Rankinis valdymas
            icon: mdi:hand-back-right
            tap_action:
              action: toggle

          # SOC cut-off bypass: įjungus — automacijos nebeperrašo iškrovimo
          # cut-off SOC. Reikšmę nustatai pats „TOU slotai" kortelėje
          # (Iškrovimo cut-off SOC) ir ji nebeperšoka.
          - type: tile
            entity: input_boolean.manual_soc_override
            name: Cut-off SOC bypass (rankinis)
            icon: mdi:battery-lock
            tap_action:
              action: toggle

          - type: entities
            show_header_toggle: false
            title: Inverterio režimas
            entities:
              - entity: select.solis_s6_eh3p_work_mode
                name: Darbo režimas
              - entity: input_boolean.night_inverter_shutdown
                name: Naktinis išjungimas (idle 130 W → 30 W)
              - entity: switch.solis_s6_eh3p_power_state
                name: Inverterio maitinimas

          # Ką inverteris REALIAI turi nustatyta TOU slotuose — automacijos
          # juos valdo, bet iki šiol dashboard'e nesimatė.
          - type: entities
            show_header_toggle: false
            title: TOU slotai (inverterio registrai)
            entities:
              - entity: switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
                name: Iškrovimo slotas 1
              - entity: number.solis_s6_eh3p_grid_time_of_use_discharge_cut_off_soc_slot_1
                name: Iškrovimo cut-off SOC
              - entity: number.solis_s6_eh3p_grid_time_of_use_discharge_battery_current_slot_1
                name: Iškrovimo srovė
              - entity: time.solis_s6_eh3p_grid_time_of_use_discharge_start_slot_1
                name: Iškrovimo pradžia
              - entity: time.solis_s6_eh3p_grid_time_of_use_discharge_end_slot_1
                name: Iškrovimo pabaiga
              # Krovimo slotas (audros rež.) — valdomas automatikos, eilutė
              # perkelta į „Audros / ESO rezervas" kortelę (2026-07-18).
              - entity: switch.solis_s6_eh3p_allow_export_switch_under_self_generation_and_self_use
                name: Eksportas leidžiamas
              - entity: input_number.daytime_export_floor
                name: Dienos eksporto riba (floor)

      # ── 3. FAZĖS (techninė) ──────────────────────────────────────────
          # Prognozės po valdymo blokų — dešinė kolona (fazės iškeltos į
          # Analizę: diagnostika, ne kasdienis valdymas; 2026-07-18
          # perbalansavimas — kolonos buvo stipriai nelygios).
          - type: heading
            heading: Prognozės ir rezultatai
            heading_style: subtitle
            icon: mdi:weather-partly-cloudy

          - type: glance
            title: Šiandien
            entities:
              - entity: sensor.solis_s6_eh3p_pv_today_energy_generation
                name: Pagaminta
                icon: mdi:solar-power-variant
              - entity: sensor.solcast_pv_forecast_forecast_remaining_today
                name: Liko
                icon: mdi:timer-sand
              - entity: sensor.solcast_pv_forecast_forecast_today
                name: Prognozė
                icon: mdi:weather-sunny
              - entity: sensor.solar_today_expected
                name: Numatoma
                icon: mdi:chart-bell-curve-cumulative
              - entity: sensor.solcast_pv_forecast_forecast_tomorrow
                name: Rytoj
                icon: mdi:weather-partly-cloudy
            show_state: true

          - type: glance
            title: Vakar
            entities:
              - entity: input_number.solcast_forecast_yesterday
                name: Prognozuota
              - entity: sensor.solis_s6_eh3p_pv_yesterday_energy_generation
                name: Pagaminta
              - entity: sensor.solcast_forecast_yesterday_accuracy
                name: Tikslumas
            show_state: true

          - type: entities
            show_header_toggle: false
            title: Prognozė ir kainos
            entities:
              - entity: sensor.solcast_correction_factor
                name: Solcast korekcijos koeficientas
                secondary_info: last-updated
              - entity: sensor.solcast_intraday_ratio
                name: Intradienos santykis (faktas/prognozė)
                secondary_info: last-updated
              - entity: input_number.electricity_price_buy
                name: Pirkimo kaina
              - entity: input_number.electricity_price_sell
                name: Pardavimo kaina

          # Audros / ESO rezervas — VIENA kortelė (2026-07-18): ramybės
          # būsenoje tik 3 eilutės (atjungimų būsena, rankinis jungiklis,
          # planas); atjungimo langas rodomas tik kai planas aktyvus, krovimo
          # sloto būsena — tik kai audros režimas įjungtas. Pilnas ESO bloko
          # tekstas — paspaudus atjungimų eilutę (more-info atributas
          # „tekstas"). Automatika: packages/eso_pranesimai.yaml +
          # solis_storm_mode_toggle.
          - type: entities
            show_header_toggle: false
            title: Audros / ESO rezervas
            entities:
              - entity: sensor.eso_atjungimai
                name: ESO planuojami atjungimai
              - entity: input_boolean.storm_mode
                name: Audros / ESO režimas (rankinis)
              - entity: input_boolean.eso_rezervo_planas
                name: Rezervo planas (automatinis)
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_boolean.eso_rezervo_planas
                    state: "on"
                row:
                  entity: input_datetime.eso_atjungimas_nuo
                  name: Atjungimas nuo
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_boolean.eso_rezervo_planas
                    state: "on"
                row:
                  entity: input_datetime.eso_atjungimas_iki
                  name: Atjungimas iki
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_boolean.storm_mode
                    state: "on"
                row:
                  entity: switch.solis_s6_eh3p_grid_time_of_use_charging_period_1
                  name: Krovimo slotas (audros rež.)

      # ── 3. ESO PASAUGOJIMO BANKAS (kairė kolona po „Dabar" sekcijos) ──
      # ESO oficialūs įvado duomenys — TIK Modbus elektrinė (obj. 220588,
      # Šeškinių įvadas); Eimo įvado ESO paskyra dar nepajungta.
      - type: grid
        cards:
          - type: heading
            heading: ESO pasaugojimo bankas (įvadas 220588)
            heading_style: title
            icon: mdi:bank

          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.eso_bankas_likutis
                name: Banko likutis
                secondary_info: last-updated
              - entity: sensor.eso_bankas_220588
                name: Oficialus ESO likutis (uždaryto mėn.)
              - entity: sensor.eso_bankas_verte
                name: Banko vertė
              - entity: sensor.eso_bankas_prognoze
                name: Prognozė kovo 31 (biudžetas)
              - entity: sensor.baterijos_ciklo_nuostolis
                name: Baterijos ciklo nuostolis
              - entity: sensor.eso_ivado_eksportas
                name: Eksportuota banko metais (nuo bal. 1)
              - entity: sensor.eso_ivado_importas
                name: Atsiimta iš banko metais
              - entity: input_number.eso_bankas_pradzia
                name: Rankinė korekcija (normaliai 0)

          # Banko metų trajektorija: faktiniai ESO mėnesių likučiai +
          # prognozė iki kovo 31 + kumuliacinis trūkumas (kiek teks pirkti
          # bankui išsisėmus). EXP/IMP lentelės TURI SUTAPTI su
          # packages/eso_bankas.yaml (eso_bankas_prognoze) — auditas,
          # atnaujinęs paketo lenteles faktu, atnaujina ir čia.
          - type: custom:apexcharts-card
            header:
              show: true
              title: Banko metai — likutis ir žiemos trūkumas
            graph_span: 1y
            span:
              start: year
              offset: +3month
            update_interval: 1h
            now:
              show: true
              label: šiandien
            apex_config:
              chart:
                height: 260
                animations:
                  enabled: false
              legend:
                show: true
            yaxis:
              - id: kwh
                min: 0
                decimals: 0
                apex_config:
                  title:
                    text: 'kWh'
            series:
              # Faktiniai ESO uždarytų mėnesių likučiai (serija atribute).
              - entity: sensor.eso_bankas_220588
                name: Faktas (ESO)
                yaxis_id: kwh
                color: '#4caf50'
                stroke_width: 3
                extend_to: false
                show:
                  extremas: false
                data_generator: |
                  const s = entity.attributes.serija || {};
                  const now = new Date();
                  const bankStart = (now.getMonth() + 1 >= 4)
                    ? `${now.getFullYear()}-04`
                    : `${now.getFullYear() - 1}-04`;
                  const cur = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                  return Object.keys(s).sort()
                    .filter(k => k >= bankStart && k < cur)
                    .map(k => {
                      const [y, m] = k.split('-').map(Number);
                      return [new Date(y, m, 1).getTime(), s[k]];
                    });
              # Prognozė nuo dabar iki kovo 31 (lentelės = eso_bankas.yaml).
              - entity: sensor.eso_bankas_likutis
                name: Prognozė
                yaxis_id: kwh
                color: '#2196f3'
                stroke_width: 2
                extend_to: false
                show:
                  extremas: false
                data_generator: |
                  const EXP = {4:200,5:194,6:302,7:210,8:180,9:120,10:60,11:15,12:5,1:10,2:40,3:120};
                  const IMP = {4:150,5:128,6:98,7:145,8:110,9:130,10:200,11:300,12:380,1:380,2:300,3:250};
                  const now = new Date();
                  let bal = Number(entity.state) || 0;
                  let y = now.getFullYear(), m = now.getMonth() + 1;
                  const endY = (m >= 4) ? y + 1 : y;
                  let frac = Math.max(0, 1 - now.getDate() / 30.4);
                  const pts = [[now.getTime(), bal]];
                  while (!(y === endY && m === 4)) {
                    bal = Math.max(0, bal + (EXP[m] - IMP[m]) * frac);
                    frac = 1;
                    m += 1; if (m === 13) { m = 1; y += 1; }
                    pts.push([new Date(y, m - 1, 1).getTime(), bal]);
                  }
                  return pts;
              # Kumuliacinis trūkumas — kiek kWh teks pirkti iš tinklo.
              - entity: sensor.eso_bankas_likutis
                name: Trūkumas (pirkimas)
                yaxis_id: kwh
                color: '#e53935'
                stroke_width: 2
                curve: stepline
                extend_to: false
                show:
                  extremas: false
                data_generator: |
                  const EXP = {4:200,5:194,6:302,7:210,8:180,9:120,10:60,11:15,12:5,1:10,2:40,3:120};
                  const IMP = {4:150,5:128,6:98,7:145,8:110,9:130,10:200,11:300,12:380,1:380,2:300,3:250};
                  const now = new Date();
                  let bal = Number(entity.state) || 0;
                  let trukumas = 0;
                  let y = now.getFullYear(), m = now.getMonth() + 1;
                  const endY = (m >= 4) ? y + 1 : y;
                  let frac = Math.max(0, 1 - now.getDate() / 30.4);
                  const pts = [[now.getTime(), 0]];
                  while (!(y === endY && m === 4)) {
                    const naujas = bal + (EXP[m] - IMP[m]) * frac;
                    if (naujas < 0) { trukumas += -naujas; }
                    bal = Math.max(0, naujas);
                    frac = 1;
                    m += 1; if (m === 13) { m = 1; y += 1; }
                    pts.push([new Date(y, m - 1, 1).getTime(), Math.round(trukumas)]);
                  }
                  return pts;

      # Grafikai per visą puslapio plotį (abu stulpeliai).
      - type: grid
