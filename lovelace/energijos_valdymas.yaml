title: Energijos valdymas
views:
  - title: Energija
    path: energija
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          # Duomenų amžius skaičiuojamas tiesiai iš last_modbus_success
          # (timestamp) — atskiro kas 1 s template sensoriaus nebereikia.
          # update_timer būtinas: be jo button-card JS šablonus perskaičiuoja
          # tik entity pokyčio momentu, tad sekundės "stovi", o Modbus'ui
          # nutrūkus kortelė apskritai nebepersipiešia ir neparaudonuoja.
          - type: custom:button-card
            entity: sensor.solis_s6_eh3p_last_modbus_success
            update_timer: 1000
            icon: mdi:satellite-variant
            name: ☀️ Energijos valdymas
            show_name: true
            show_icon: true
            show_label: true
            show_state: false
            label: |
              [[[
                var a = Math.max(0, Math.round((Date.now() - new Date(entity.state).getTime()) / 1000));
                return a + 's';
              ]]]
            tap_action:
              action: none
            styles:
              card:
                - background: none
                - box-shadow: none
                - border: none
                - padding: 0
              grid:
                - grid-template-areas: '"n i l"'
                - grid-template-columns: 1fr min-content min-content
                - align-items: center
              name:
                - justify-self: start
                - font-size: 1.4em
                - font-weight: normal
                - color: var(--primary-text-color)
              icon:
                - width: 22px
                - color: |
                    [[[
                      var a = Math.max(0, Math.round((Date.now() - new Date(entity.state).getTime()) / 1000));
                      return a > 60 ? '#f44336' : (a <= 15 ? '#00E676' : 'var(--primary-text-color)');
                    ]]]
              label:
                - font-size: 14px
                - padding-left: 6px
                - color: var(--primary-text-color)

          # Rankinis valdymas: įjungus — sustabdo automatizacijas, kurios
          # perrašo TOU iškrovimo slotą / darbo režimą (recalc kas 5 min,
          # ryto/vakaro režimai, dienos apsaugos, naktinis išjungimas).
          # Leidžia rankiniu būdu forsuoti iškrovimą į tinklą.
          - type: tile
            entity: input_boolean.manual_tou_override
            name: Rankinis valdymas
            icon: mdi:hand-back-right
            tap_action:
              action: toggle

          # SOC cut-off bypass: įjungus — automacijos nebeperrašo iškrovimo
          # cut-off SOC. Reikšmę nustatai pats „TOU slotai" kortelėje
          # (Iškrovimo cut-off SOC) ir ji nebeperšoka.
          - type: tile
            entity: input_boolean.manual_soc_override
            name: Cut-off SOC bypass (rankinis)
            icon: mdi:battery-lock
            tap_action:
              action: toggle

          # Dabartinė galia — button-card eilė su krypčiai jautriomis ikonomis.
          # Ženklai (patikrinti iš Modbus): grid_power_net + = ima iš tinklo,
          # − = atiduoda; battery_power_net + = iškrauna, − = kraunasi.
          - type: vertical-stack
            cards:
              - type: markdown
                content: "#### Dabartinė galia"
              - type: horizontal-stack
                cards:
                  # Saulė
                  - type: custom:button-card
                    entity: sensor.solis_s6_eh3p_total_pv_power
                    size: 24px
                    name: Saulė
                    show_state: true
                    icon: mdi:weather-sunny
                    state_display: '[[[ return Math.round(parseFloat(entity.state)) + " W"; ]]]'
                    styles:
                      grid:
                        - grid-template-areas: '"n" "i" "s"'
                      name:
                        - font-size: 0.9em
                        - font-weight: normal
                        - color: var(--secondary-text-color)
                      state:
                        - font-size: 1em
                        - color: var(--primary-text-color)
                      icon:
                        - color: |
                            [[[ return parseFloat(entity.state) > 10 ? '#FFB300' : 'var(--secondary-text-color)'; ]]]

                  # Namai
                  - type: custom:button-card
                    entity: sensor.solis_s6_eh3p_household_load_power
                    size: 24px
                    name: Namai
                    show_state: true
                    icon: mdi:home-import-outline
                    state_display: '[[[ return Math.round(parseFloat(entity.state)) + " W"; ]]]'
                    styles:
                      grid:
                        - grid-template-areas: '"n" "i" "s"'
                      name:
                        - font-size: 0.9em
                        - font-weight: normal
                        - color: var(--secondary-text-color)
                      state:
                        - font-size: 1em
                        - color: var(--primary-text-color)
                      icon:
                        - color: |
                            [[[ return parseFloat(entity.state) > 0 ? '#42A5F5' : 'var(--secondary-text-color)'; ]]]

                  # Tinklas — import (raudona, įeinanti) / export (žalia, išeinanti)
                  - type: custom:button-card
                    entity: sensor.solis_s6_eh3p_grid_power_net
                    size: 24px
                    show_state: true
                    name: |
                      [[[
                        var p = parseFloat(entity.state);
                        if (p > 20) return 'Iš tinklo';
                        if (p < -20) return 'Į tinklą';
                        return 'Tinklas';
                      ]]]
                    icon: |
                      [[[
                        var p = parseFloat(entity.state);
                        if (p > 20) return 'mdi:transmission-tower-export';
                        if (p < -20) return 'mdi:transmission-tower-import';
                        return 'mdi:transmission-tower';
                      ]]]
                    state_display: '[[[ return Math.round(Math.abs(parseFloat(entity.state))) + " W"; ]]]'
                    styles:
                      grid:
                        - grid-template-areas: '"n" "i" "s"'
                      name:
                        - font-size: 0.9em
                        - font-weight: normal
                        - color: var(--secondary-text-color)
                      state:
                        - font-size: 1em
                        - color: var(--primary-text-color)
                      icon:
                        - color: |
                            [[[
                              var p = parseFloat(entity.state);
                              if (p > 20) return '#F44336';
                              if (p < -20) return '#00C853';
                              return 'var(--secondary-text-color)';
                            ]]]

                  # Baterija — su žaibu kai kraunasi, be žaibo kai iškrauna/rimsta; lygis pagal SOC (10 % žingsniu)
                  - type: custom:button-card
                    entity: sensor.solis_s6_eh3p_battery_power_net
                    size: 24px
                    show_state: true
                    name: |
                      [[[
                        var p = parseFloat(entity.state);
                        if (p < -20) return 'Kraunasi';
                        if (p > 20) return 'Iškrauna';
                        return 'Baterija';
                      ]]]
                    icon: |
                      [[[
                        var p = parseFloat(entity.state);
                        var s = states['sensor.solis_s6_eh3p_battery_soc'];
                        var soc = s ? parseFloat(s.state) : 0;
                        var lvl = Math.min(100, Math.max(0, Math.round(soc / 10) * 10));
                        // Kraunasi → su žaibu; kitaip → paprasta baterija pagal SOC.
                        if (p < -20) return lvl <= 0 ? 'mdi:battery-charging-outline' : 'mdi:battery-charging-' + lvl;
                        if (lvl >= 100) return 'mdi:battery';
                        if (lvl <= 0) return 'mdi:battery-outline';
                        return 'mdi:battery-' + lvl;
                      ]]]
                    state_display: '[[[ return Math.round(Math.abs(parseFloat(entity.state))) + " W"; ]]]'
                    styles:
                      grid:
                        - grid-template-areas: '"n" "i" "s"'
                      name:
                        - font-size: 0.9em
                        - font-weight: normal
                        - color: var(--secondary-text-color)
                      state:
                        - font-size: 1em
                        - color: var(--primary-text-color)
                      icon:
                        - color: |
                            [[[
                              var p = parseFloat(entity.state);
                              if (p < -20) return '#00C853';
                              if (p > 20) return '#FF9800';
                              return 'var(--secondary-text-color)';
                            ]]]

                  # SOC — pripildymo lygis, spalva pagal %
                  - type: custom:button-card
                    entity: sensor.solis_s6_eh3p_battery_soc
                    size: 24px
                    name: SOC
                    show_state: true
                    icon: |
                      [[[
                        var soc = parseFloat(entity.state);
                        var lvl = Math.min(100, Math.max(0, Math.round(soc / 10) * 10));
                        if (lvl >= 100) return 'mdi:battery';
                        if (lvl <= 0) return 'mdi:battery-outline';
                        return 'mdi:battery-' + lvl;
                      ]]]
                    state_display: '[[[ return Math.round(parseFloat(entity.state)) + "%"; ]]]'
                    styles:
                      grid:
                        - grid-template-areas: '"n" "i" "s"'
                      name:
                        - font-size: 0.9em
                        - font-weight: normal
                        - color: var(--secondary-text-color)
                      state:
                        - font-size: 1em
                        - color: var(--primary-text-color)
                      icon:
                        - color: |
                            [[[
                              var soc = parseFloat(entity.state);
                              if (soc < 20) return '#F44336';
                              if (soc < 50) return '#FF9800';
                              return '#00C853';
                            ]]]

          # Fazės: įtampa ir tinklo mainai iš smart meter (registrai per
          # lokalų Modbus kaip meter_*), inverterio paduodama galia į fazes
          # — U×I iš inverterio AC gnybtų (fazinės galios registro nėra).
          - type: glance
            title: Fazės L1 / L2 / L3
            columns: 3
            entities:
              - entity: sensor.solis_s6_eh3p_meter_ac_voltage_a
                name: Įtampa L1
              - entity: sensor.solis_s6_eh3p_meter_ac_voltage_b
                name: Įtampa L2
              - entity: sensor.solis_s6_eh3p_meter_ac_voltage_c
                name: Įtampa L3
              - entity: sensor.solis_s6_eh3p_meter_active_power_a
                name: Tinklas L1
                icon: mdi:transmission-tower
              - entity: sensor.solis_s6_eh3p_meter_active_power_b
                name: Tinklas L2
                icon: mdi:transmission-tower
              - entity: sensor.solis_s6_eh3p_meter_active_power_c
                name: Tinklas L3
                icon: mdi:transmission-tower
              - entity: sensor.inverter_phase_power_l1
                name: Inverteris L1
              - entity: sensor.inverter_phase_power_l2
                name: Inverteris L2
              - entity: sensor.inverter_phase_power_l3
                name: Inverteris L3
            show_state: true

          - type: glance
            title: Energijos valdymas
            entities:
              - entity: sensor.energy_manager_balance
                name: Balansas
              - entity: sensor.energy_manager_surplus
                name: Perteklius
              - entity: sensor.target_soc_effective
                name: SOC tikslas
              - entity: sensor.energy_manager_discharge_needed
                name: Reikia iškrauti
              - entity: sensor.energy_manager_surplus_now
                name: Perteklius dabar
              - entity: sensor.energy_manager_inverter_temp
                name: Inverteris
            show_state: true

          - type: entities
            title: Inverterio režimas
            entities:
              - entity: select.solis_s6_eh3p_work_mode
                name: Darbo režimas
              - entity: input_boolean.night_inverter_shutdown
                name: Naktinis išjungimas (idle 130 W → 30 W)
              - entity: switch.solis_s6_eh3p_power_state
                name: Inverterio maitinimas

          # Nakties ekonomika — skaičiuoja AppDaemon (energy_manager.py):
          # kada apsimoka išjungti inverterį ir kada jį vėl įjungti ryte.
          - type: markdown
            title: Naktinis planas 💤
            content: >
              **{{ states('sensor.inverter_night_economics') }}**

              - Įjungtas naktį: **{{ (state_attr('sensor.inverter_night_economics', 'kaina_ijungtas_eur_h') | float(0) * 100) | round(1) }} ct/h** ·
                išjungtas: **{{ (state_attr('sensor.inverter_night_economics', 'kaina_isjungtas_eur_h') | float(0) * 100) | round(1) }} ct/h**
              - Baterijos kWh vertė: {{ state_attr('sensor.inverter_night_economics', 'baterijos_kwh_verte') }}
              - Numatomas išjungimas: **{{ states('sensor.inverter_shutdown_eta') }}**
              - Ryto įjungimas (Solcast >100 W): **{{ state_attr('sensor.inverter_morning_on_time', 'laikas') | default('—', true) }}**

      - type: grid
        cards:
          # Ką inverteris REALIAI turi nustatyta TOU slotuose — automacijos
          # juos valdo, bet iki šiol dashboard'e nesimatė.
          - type: entities
            title: TOU slotai (inverterio registrai)
            entities:
              - entity: switch.solis_s6_eh3p_grid_time_of_use_discharge_period_1
                name: Iškrovimo slotas 1
              - entity: number.solis_s6_eh3p_grid_time_of_use_discharge_cut_off_soc_slot_1
                name: Iškrovimo cut-off SOC
              - entity: number.solis_s6_eh3p_grid_time_of_use_discharge_battery_current_slot_1
                name: Iškrovimo srovė
              - entity: time.solis_s6_eh3p_grid_time_of_use_discharge_start_slot_1
                name: Iškrovimo pradžia
              - entity: time.solis_s6_eh3p_grid_time_of_use_discharge_end_slot_1
                name: Iškrovimo pabaiga
              - entity: switch.solis_s6_eh3p_grid_time_of_use_charging_period_1
                name: Krovimo slotas 1 (audros rež.)
              - entity: switch.solis_s6_eh3p_allow_export_switch_under_self_generation_and_self_use
                name: Eksportas leidžiamas
              - entity: input_number.daytime_export_floor
                name: Dienos eksporto riba (floor)

          - type: entities
            title: Automacijos būsena
            entities:
              - entity: sensor.energy_manager_status
                name: Režimas
                secondary_info: last-changed
              - entity: sensor.energy_manager_decision
                name: Paskutinis sprendimas
                secondary_info: last-changed
              - entity: sensor.energy_manager_boiler_status
                name: Boilerio valdymas
              - entity: input_boolean.storm_mode
                name: Audros / ESO režimas
              - entity: input_select.energy_season
                name: Sezonas

          - type: entities
            title: Prognozė ir kainos
            entities:
              - entity: sensor.solcast_correction_factor
                name: Solcast korekcijos koeficientas
                secondary_info: last-updated
              - entity: input_number.electricity_price_buy
                name: Pirkimo kaina
              - entity: input_number.electricity_price_sell
                name: Pardavimo kaina

          - type: glance
            title: Vakar
            entities:
              - entity: input_number.solcast_forecast_yesterday
                name: Prognozuota
              - entity: sensor.solis_s6_eh3p_pv_yesterday_energy_generation
                name: Pagaminta
              - entity: sensor.solcast_forecast_yesterday_accuracy
                name: Tikslumas
            show_state: true

          - type: glance
            title: Šiandien
            entities:
              - entity: sensor.solis_s6_eh3p_pv_today_energy_generation
                name: Pagaminta
                icon: mdi:solar-power-variant
              - entity: sensor.solcast_pv_forecast_forecast_remaining_today
                name: Liko
                icon: mdi:timer-sand
              - entity: sensor.solcast_pv_forecast_forecast_today
                name: Prognozė
                icon: mdi:weather-sunny
              - entity: sensor.solar_today_expected
                name: Numatoma
                icon: mdi:chart-bell-curve-cumulative
              - entity: sensor.solcast_pv_forecast_forecast_tomorrow
                name: Rytoj
                icon: mdi:weather-partly-cloudy

      # Grafikai per visą puslapio plotį (abu stulpeliai).
      - type: grid
        column_span: 2
        cards:
          # SOC (kairė ašis, %) + galios (dešinė ašis, W) vienoje diagramoje.
          # Pakeičia history-graph, kur 0–100 % ir 0–5000 W bendroje ašyje
          # buvo neįskaitomi.
          - type: custom:apexcharts-card
            header:
              show: true
              title: Suvartojimas ir gamyba (24 val. · SOC % / W)
            graph_span: 24h
            update_interval: 30s
            apex_config:
              chart:
                height: 300
                parentHeightOffset: 0
                animations:
                  enabled: false
              grid:
                padding:
                  left: 0
                  right: 0
                  top: 0
                  bottom: 0
              xaxis:
                labels:
                  datetimeFormatter:
                    hour: 'HH:mm'
            yaxis:
              - id: soc
                min: 0
                max: 100
                decimals: 0
              - id: power
                opposite: true
                min: 0
                align_to: 500
                decimals: 0
                apex_config:
                  stepSize: 500
            series:
              - entity: sensor.solis_s6_eh3p_total_pv_power
                name: Saulė
                yaxis_id: power
                color: '#2196f3'
                type: area
                opacity: 0.25
                stroke_width: 1
                group_by:
                  func: avg
                  duration: 5min
              - entity: sensor.solis_s6_eh3p_household_load_power
                name: Namai
                yaxis_id: power
                color: '#f44336'
                stroke_width: 1
                group_by:
                  func: avg
                  duration: 5min
              - entity: sensor.solis_s6_eh3p_battery_soc
                name: SOC
                yaxis_id: soc
                color: '#880e4f'
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 5min

  # Gilesnė analizė: vartojimo modelis, baterijos sveikata, ilgalaikiai
  # grafikai. Kasdieniam valdymui — pirmas puslapis.
  - title: Analizė
    path: analize
    icon: mdi:chart-box
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: glance
            title: Šiandienos rezultatas
            entities:
              - entity: sensor.self_sufficiency_today
                name: Savarankiškumas
                icon: mdi:home-percent
              - entity: sensor.energy_savings_today
                name: Sutaupyta
                icon: mdi:piggy-bank
              - entity: sensor.solis_s6_eh3p_today_energy_consumption
                name: Suvartota
              - entity: sensor.solis_s6_eh3p_today_energy_imported_from_grid
                name: Pirkta
              - entity: sensor.solis_s6_eh3p_today_energy_fed_into_grid
                name: Parduota
            show_state: true

          - type: glance
            title: Vartojimo modelis (AppDaemon)
            entities:
              - entity: sensor.consumption_daily_avg
                name: Paros vidurkis
                icon: mdi:counter
              - entity: sensor.consumption_remaining_today
                name: Liko šiandien
                icon: mdi:timer-sand
              - entity: sensor.consumption_forecast_tomorrow
                name: Rytoj
                icon: mdi:calendar-arrow-right
            show_state: true

      - type: grid
        cards:
          - type: glance
            title: Baterijos sveikata
            entities:
              - entity: sensor.solis_s6_eh3p_battery_soh
                name: SOH
                icon: mdi:battery-heart-variant
              - entity: sensor.battery_equivalent_cycles
                name: Ciklai
              - entity: sensor.solis_s6_eh3p_today_battery_charge_energy
                name: Įkrauta šiandien
                icon: mdi:battery-plus
              - entity: sensor.solis_s6_eh3p_today_battery_discharge_energy
                name: Iškrauta šiandien
                icon: mdi:battery-minus
            show_state: true

          - type: glance
            title: Inverteris
            entities:
              - entity: sensor.solis_s6_eh3p_temperature
                name: Temperatūra
              - entity: sensor.solis_s6_eh3p_status_string
                name: Būsena
              - entity: sensor.solis_s6_eh3p_grid_frequency
                name: Tinklo dažnis
            show_state: true

          # Sistemos nuostolių balansas iš lifetime skaitliukų: kur dingsta
          # energija — baterijos round-trip vs inverterio konversija + idle.
          - type: glance
            title: Efektyvumas ir nuostoliai (nuo įrengimo)
            entities:
              - entity: sensor.system_efficiency
                name: Sistema
              - entity: sensor.battery_roundtrip_efficiency
                name: Baterija
              - entity: sensor.battery_losses_total
                name: Bat. nuostoliai
              - entity: sensor.inverter_losses_total
                name: Inv. nuostoliai
            show_state: true

          # I²R nuostoliai 50 m 5×6 mm² kabelyje inverteris ↔ skydas,
          # skaičiuojami iš inverterio fazių srovių (R ≈ 0.146 Ω/gysla).
          - type: glance
            title: Kabelio nuostoliai (50 m, 5×6 mm²)
            entities:
              - entity: sensor.cable_loss_power
                name: Dabar
              - entity: sensor.cable_loss_percent
                name: Nuo srauto
              - entity: sensor.kabelio_nuostoliai_siandien
                name: Šiandien
              - entity: sensor.cable_loss_energy
                name: Iš viso
            show_state: true

      - type: grid
        column_span: 2
        cards:
          # 14 d. dienos balansas — gamyba, suvartojimas, tinklo mainai.
          # Dienos skaitliukai resetinasi vidurnaktį, todėl max per parą =
          # dienos suma.
          - type: custom:apexcharts-card
            header:
              show: true
              title: Dienos balansas (14 d. · kWh)
            graph_span: 14d
            update_interval: 5min
            span:
              end: day
            apex_config:
              chart:
                height: 280
                animations:
                  enabled: false
            yaxis:
              - min: 0
                decimals: 0
            series:
              - entity: sensor.solis_s6_eh3p_pv_today_energy_generation
                name: Saulė
                type: column
                color: '#fbc02d'
                group_by:
                  func: max
                  duration: 1d
              - entity: sensor.solis_s6_eh3p_today_energy_consumption
                name: Suvartota
                type: column
                color: '#f44336'
                group_by:
                  func: max
                  duration: 1d
              - entity: sensor.solis_s6_eh3p_today_energy_fed_into_grid
                name: Parduota
                type: column
                color: '#4caf50'
                group_by:
                  func: max
                  duration: 1d
              - entity: sensor.solis_s6_eh3p_today_energy_imported_from_grid
                name: Pirkta
                type: column
                color: '#9e9e9e'
                group_by:
                  func: max
                  duration: 1d

          # Inverterio temperatūra — derating prasideda ~75°C.
          - type: custom:apexcharts-card
            header:
              show: true
              title: Inverterio temperatūra (48 val.)
            graph_span: 48h
            update_interval: 5min
            apex_config:
              chart:
                height: 220
                animations:
                  enabled: false
            yaxis:
              - min: ~20
                decimals: 0
            series:
              - entity: sensor.solis_s6_eh3p_temperature
                name: Temperatūra °C
                color: '#ff7043'
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 15min

          # Baterijos round-trip efektyvumo trendas — audituose stebima tema
          # (lėtas dreifas žemyn nuo ~96 % birželį iki ~93 % liepą); vienas
          # skaičius glance kortelėje krypties neparodo.
          - type: custom:apexcharts-card
            header:
              show: true
              title: Baterijos round-trip efektyvumas (30 d.)
            graph_span: 30d
            update_interval: 10min
            span:
              end: day
            apex_config:
              chart:
                height: 220
                animations:
                  enabled: false
            yaxis:
              - min: 88
                max: 100
                decimals: 1
            series:
              - entity: sensor.battery_roundtrip_efficiency
                name: Round-trip %
                color: '#7e57c2'
                stroke_width: 2
                group_by:
                  func: last
                  duration: 1d

          # Solcast prognozės tikslumas per 30 d. — korekcijos koeficientas
          # (sensor.solcast_correction_factor) mokosi iš šių duomenų.
          - type: custom:apexcharts-card
            header:
              show: true
              title: Prognozės tikslumas (30 d.)
            graph_span: 30d
            update_interval: 10min
            span:
              end: day
            apex_config:
              chart:
                animations:
                  enabled: false
            yaxis:
              - min: 0
                decimals: 0
            series:
              - entity: sensor.solcast_forecast_yesterday_accuracy
                name: Tikslumas %
                type: column
                group_by:
                  func: last
                  duration: 1d
